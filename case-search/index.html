<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Search — Michigan Courts</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f4f1ec;color:#1a1a1a;min-height:100vh}
.page-hero{background:#0a1628;padding:28px 40px;border-bottom:3px solid #c8a84b}
.page-hero h2{font-family:'Merriweather',serif;color:#fff;font-size:24px;font-weight:300}
.page-hero p{color:#7a9bbf;font-size:13px;margin-top:6px}
.search-panel{background:#fff;border-bottom:1px solid #e0d9cf;padding:20px 40px}
.search-fields{display:grid;grid-template-columns:150px 1fr 1fr 1fr auto;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;font-weight:600;color:#6b5f4e;text-transform:uppercase;letter-spacing:.08em}
.field input,.field select{height:38px;padding:0 11px;border:1px solid #d6cfc4;border-radius:3px;font-size:13.5px;font-family:'DM Sans',sans-serif;background:#faf9f7;color:#1a1a1a;transition:border .15s}
.field input:focus,.field select:focus{outline:none;border-color:#0a1628}
.search-btn{height:38px;padding:0 26px;background:#0a1628;color:#c8a84b;border:none;border-radius:3px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;letter-spacing:.05em;cursor:pointer;white-space:nowrap;transition:background .15s}
.search-btn:hover{background:#102240}
.search-btn:disabled{opacity:.5;cursor:not-allowed}
.loading-bar{height:3px;background:#e0d9cf;overflow:hidden;position:relative}
.loading-bar-fill{height:100%;background:#c8a84b;width:0%;transition:width .3s ease}
.loading-bar-fill.indeterminate{width:40%;animation:slide 1s infinite linear}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.search-status{padding:8px 40px;font-size:12px;color:#9a8f82;background:#faf9f7;border-bottom:1px solid #f0ebe3;min-height:30px;display:flex;align-items:center;gap:8px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#c8a84b;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.results-area{padding:24px 40px;min-height:200px}
.results-empty{text-align:center;padding:50px 20px;color:#9a8f82}
.results-empty .icon{font-size:36px;margin-bottom:10px}
.results-empty p{font-size:14px}
.results-count{font-size:11.5px;color:#6b5f4e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e0d9cf}
.case-card{background:#fff;border:1px solid #e0d9cf;border-radius:4px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s}
.case-card:hover{border-color:#0a1628;transform:translateY(-1px)}
.case-card.supreme-case{border-left:4px solid #c8a84b}
.case-inner{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.case-title-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.case-title{font-family:'Merriweather',serif;font-size:15px;font-weight:400;color:#0a1628;line-height:1.3}
.supreme-pill{background:#c8a84b;color:#0a1628;font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:2px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.case-fields{display:flex;gap:24px;flex-wrap:wrap}
.cf .cl{font-size:10px;color:#9a8f82;text-transform:uppercase;letter-spacing:.07em;display:block}
.cf .cv{font-size:13px;color:#1a1a1a;font-weight:500}
.status-badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.s-open{background:#e8f0e8;color:#2a5a2a}
.s-closed{background:#f0e8e8;color:#5a2a2a}
.s-pending{background:#f0ece0;color:#5a4a1a}
.s-default{background:#eef1f0;color:#2a4a40}
.case-arrow{color:#c8a84b;font-size:18px}
/* Detail */
.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:7px 14px;background:#fff;border:1px solid #d6cfc4;border-radius:3px;font-size:13px;color:#0a1628;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:border-color .15s}
.back-btn:hover{border-color:#0a1628}
.detail-view{background:#fff;border:1px solid #e0d9cf;border-radius:4px;overflow:hidden}
.detail-hdr{background:#0a1628;padding:22px 28px}
.detail-hearing{background:#1e3a5f;border-left:3px solid #c8a84b;padding:9px 14px;margin-bottom:14px;font-size:12.5px;color:#a0c4e0;border-radius:2px}
.detail-hearing strong{color:#c8a84b}
.detail-title{font-family:'Merriweather',serif;color:#fff;font-size:21px;font-weight:300;line-height:1.3;margin-bottom:8px}
.detail-sub{color:#7a9bbf;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-body{padding:24px 28px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.dfield .dk{font-size:10px;color:#9a8f82;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.dfield .dv{font-size:13.5px;color:#1a1a1a;font-weight:500}
.portal-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 16px;background:#c8a84b;color:#0a1628;border-radius:3px;font-size:12px;font-weight:600;text-decoration:none;letter-spacing:.04em}
.portal-btn:hover{background:#d4b85e}
.tl-label{font-size:10.5px;color:#6b5f4e;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid #e0d9cf;font-weight:600}
.tl-group{margin-bottom:20px;padding-left:18px;border-left:2px solid #e0d9cf;position:relative}
.tl-group::before{content:'';position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:#c8a84b}
.tl-date{font-size:11.5px;font-weight:600;color:#0a1628;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tl-event{margin-bottom:10px;padding:10px 14px;background:#faf9f7;border:1px solid #f0ebe3;border-radius:3px}
.tl-meta{font-size:11px;color:#9a8f82;margin-bottom:5px;display:flex;gap:14px;flex-wrap:wrap}
.tl-desc{font-size:13px;color:#2a2a2a;line-height:1.6}
.tl-link{display:inline-block;margin-top:6px;font-size:12px;color:#1a4a7a;font-weight:600;text-decoration:none}
.tl-link:hover{text-decoration:underline}
</style>
</head>
<body data-nav="cases">
<div id="site-top"></div>

<div class="page-hero">
  <h2>Case Search</h2>
  <p>Search all District Court and Supreme Court case records by case number, title, or party name.</p>
</div>

<div class="search-panel">
  <div class="search-fields">
    <div class="field">
      <label>Court</label>
      <select id="courtFilter">
        <option value="">All Courts</option>
        <option value="supreme">Supreme Court</option>
        <option value="district">District Court</option>
      </select>
    </div>
    <div class="field">
      <label>Case Number</label>
      <input id="caseSearch" placeholder="e.g. 2026-SC-001" onkeydown="handleEnter(event)">
    </div>
    <div class="field">
      <label>Case Title</label>
      <input id="titleSearch" placeholder="e.g. People v. Smith" onkeydown="handleEnter(event)">
    </div>
    <div class="field">
      <label>Party / Username</label>
      <input id="userSearch" placeholder="Search by party name" onkeydown="handleEnter(event)">
    </div>
    <button class="search-btn" id="searchBtn" onclick="searchCases()">Search</button>
  </div>
</div>

<div class="loading-bar"><div class="loading-bar-fill" id="loadBar"></div></div>
<div class="search-status" id="searchStatus"></div>
<div class="results-area" id="resultsArea">
  <div class="results-empty"><div class="icon">⚖</div><p>Enter search terms above to find cases.</p></div>
</div>

<div id="site-footer"></div>
<script src="components.js"></script>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQZakTnz5DihZnyTEeO5iGB3u-9QXO_YCP9PCzeZJWm53QNAsauMav3dWNJ_ce_ZCwMHIghNa4ujx4U/pub?output=csv";
let csvData=null, lastMatches=[], loadPromise=null;

function setStatus(msg, loading=false){
  const el=document.getElementById('searchStatus');
  const bar=document.getElementById('loadBar');
  if(loading){
    el.innerHTML=`<span class="status-dot"></span>${msg}`;
    bar.classList.add('indeterminate');
  } else {
    el.innerHTML=msg;
    bar.classList.remove('indeterminate');
    bar.style.width='0%';
  }
}

function parseCSV(text){
  return text.split(/\r?\n/).map(row=>{
    const vals=[]; let cur="", inQ=false;
    for(const ch of row){
      if(ch==='"'){inQ=!inQ;continue;}
      if(ch===','&&!inQ){vals.push(cur);cur="";continue;}
      cur+=ch;
    }
    vals.push(cur);
    return vals.map(v=>v.trim());
  });
}

function preloadCSV(){
  if(loadPromise) return loadPromise;
  setStatus('Loading case data…', true);
  loadPromise = fetch(CSV_URL)
    .then(r=>r.text())
    .then(txt=>{
      csvData=parseCSV(txt);
      setStatus(`<span style="color:#2a5a2a;font-weight:600">✓</span> Case database ready — ${csvData.length-1} cases loaded`);
      document.getElementById('searchBtn').disabled=false;
      return csvData;
    })
    .catch(()=>{
      setStatus('⚠ Could not load case data. Check your connection.');
      loadPromise=null;
    });
  return loadPromise;
}

// Start loading immediately on page open
document.getElementById('searchBtn').disabled=true;
preloadCSV();

function handleEnter(e){if(e.key==="Enter")searchCases();}
function get(row,h,name){const i=h.indexOf(name);return i>-1?row[i]||"":" ";}
function parseDate(v){const d=new Date(v);return isNaN(d)?new Date(0):d;}
function parseNextHearing(v){if(!v)return null;const p=v.split(",").map(x=>x.trim());return{date:p[0],court:p[1],type:p.slice(2).join(",")};}
function parseEvents(s){
  if(!s)return[];
  return s.split("|").map(e=>{
    const p=e.split("\\").map(v=>v.trim());
    return{date:p[0]||"",party:p[1]==="NADNS"?null:p[1],judge:p[2]==="NADNS"?null:p[2],desc:p[3]==="NADNS"?null:p[3],url:p[4]==="NADNS"?null:p[4]};
  });
}
function sc(s){
  if(!s)return's-default';
  const l=s.toLowerCase();
  if(l.includes('open')||l.includes('active'))return's-open';
  if(l.includes('closed')||l.includes('dismissed'))return's-closed';
  if(l.includes('pending')||l.includes('scheduled'))return's-pending';
  return's-default';
}
function safe(v){return(!v||v==="NADNS")?null:v;}

async function searchCases(){
  if(!csvData){ await preloadCSV(); if(!csvData)return; }
  const cq=document.getElementById('caseSearch').value.toLowerCase().trim();
  const tq=document.getElementById('titleSearch').value.toLowerCase().trim();
  const uq=document.getElementById('userSearch').value.toLowerCase().trim();
  const cf=document.getElementById('courtFilter').value;
  const h=csvData[0];

  lastMatches=csvData.slice(1).filter(r=>{
    if(!r[0]&&!r[1])return false;
    const court=(get(r,h,"Court")||"").toLowerCase();
    if(cf==="supreme"&&!court.includes("supreme"))return false;
    if(cf==="district"&&court.includes("supreme"))return false;
    return(!cq||get(r,h,"Case No").toLowerCase().includes(cq))&&
           (!tq||get(r,h,"Title").toLowerCase().includes(tq))&&
           (!uq||get(r,h,"Filing Party").toLowerCase().includes(uq)||get(r,h,"Opposing Party").toLowerCase().includes(uq));
  });

  lastMatches.sort((a,b)=>{
    const ca=get(a,h,"Court").toLowerCase(),cb=get(b,h,"Court").toLowerCase();
    if(ca.includes("supreme")&&!cb.includes("supreme"))return-1;
    if(cb.includes("supreme")&&!ca.includes("supreme"))return 1;
    return parseDate(get(b,h,"File Date"))-parseDate(get(a,h,"File Date"));
  });

  const area=document.getElementById('resultsArea');
  if(!lastMatches.length){
    area.innerHTML=`<div class="results-empty"><div class="icon">🔍</div><p>No cases found matching your search criteria.</p></div>`;
    setStatus('No results found.');
    return;
  }

  setStatus(`<span style="color:#2a5a2a;font-weight:600">✓</span> ${lastMatches.length} case${lastMatches.length!==1?'s':''} found`);
  area.innerHTML=`<div class="results-count">${lastMatches.length} result${lastMatches.length!==1?'s':''}</div>`;
  lastMatches.forEach((r,i)=>{
    const court=get(r,h,"Court"), isS=court.toLowerCase().includes("supreme");
    const status=get(r,h,"Status"), judge=get(r,h,"Judge");
    area.innerHTML+=`
      <div class="case-card${isS?' supreme-case':''}" onclick="showDetail(${i})">
        <div class="case-inner">
          <div>
            <div class="case-title-row">
              <div class="case-title">${get(r,h,"Title")||"Untitled Case"}</div>
              ${isS?`<span class="supreme-pill">Supreme Court</span>`:''}
            </div>
            <div class="case-fields">
              <div class="cf"><span class="cl">Case No</span><span class="cv">${get(r,h,"Case No")||"—"}</span></div>
              <div class="cf"><span class="cl">Court</span><span class="cv">${court||"—"}</span></div>
              <div class="cf"><span class="cl">Status</span><span class="cv"><span class="status-badge ${sc(status)}">${status||"—"}</span></span></div>
              <div class="cf"><span class="cl">Filed</span><span class="cv">${get(r,h,"File Date")||"—"}</span></div>
              ${judge&&judge.trim()?`<div class="cf"><span class="cl">Judge</span><span class="cv">${judge}</span></div>`:''}
            </div>
          </div>
          <div class="case-arrow">›</div>
        </div>
      </div>`;
  });
}

function showDetail(i){
  const h=csvData[0], r=lastMatches[i];
  const court=get(r,h,"Court"), isS=court.toLowerCase().includes("supreme");
  const next=parseNextHearing(get(r,h,"Next Hearing"));
  const portal=get(r,h,"Link"), status=get(r,h,"Status");
  const events=parseEvents(get(r,h,"Summary"));
  const grouped={};
  events.forEach(e=>{if(!grouped[e.date])grouped[e.date]=[];grouped[e.date].push(e);});
  const fields=[
    ["Case No",get(r,h,"Case No")],["Court",court],["Status",status],
    ["Judge",get(r,h,"Judge")],["Matter",get(r,h,"Matter")],["Date Filed",get(r,h,"File Date")],
    ["Filing Party",get(r,h,"Filing Party")],["Opposing Party",get(r,h,"Opposing Party")],["Date Closed",get(r,h,"Close Date")]
  ];
  const area=document.getElementById('resultsArea');
  setStatus(`Viewing: ${get(r,h,"Title")||"Case"}`);
  area.innerHTML=`
    <button class="back-btn" onclick="searchCases()">← Back to Results</button>
    <div class="detail-view">
      <div class="detail-hdr">
        ${next?`<div class="detail-hearing">📅 Hearing in the <strong>${next.court}</strong> on <strong>${next.date}</strong>${next.type?` · ${next.type}`:''}</div>`:''}
        <div class="detail-title">${get(r,h,"Title")||"Untitled Case"}</div>
        <div class="detail-sub">
          <span>${get(r,h,"Case No")||""}</span>
          ${isS?`<span style="background:#c8a84b;color:#0a1628;font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:2px;text-transform:uppercase">Supreme Court</span>`:''}
          <span class="status-badge ${sc(status)}">${status||""}</span>
        </div>
        ${portal?`<a href="${portal}" target="_blank" class="portal-btn">↗ Open in Case Tracker</a>`:''}
      </div>
      <div class="detail-body">
        <div class="detail-grid">
          ${fields.map(([label,val])=>`<div class="dfield"><div class="dk">${label}</div><div class="dv">${safe(val)||"—"}</div></div>`).join("")}
        </div>
        ${Object.keys(grouped).length?`
          <div class="tl-label">Case Timeline</div>
          ${Object.keys(grouped).map(date=>`
            <div class="tl-group">
              <div class="tl-date">${date}</div>
              ${grouped[date].map(e=>`
                <div class="tl-event">
                  <div class="tl-meta">
                    ${e.party?`<span>Party: ${e.party}</span>`:''}
                    ${e.judge?`<span>Judge: ${e.judge}</span>`:''}
                  </div>
                  ${e.desc?`<div class="tl-desc">${e.desc.replace(/\n/g,'<br>')}</div>`:''}
                  ${e.url?`<a class="tl-link" href="${e.url}" target="_blank">↓ Download Document</a>`:''}
                </div>`).join('')}
            </div>`).join('')}
        `:''}
      </div>
    </div>`;
}
</script>
</body>
</html>

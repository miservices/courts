<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Document | Michigan Courts</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10264a;--navy2:#1b3a6b;--ink:#1b2433;--muted:#5b6678;--line:#d3dae6;--bg:#e4e9f2;--red:#b3261e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
header.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top .brand{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:17px;color:var(--navy);padding-right:18px;border-right:1px solid var(--line)}
header.top .brand small{display:block;font:600 10.5px 'Public Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
header.top .meta{flex:1;min-width:200px}
header.top .meta b{display:block;font-size:15.5px;color:var(--navy);overflow-wrap:anywhere}header.top .meta span{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 13.5px 'Public Sans',sans-serif;border-radius:7px;padding:8px 15px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:background .12s}
.btn:hover{background:var(--navy2)}.btn.o{background:#fff;color:var(--navy);border-color:#c5cedd}.btn.o:hover{background:#f1f4f9}
.btn.w{background:#fff;color:#8a2a00;border-color:#e3b99f}.btn.w:hover{background:#fff4ec}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #1f5fae;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 12px 'Public Sans',sans-serif;border-radius:999px;padding:4px 11px;background:#eef2f9;color:#3a4558}
.chip i{width:8px;height:8px;border-radius:50%;background:#8a97ad}.chip.ok{background:#e4f3e8;color:#14532d}.chip.ok i{background:#1e8a45}.chip.op{background:#fff3d6;color:#7a5200}.chip.op i{background:#e0a100}
#staff{background:#fff8e6;border-bottom:1px solid #f0d99a;color:#5c4300;font-size:13px;padding:8px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#staff[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#10264a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.3);transition:.2s;z-index:50;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%)}#toast.e{background:#8f1d17}
.mbk{position:fixed;inset:0;background:rgba(16,38,74,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mdl{background:#fff;border-radius:13px;padding:24px 26px;width:min(460px,100%);box-shadow:0 16px 48px rgba(0,0,0,.35)}.mdl h3{margin:0 0 8px;font:700 19px 'Source Serif 4',Georgia,serif;color:var(--navy)}.mdl p{margin:0 0 20px;color:var(--muted);line-height:1.55;font-size:14px}.mdl div{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
main{flex:1;display:flex;flex-direction:column;padding:18px 16px 24px;min-height:0}
#host{flex:1;min-height:0}
.fd-wrap{display:block;min-height:480px}.fd-panel{display:none!important}.fd-view{height:100%}
.fd-frame{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#e9ebee;display:block}
.msg{max-width:560px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:28px 30px}
.msg h1{font-family:'Source Serif 4',Georgia,serif;font-size:22px;margin:0 0 8px;color:var(--navy)}
.msg p{margin:0 0 16px;line-height:1.55;color:var(--muted)}
.msg a.btn{background:var(--navy);color:#fff;border-color:var(--navy)}
.spin{width:22px;height:22px;border:3px solid #b8cdee;border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
.ld{text-align:center;margin:12vh auto;color:var(--muted)}
#pdfv{overflow:auto;height:100%;background:#cfd6e3;border:1px solid var(--line);border-radius:8px;padding:14px 0}
.pgw{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25)}.pgw canvas{display:block;width:100%;height:auto}
.unof{position:absolute;left:0;right:0;bottom:0;background:#eef1f6;border-top:2px solid var(--navy);font:11px/15px Arial,sans-serif;color:var(--navy);padding:5px 12px;text-align:center}
@media print{#pdfv{overflow:visible;background:#fff;border:0;padding:0}.pgw{box-shadow:none;margin:0;break-after:page}header.top,#staff{display:none!important}}
@media print{header.top,#staff,#toast{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Michigan Courts<small>Court document</small></div>
  <div class="meta"><b id="t">Loading document…</b><span id="s"></span></div>
  <span class="chip" id="lk" hidden><i></i><span></span></span>
  <div class="acts" id="acts" hidden>
    <button class="btn o" id="md" type="button">Download .md</button>
    <button class="btn o" id="prt" type="button">Print</button>
    <button class="btn" id="pdf" type="button">Download PDF</button>
  </div>
</header>
<div id="staff" hidden><b>Court staff</b><span id="stxt"></span><span style="flex:1"></span><button class="btn o" id="edst" type="button">Edit stamps</button><button class="btn w" id="fin" type="button">Finalize stamps</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<main><div id="host"><div class="ld"><div class="spin"></div>Opening the document…</div></div></main>

<script type="module">

const app = initializeApp({
  apiKey: "AIzaSyA8sUFIq81cs6uQvqduardpGJ4R2DxO8NQ", authDomain: "micourt-dada6.firebaseapp.com", projectId: "micourt-dada6",
  storageBucket: "micourt-dada6.firebasestorage.app", messagingSenderId: "1013564619997", appId: "1:1013564619997:web:8f259dab457915758f6f34"

const auth = getAuth(app), storage = getStorage(app), db = getFirestore(app);
const FORMS = '/courts/online-services/portal/dashboard/assets/forms/';

/* #/filingUploads/<confirmation>/<file>.md  (each part percent-encoded) */

const SC = 'storage/object-not-found';
let tt = 0;

function chips() { const lk = $('lk'); lk.hidden = !stampRec; if (!stampRec) return; const l = !!stampRec.locked; lk.className = 'chip ' + (l ? 'ok' : 'op'); lk.lastChild.textContent = l ? 'Stamps finalized' : 'Stamps not finalized'; lk.title = l ? `Finalized${stampRec.lockedByName ? ' by ' + stampRec.lockedByName : ''}${stampRec.lockedAt ? ' on ' + fmtD(stampRec.lockedAt) : ''}` : 'Court staff may still adjust the stamps.';

  const done = v => { b.remove(); res(v); }; n.onclick = () => done(false); y.onclick = () => done(true); b.onclick = e => { if (e.target === b) done(false); }; b.onkeydown = e => { if (e.key === 'Escape') done(false); }; });

/* Every document carries the court stamp. One that has no record yet (filed before stamps existed) gets one built from the file's upload date. */
async function loadStamp(path) {

  }
  if (auth.currentUser) try { const a = await getDoc(doc(db, 'accounts', auth.currentUser.uid)); const r = a.exists() ? a.data().role : ''; myName = a.exists() ? String(a.data().name || '').trim() : ''; isStaff = STAFF_ROLES.includes(r); canMove = isStaff && !st.locked; } catch { canMove = false; }

}
/* Save a change to the stamp (position, ink, tilt, size, lock). A stamp built on the fly is created first (unlocked, as the rules require), then updated.

async function saveStamp(p) {

/* Court staff open the stamp editor to move the stamp, seal and certification. Nothing is added or removed there; the seal and certification

    const out = await openStampEditor({ pdf: pdfBytes, md: mdText, label: stampRec.label, date: stampRec.date, title: $('t').textContent, marks: { stamp: pick(stampRec), seal: stampRec.seal, cert: stampRec.cert } });
    if (!out) { ed.disabled = fin.disabled = false; return; }
    if (await saveStamp({ ...out.stamp, seal: out.seal, cert: out.cert })) { sessionStorage.setItem('flash', 'Stamp positions saved.'); location.reload(); } else ed.disabled = fin.disabled = false;
  };

    if (!await ask('Finalize the stamps?', 'This locks the stamp, seal and certification on this document for everyone, including court staff. It cannot be undone.', 'Finalize stamps')) return;
    ed.disabled = fin.disabled = true;
    if (await saveStamp({ locked: true, lockedBy: auth.currentUser.uid, lockedByName: myName || 'Court staff', lockedAt: Date.now() })) { sessionStorage.setItem('flash', 'Stamps finalized. They can no longer be changed.'); location.reload(); } else ed.disabled = fin.disabled = false;

async function open() {
  const my = ++token; shown = false; pdfBytes = null; pdfStamp = null; $('md').hidden = false; $('edst').hidden = $('fin').hidden = true; mdText = null; engine?.destroy(); engine = null; $('acts').hidden = true; $('lk').hidden = $('staff').hidden = true; 
  const path = pathOf();
  if (!path || !/^(filingUploads|case-orders)\/[^/]+\/[^/]+\.(md|pdf)$/i.test(path)) return card('No document selected', 'This page opens court documents from a link on a docket or filing. Return to the page you came from and choose the document again.', ['Open the Online Portal', PORTAL]);
  $('host').innerHTML = '<div class="ld"><div class="spin"></div>Opening the document…</div>';
  await auth.authStateReady(); if (my !== token) return;
  await loadStamp(path); if (my !== token) return;
  if (/\.pdf$/i.test(path)) return openPdf(my, path);
  let text;
  try { text = new TextDecoder().decode(await getBytes(ref(storage, path), 4 * 1024 * 1024)); }
  catch (e) { console.error(e); if (my !== token) return; return card(e?.code === SC ? 'Document not found' : e?.code === 'storage/unauthorized' ? 'You do not have access' : 'We could not open this document', e?.code === SC ? 'This document may have been removed.' : e?.code === 'storage/unauthorized' ? (auth.currentUser ? 'Your account is not allowed to view this document.' : 'This document is not open to the public. Sign in to the Online Portal and open it again.') : 'Check your connection and try again.'); }
  if (my !== token) return;
  mdText = text; { const pl = placementOf(text); if (stampRec.synth && pl.stamp) stampRec = { ...stampRec, ...pl.stamp }; if (!stampRec.seal && pl.seal) stampRec = { ...stampRec, seal: pl.seal }; if (!stampRec.cert && pl.certification) stampRec = { ...stampRec, cert: pl.certification }; }
  try {
    const [{ byNumber }, { formOf, mountForm }] = await Promise.all([import(FORMS + 'registry.js?v=8'), import(FORMS + 'engine.js?v=33')]);
    const num = formOf(text), form = num && byNumber(num);
    if (!form) return card('This document cannot be shown', num ? `It was prepared on form "${num}", which this viewer does not support yet.` : 'We could not tell which form this file is for.');
    const def = (await import(`${FORMS}${form.id}.js?v=22`)).default; if (my !== token) return;
    $('host').innerHTML = '';
    engine = await mountForm(def, $('host'), { md: text, readOnly: true, stamp: { ...stampRec }, onNote: (t, b) => { if (shown && b) bad(t); } });
    if (my !== token) { engine.destroy(); return; }
    staffTools();
    shown = true; const c = engine.getCase(), title = `${def.number} · ${def.title}`;
    $('t').textContent = title; $('s').textContent = [c.caseno && 'Case ' + c.caseno, c.judge].filter(Boolean).join(' · '); document.title = title + ' | Michigan Courts'; $('acts').hidden = false; chips();

  catch (e) { console.error(e); if (my !== token) return; return card(e?.code === SC ? 'Document not found' : e?.code === 'storage/unauthorized' ? 'You do not have access' : 'We could not open this document', 'Go back and try the link again.'); }

    $('host').innerHTML = '<div id="pdfv"></div>'; const view = $('pdfv'), W = Math.min(816, Math.max(320, view.clientWidth - 24));

/* A downloaded copy carries the sticker and the stamp, drawn onto the original pages. */

$('pdf').onclick = async () => {
  if (pdfBytes) { $('pdf').disabled = true; try { const out = await stampedPdf(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'application/pdf' })); a.download = ($('t').textContent || 'document.pdf').replace(/[^\w.\- ]+/g, '_'); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100); } catch (e) { console.error(e); bad('We could not make the PDF. Use Print instead.'); } finally { $('pdf').disabled = false; } return; }

$('prt').onclick = () => pdfBytes ? window.print() : engine?.print();
$('md').onclick = () => engine?.exportMd();
try { const f = sessionStorage.getItem('flash'); if (f) { sessionStorage.removeItem('flash'); setTimeout(() => good(f), 600); } } catch { }

open();
</script>

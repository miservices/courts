<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Document | Michigan Courts</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10264a;--navy2:#1b3a6b;--ink:#1b2433;--muted:#5b6678;--line:#d3dae6;--bg:#e4e9f2;--red:#b3261e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
header.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top .brand{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:17px;letter-spacing:.01em}
header.top .brand small{display:block;font:500 11px 'Public Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#aebfdc}
header.top .meta{flex:1;min-width:180px}
header.top .meta b{display:block;font-size:15px}header.top .meta span{font-size:12.5px;color:#c6d3ea}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 13.5px 'Public Sans',sans-serif;border-radius:6px;padding:8px 14px;border:1.5px solid #fff;background:#fff;color:var(--navy);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.o{background:transparent;color:#fff;border-color:#7f95bd}.btn:hover{filter:brightness(.95)}.btn.o:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid #ffd666;outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;padding:14px 16px 18px;min-height:0}
#host{flex:1;min-height:0}
.fd-wrap{display:block;min-height:480px}.fd-panel{display:none!important}.fd-view{height:100%}
.fd-frame{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#e9ebee;display:block}
.msg{max-width:560px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:28px 30px}
.msg h1{font-family:'Source Serif 4',Georgia,serif;font-size:22px;margin:0 0 8px;color:var(--navy)}
.msg p{margin:0 0 16px;line-height:1.55;color:var(--muted)}
.msg a.btn{background:var(--navy);color:#fff;border-color:var(--navy)}
.spin{width:22px;height:22px;border:3px solid #b8cdee;border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
.ld{text-align:center;margin:12vh auto;color:var(--muted)}
#sc{width:100%;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#dbe5f7;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}#sc[hidden],#mk[hidden]{display:none}
#mk{width:100%;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#dbe5f7;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}#mk select{font:inherit;font-size:12.5px;padding:3px 6px;border-radius:5px}#mk .btn{padding:4px 10px;font-size:12px}#mk .btn[aria-pressed=true]{background:#ffd666;color:#10264a;border-color:#ffd666}#mk small{color:#aebfdc}#mk .mrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%}#mk input[type=range]{width:90px;vertical-align:middle}
#sc label{display:flex;align-items:center;gap:8px}#sc input[type=range]{width:130px;accent-color:#ffd666}#sc .btn{padding:4px 10px;font-size:12px}
#note{font-size:12.5px;color:#c6d3ea;min-height:16px;width:100%}
#pdfv{overflow:auto;height:100%;background:#cfd6e3;border:1px solid var(--line);border-radius:8px;padding:14px 0}
.pgw{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25)}.pgw canvas{display:block;width:100%;height:auto}
.unof{position:absolute;left:0;right:0;bottom:0;background:#eef1f6;border-top:2px solid var(--navy);font:11px/15px Arial,sans-serif;color:var(--navy);padding:5px 12px;text-align:center}
@media print{#pdfv{overflow:visible;background:#fff;border:0;padding:0}.pgw{box-shadow:none;margin:0;break-after:page}header.top{display:none}}
@media print{header.top{display:none}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Michigan Courts<small>Court document</small></div>
  <div class="meta"><b id="t">Loading document…</b><span id="s"></span></div>
  <div class="acts" id="acts" hidden>
    <button class="btn" id="pdf" type="button">Download PDF</button>
    <button class="btn o" id="prt" type="button">Print</button>
    <button class="btn o" id="md" type="button">Download .md</button>
    <button class="btn o" id="edst" type="button" hidden>Edit stamps</button>
    <button class="btn o" id="fin" type="button" hidden>Finalize stamps</button>
  </div>
  <div id="note" role="status" aria-live="polite"></div>
</header>
<main><div id="host"><div class="ld"><div class="spin"></div>Opening the document…</div></div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getStorage, ref, getBytes, getMetadata } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { drawMarks } from '/courts/online-services/portal/dashboard/assets/forms/marks.js?v=3';
import { placementOf } from '/courts/online-services/portal/dashboard/assets/forms/engine.js?v=33';
import { openStampEditor } from '/courts/online-services/portal/dashboard/assets/forms/stampeditor.js?v=1';

const app = initializeApp({
  apiKey: "AIzaSyA8sUFIq81cs6uQvqduardpGJ4R2DxO8NQ", authDomain: "micourt-dada6.firebaseapp.com", projectId: "micourt-dada6",
  storageBucket: "micourt-dada6.firebasestorage.app", messagingSenderId: "1013564619997", appId: "1:1013564619997:web:8f259dab457915758f6f34"
});
const auth = getAuth(app), storage = getStorage(app), db = getFirestore(app);
const FORMS = '/courts/online-services/portal/dashboard/assets/forms/';
const PORTAL = 'https://migovt.org/courts/online-services/portal/';
const $ = id => document.getElementById(id);
const STAFF_ROLES = ['Court Reporter', 'Law Clerk', 'Judicial Assistant', 'Deputy Clerk', 'County Clerk', 'Court Administrator', 'Magistrate', 'Judge', 'Chief Judge', 'Deputy Clerk of the Supreme Court', 'Clerk of the Supreme Court', 'Reporter of Decisions', 'State Court Administrator', 'Justice', 'Chief Justice'];
let isStaff = false, myName = '', mdText = null, engine = null, token = 0, shown = false, pdfBytes = null, pdfStamp = null, pdfSticker = null;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });

const card = (title, text, link) => { $('host').innerHTML = `<div class="msg" role="alert"><h1></h1><p></p>${link ? `<a class="btn" href="${link[1]}">${link[0]}</a>` : ''}</div>`; $('host').querySelector('h1').textContent = title; $('host').querySelector('p').textContent = text; $('t').textContent = title; $('s').textContent = ''; $('acts').hidden = true; };
/* #/filingUploads/<confirmation>/<file>.md  (each part percent-encoded) */
const pathOf = () => { const h = location.hash.replace(/^#\/?/, ''); if (!h) return null; try { return h.split('/').map(decodeURIComponent).join('/'); } catch { return null; } };

/* The folder sticker: the document ID (the filing number, plus the document's number when it has one), the filing date and the court. */
const stickerOf = (path, st) => ({ id: (st && st.docId) || path.split('/')[1] || 'DOCUMENT', date: st?.date || '', label: st?.label || '' });
const SC = 'storage/object-not-found';
const bad = (t) => { $('note').textContent = t; $('note').style.color = '#ffb4ab'; }, good = t => { $('note').textContent = t; $('note').style.color = '#c6d3ea'; };
let stampRec = null, stampRef = null, canMove = false;

/* Every document carries the court stamp. One that has no record yet (filed before stamps existed) gets one built from the file's upload date. */
async function loadStamp(path) {
  stampRef = doc(db, 'docStamps', path.split('/').join('__')); let st = null;
  try { const sn = await getDoc(stampRef); st = sn.exists() ? sn.data() : null; } catch (e) { console.warn('Stamp unavailable', e); }
  if (!st) {
    let dt = new Date(); try { dt = new Date((await getMetadata(ref(storage, path))).timeCreated); } catch { }
    const p2 = n => String(n).padStart(2, '0'), cn = path.split('/')[1] || '';
    st = { synth: true, path, date: `${p2(dt.getMonth() + 1)}/${p2(dt.getDate())}/${dt.getFullYear()}`, label: /^MSC/i.test(cn) ? 'MI SUPREME COURT' : '7TH DISTRICT COURT', x: 0.7, y: 0.004, page: 1 };
  }
  if (auth.currentUser) try { const a = await getDoc(doc(db, 'accounts', auth.currentUser.uid)); const r = a.exists() ? a.data().role : ''; myName = a.exists() ? String(a.data().name || '').trim() : ''; isStaff = STAFF_ROLES.includes(r); canMove = isStaff && !st.locked; } catch { canMove = false; }
  stampRec = st;
}
/* Save a change to the stamp (position, ink, tilt, size). A stamp built on the fly is saved in full the first time. */
async function saveStamp(p) {
  if (!auth.currentUser) return;
  try { const base = stampRec.synth ? { path: stampRec.path, label: stampRec.label, date: stampRec.date, filedByUid: auth.currentUser.uid, x: stampRec.x, y: stampRec.y, page: stampRec.page } : {};
    await setDoc(stampRef, { ...base, ...p, movedBy: auth.currentUser.uid, movedAt: Date.now() }, { merge: true }); stampRec = { ...stampRec, ...p, synth: false }; good('Stamp saved.'); }
  catch (e) { console.error(e); bad('We could not save the stamp change.'); }
}
/* Court staff open the stamp editor to move the stamp, seal and certification. Nothing is added or removed there; the seal and certification
   appear only on certified copies. Once the court finalizes them, nobody can change them. */
function staffTools() {
  const ed = $('edst'), fin = $('fin'); ed.hidden = fin.hidden = !canMove;
  ed.onclick = async () => {
    ed.disabled = true; const pick = o => o && o.x !== undefined ? { x: o.x, y: o.y, page: o.page, rot: o.rot, ink: o.ink, scale: o.scale } : undefined;
    const out = await openStampEditor({ pdf: pdfBytes, md: mdText, label: stampRec.label, date: stampRec.date, marks: { stamp: pick(stampRec), seal: stampRec.seal, cert: stampRec.cert } });
    ed.disabled = false; if (!out) return;
    await saveStamp({ ...out.stamp, seal: out.seal, cert: out.cert }); location.reload();
  };
  let armed = 0; fin.onclick = async () => { if (!armed) { armed = 1; fin.textContent = 'Click again to finalize for good'; setTimeout(() => { armed = 0; fin.textContent = 'Finalize stamps'; }, 6000); return; }
    fin.disabled = true; await saveStamp({ locked: true, lockedBy: auth.currentUser.uid, lockedAt: Date.now() }); location.reload(); };
}
async function open() {
  const my = ++token; shown = false; pdfBytes = null; pdfStamp = null; $('md').hidden = false; $('edst').hidden = $('fin').hidden = true; mdText = null; engine?.destroy(); engine = null; $('acts').hidden = true; $('note').textContent = '';
  const path = pathOf();
  if (!path || !/^(filingUploads|case-orders)\/[^/]+\/[^/]+\.(md|pdf)$/i.test(path)) return card('No document selected', 'This page opens court documents from a link on a docket or filing. Return to the page you came from and choose the document again.', ['Open the Online Portal', PORTAL]);
  $('host').innerHTML = '<div class="ld"><div class="spin"></div>Opening the document…</div>';
  await auth.authStateReady(); if (my !== token) return;
  await loadStamp(path); if (my !== token) return;
  if (/\.pdf$/i.test(path)) return openPdf(my, path);
  let text;
  try { text = new TextDecoder().decode(await getBytes(ref(storage, path), 4 * 1024 * 1024)); }
  catch (e) { console.error(e); if (my !== token) return; return card(e?.code === SC ? 'Document not found' : e?.code === 'storage/unauthorized' ? 'You do not have access' : 'We could not open this document', e?.code === SC ? 'This document may have been removed.' : e?.code === 'storage/unauthorized' ? (auth.currentUser ? 'Your account is not allowed to view this document.' : 'This document is not open to the public. Sign in to the Online Portal and open it again.') : 'Check your connection and try again.'); }
  if (my !== token) return;
  mdText = text; { const pl = placementOf(text); if (stampRec.synth && pl.stamp) stampRec = { ...stampRec, ...pl.stamp }; if (!stampRec.seal && pl.seal) stampRec = { ...stampRec, seal: pl.seal }; if (!stampRec.cert && pl.certification) stampRec = { ...stampRec, cert: pl.certification }; }
  try {
    const [{ byNumber }, { formOf, mountForm }] = await Promise.all([import(FORMS + 'registry.js?v=8'), import(FORMS + 'engine.js?v=33')]);
    const num = formOf(text), form = num && byNumber(num);
    if (!form) return card('This document cannot be shown', num ? `It was prepared on form "${num}", which this viewer does not support yet.` : 'We could not tell which form this file is for.');
    const def = (await import(`${FORMS}${form.id}.js?v=22`)).default; if (my !== token) return;
    $('host').innerHTML = '';
    engine = await mountForm(def, $('host'), { md: text, readOnly: true, stamp: { ...stampRec }, onNote: (t, b) => { if (!shown && !b) return; $('note').textContent = t; $('note').style.color = b ? '#ffb4ab' : '#c6d3ea'; } });
    if (my !== token) { engine.destroy(); return; }
    staffTools();
    shown = true; const c = engine.getCase(), title = `${def.number} · ${def.title}`;
    $('t').textContent = title; $('s').textContent = [c.caseno && 'Case ' + c.caseno, c.judge].filter(Boolean).join(' · '); document.title = title + ' | Michigan Courts'; $('acts').hidden = false;
  } catch (e) { console.error(e); if (my === token) card('We could not display this document', 'Refresh the page and try again.'); }
}
async function openPdf(my, path) {
  let bytes;
  try { bytes = await getBytes(ref(storage, path), 8 * 1024 * 1024); }
  catch (e) { console.error(e); if (my !== token) return; return card(e?.code === SC ? 'Document not found' : e?.code === 'storage/unauthorized' ? 'You do not have access' : 'We could not open this document', 'Go back and try the link again.'); }
  if (my !== token) return;
  try {
    if (!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const { stampSvg } = await import(FORMS + 'engine.js?v=33');
    pdfBytes = bytes; pdfSticker = stickerOf(path, stampRec);
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise; if (my !== token) return;
    $('host').innerHTML = '<div id="pdfv"></div>'; const view = $('pdfv'), W = Math.min(816, Math.max(320, view.clientWidth - 24));
    for (let n = 1; n <= pdf.numPages; n++) {
      const pg = await pdf.getPage(n), vp0 = pg.getViewport({ scale: 1 }), sc = (W / vp0.width), vp = pg.getViewport({ scale: sc * 2 }), cv = document.createElement('canvas'), w = document.createElement('div');
      cv.width = vp.width; cv.height = vp.height; w.className = 'pgw'; w.style.width = W + 'px'; w.appendChild(cv); view.appendChild(w);
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise; if (my !== token) return;
    }
    const pages = [...view.querySelectorAll('.pgw')]; pdfStamp = stampRec;
    /* The stamp: placed by fraction of the page, drawn at the same size as on court forms (176 px on an 816 px page). */
    { const host = document.createElement('div'); host.innerHTML = stampSvg({ ...stampRec, move: false }); const sv = host.firstElementChild; sv.style.width = (176 * (stampRec.scale || 1) / 816 * 100) + '%'; sv.style.height = 'auto'; sv.removeAttribute('height'); sv.removeAttribute('width');
      pages[Math.min(pages.length, Math.max(1, stampRec.page || 1)) - 1].appendChild(sv); }
    staffTools();
    shown = true; document.title = 'Court document | Michigan Courts'; $('t').textContent = decodeURIComponent(path.split('/').pop()); $('s').textContent = `${stampRec.label} · ${stampRec.date}`; $('acts').hidden = false; $('md').hidden = true; $('pdf').textContent = 'Download PDF';
  } catch (e) { console.error(e); if (my === token) card('We could not display this document', 'Refresh the page and try again.'); }
}
/* A downloaded copy carries the sticker and the stamp, drawn onto the original pages. */
async function stampedPdf() {
  if (!window.PDFLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
  const d = await PDFLib.PDFDocument.load(pdfBytes.slice(0));
  await drawMarks(PDFLib, d, { stamp: pdfStamp });
  return d.save();
}
$('pdf').onclick = async () => {
  if (pdfBytes) { $('pdf').disabled = true; try { const out = await stampedPdf(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'application/pdf' })); a.download = ($('t').textContent || 'document.pdf').replace(/[^\w.\- ]+/g, '_'); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100); } catch (e) { console.error(e); $('note').textContent = 'We could not make the PDF. Use Print instead.'; $('note').style.color = '#ffb4ab'; } finally { $('pdf').disabled = false; } return; }
 $('pdf').disabled = true; try { await engine?.exportPdf(); } finally { $('pdf').disabled = false; } };
$('prt').onclick = () => pdfBytes ? window.print() : engine?.print();
$('md').onclick = () => engine?.exportMd();
addEventListener('hashchange', open);
open();
</script>
</body>
</html>

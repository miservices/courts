<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Management | MiCOURT</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0a1628; --navy-mid:#0d1f3c; --navy-light:#112240; --navy-hover:#162d4e; --border:#1e3a5f;
  --gold:#c8a84b; --gold-dim:rgba(200,168,75,0.15);
  --cream:#f4f1ec; --cream-dark:#ede9e1; --white:#ffffff;
  --text:#1a1a1a; --muted:#6b5f4e; --line:#e0d9cf; --blue-muted:#7a9bbf;
  --green:#15803d; --green-bg:#f0fdf4; --green-bdr:#dcfce7;
  --red:#dc2626; --red-bg:#fef2f2; --red-bdr:#fee2e2;
  --amber:#a16207; --amber-bg:#fef9e7; --amber-bdr:#fde68a;
  --blue:#1d4ed8; --blue-bg:#eff6ff; --blue-bdr:#dbeafe;
  --purple:#6d28d9; --purple-bg:#f5f3ff; --purple-bdr:#ede9fe;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
a{color:inherit}

/* ── Shell (matches Manage Filings / Dashboard chrome) ── */
.topbar{background:var(--navy);border-bottom:1px solid var(--border);padding:0 36px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300}
.topbar-brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.topbar-seal{width:28px;height:28px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.topbar-name{font-family:'Merriweather',serif;color:#fff;font-size:13.5px;font-weight:400}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{color:var(--blue-muted);font-size:12px}
.back-bar{background:var(--navy-mid);border-bottom:2px solid var(--gold);padding:0 36px;display:flex;align-items:center;height:46px;gap:0}
.back-bar a,.back-bar button.linklike{display:inline-flex;align-items:center;gap:8px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:0.02em;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0}
.back-bar-sep{width:1px;height:20px;background:var(--border);margin:0 16px}
.back-bar-label{color:var(--blue-muted);font-size:12px}
.auth-overlay{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.auth-overlay.hidden{display:none}
.ao-seal{width:50px;height:50px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.ao-title{font-family:'Merriweather',serif;color:#fff;font-size:16px;font-weight:300}
.ao-spin{width:26px;height:26px;border:3px solid #1e3a5f;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
.ao-msg{color:var(--blue-muted);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.restricted{padding:60px 22px;text-align:center;max-width:640px;margin:0 auto}
.restricted .ei{font-size:40px;margin-bottom:14px}
.restricted h2{font-family:'Merriweather',serif;font-size:20px;font-weight:300;margin-bottom:8px}
.restricted p{font-size:13px;color:var(--muted);line-height:1.7}

.page-wrap{max-width:1400px;margin:0 auto;padding:28px 32px 80px}
.page-header{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-header h1{font-family:'Merriweather',serif;font-size:24px;font-weight:300;color:var(--text);margin-bottom:5px}
.page-header p{font-size:13px;color:var(--muted);line-height:1.6}
.breadcrumb{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.breadcrumb a{color:var(--muted);font-size:11px;text-decoration:none}
.breadcrumb span{color:#b0a898;font-size:10px}
.breadcrumb .bc-cur{color:var(--text);font-size:11px;font-weight:600}

/* ── Search screen ── */
#search-screen{display:block}
.search-card{background:var(--white);border:1px solid var(--line);border-radius:5px;padding:24px 26px;margin-bottom:22px}
.search-card h3{font-family:'Merriweather',serif;font-size:15px;font-weight:400;margin-bottom:16px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;padding:11px 14px;border:1px solid #d6cfc4;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:14px;background:#faf9f7;outline:none}
.search-row input:focus{border-color:var(--navy);background:#fff}
.btn-search{background:var(--navy);color:#fff;padding:11px 26px;border-radius:3px;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap}
.btn-search:hover{background:var(--navy-mid)}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:5px;padding:15px 16px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--line)}
.stat-card.gold::after{background:var(--gold)}
.stat-card.red::after{background:var(--red)}
.stat-card.blue::after{background:var(--blue)}
.stat-card.green::after{background:var(--green)}
.stat-card.purple::after{background:var(--purple)}
.stat-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
.stat-value{font-family:'Merriweather',serif;font-size:24px;color:var(--text);font-weight:700;line-height:1}
.stat-sub{font-size:10.5px;color:var(--muted);margin-top:4px;display:block}
.result-list{background:var(--white);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.result-row{padding:15px 20px;border-bottom:1px solid #f8f5f0;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:background .1s;text-decoration:none;color:inherit}
.result-row:last-child{border-bottom:none}
.result-row:hover{background:#faf9f7}
.rr-left{flex:1;min-width:0}
.rr-num{font-size:10.5px;color:var(--gold);font-weight:700;letter-spacing:.07em;margin-bottom:3px;font-family:monospace}
.rr-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.rr-meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.rr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rr-arrow{color:var(--gold);font-weight:700;font-size:13px}
.badge{font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 9px;border-radius:2px;text-transform:uppercase;white-space:nowrap}
.badge-criminal{background:#fef2f2;color:#dc2626;border:1px solid #fee2e2}
.badge-civil{background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe}
.badge-appellate{background:#f5f3ff;color:#6d28d9;border:1px solid #ede9fe}
.badge-traffic{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.badge-administrative{background:#f0fdf4;color:#15803d;border:1px solid #dcfce7}
.status-pill{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:2px;text-transform:uppercase}
.sp-open{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.sp-mediation{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bdr)}
.sp-deferred{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}
.sp-disposed{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bdr)}
.sp-closed{background:#f8f5f0;color:#9a8f82;border:1px solid var(--line)}
.sealed-tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:2px;background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr);text-transform:uppercase}
.empty-state{padding:56px 22px;text-align:center}
.empty-state .ei{font-size:36px;margin-bottom:12px}
.empty-state h4{font-family:'Merriweather',serif;font-size:16px;font-weight:300;margin-bottom:6px}
.empty-state p{font-size:12.5px;color:var(--muted);line-height:1.6}
.loading-inline{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.spin-sm{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}

/* ═══════════ DETAIL / MANAGEMENT SCREEN ═══════════ */
#detail-screen{display:none}
#detail-screen.active{display:block}

.detail-hero{background:var(--navy);padding:26px 0;border-bottom:1px solid var(--border)}
.hero-inner{padding:0 32px;max-width:1400px;margin:0 auto}
.detail-back{display:inline-flex;align-items:center;gap:7px;color:var(--blue-muted);font-size:12px;text-decoration:none;letter-spacing:.04em;margin-bottom:16px;cursor:pointer;border:none;background:none;padding:0;font-family:inherit}
.detail-back:hover{color:var(--gold)}
.detail-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.detail-case-num{font-size:12px;color:var(--blue-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.detail-title{font-family:'Merriweather',serif;color:#fff;font-size:24px;font-weight:300;line-height:1.35;max-width:680px}
.detail-court{color:var(--blue-muted);font-size:12.5px;margin-top:8px}
.detail-status-block{text-align:right;flex-shrink:0}
.detail-status-label{font-size:10px;color:var(--blue-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}

/* Alerts */
.alerts-bar{padding:14px 32px 0;max-width:1400px;margin:0 auto}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-radius:4px;margin-bottom:8px;font-size:12.5px;line-height:1.5}
.alert-high{background:var(--red-bg);border:1px solid var(--red-bdr);color:#7a1f1f}
.alert-med{background:var(--amber-bg);border:1px solid var(--amber-bdr);color:#7a5b06}
.alert-low{background:var(--blue-bg);border:1px solid var(--blue-bdr);color:#1e40af}
.alert-icon{flex-shrink:0}
.alert-text strong{font-weight:700}

.mgmt-layout{max-width:1400px;margin:0 auto;padding:20px 32px 80px;display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:1100px){.mgmt-layout{grid-template-columns:1fr}}

/* Collapsible sections */
.sec{background:var(--white);border:1px solid var(--line);border-radius:5px;margin-bottom:14px;overflow:hidden}
.sec-hdr{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px;user-select:none}
.sec-hdr:hover{background:#faf9f7}
.sec-hdr-left{display:flex;align-items:center;gap:10px}
.sec-icon{font-size:15px}
.sec-title{font-family:'Merriweather',serif;font-size:15px;font-weight:400;color:var(--text)}
.sec-count{font-size:11px;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.sec-caret{font-size:11px;color:var(--muted);transition:transform .15s}
.sec.collapsed .sec-caret{transform:rotate(-90deg)}
.sec-body{padding:0 20px 20px}
.sec.collapsed .sec-body{display:none}
.sec-body-pad{padding-top:4px}

/* Info grid / editable fields (shared with detail cards) */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-grid-auto{display:flex;flex-wrap:wrap;gap:14px 28px}
.info-grid-auto .info-item{flex:1 1 auto;min-width:130px}
.info-item .k{font-size:10.5px;color:#9a8f82;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.info-item .v{font-size:14px;color:#1a1a1a;font-weight:500;line-height:1.4}
.info-item .v.mono{font-family:monospace;font-size:13px}
.info-item .v.muted{color:#b0a898;font-style:italic;font-weight:400}
.ef-input,.ef-select,.ef-textarea{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;background:#fff;outline:none}
.ef-input:focus,.ef-select:focus,.ef-textarea:focus{border-color:var(--navy)}
.ef-textarea{resize:vertical;min-height:56px}
.field-row{display:flex;flex-direction:column;gap:4px}
.field-row .k{font-size:10.5px;color:#9a8f82;text-transform:uppercase;letter-spacing:.08em}

.summary-box{background:var(--cream);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:3px;padding:14px 18px;margin-bottom:16px}
.summary-box p{font-size:13px;color:#4a4035;line-height:1.7}

/* Quick actions sidebar */
.qa-panel{position:sticky;top:70px}
.qa-group{background:var(--white);border:1px solid var(--line);border-radius:5px;margin-bottom:14px;overflow:hidden}
.qa-group-hdr{padding:12px 16px;background:var(--navy);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.qa-list{padding:8px}
.qa-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;background:none;border:none;border-radius:3px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);transition:background .12s}
.qa-btn:hover{background:var(--cream)}
.qa-btn .qi{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.qa-btn.danger{color:var(--red)}
.qa-btn.gold{color:#8a6d1f}

/* Party / charge / bond / hearing / sentencing / financial / event blocks (reused visual language) */
.party-card{background:#fff;border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.party-card:last-child{margin-bottom:0}
.party-card-head{background:var(--cream);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.party-role-pill{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.1em;background:var(--navy);padding:4px 10px;border-radius:2px}
.party-card-body{padding:16px 18px}

.charge-row,.bond-card{border:1px solid #e8e0d5;border-radius:3px;padding:14px 16px;margin-bottom:10px}
.charge-row:last-child,.bond-card:last-child{margin-bottom:0}
.charge-top,.bond-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.charge-title{font-size:14px;color:var(--text);font-weight:600}
.bond-amount{font-family:'Merriweather',serif;font-size:24px;color:var(--text)}

.hearing-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #f8f5f0;align-items:flex-start}
.hearing-row:last-child{border-bottom:none}
.hearing-date-block{flex-shrink:0;text-align:center;background:var(--cream);border-radius:3px;padding:7px 11px;min-width:54px}
.hd-month{font-size:9.5px;color:#9a8f82;text-transform:uppercase;letter-spacing:.08em}
.hd-day{font-family:'Merriweather',serif;font-size:20px;color:var(--text);line-height:1}
.hd-year{font-size:9.5px;color:#9a8f82}
.hd-time{font-size:9.5px;color:var(--gold);margin-top:2px;font-weight:600}
.hearing-info{flex:1;min-width:0}
.hearing-type{font-size:13px;font-weight:700;color:var(--text)}
.hearing-officer{font-size:11.5px;color:var(--muted);margin-top:2px}
.hearing-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini-btn{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:2px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
.mini-btn:hover{border-color:var(--navy)}
.mini-btn.gold{color:#8a6d1f;border-color:var(--amber-bdr);background:var(--amber-bg)}
.mini-btn.green{color:var(--green);border-color:var(--green-bdr);background:var(--green-bg)}
.mini-btn.red{color:var(--red);border-color:var(--red-bdr);background:var(--red-bg)}
.mini-btn.blue{color:var(--blue);border-color:var(--blue-bdr);background:var(--blue-bg)}
.hr-pill{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:2px;text-transform:uppercase;flex-shrink:0}
.hr-upcoming{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.hr-today{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}
.hr-past{background:#f8f5f0;color:#9a8f82;border:1px solid var(--line)}

.fin-order{padding:14px 0;border-bottom:1px solid #f8f5f0}
.fin-order:last-child{border-bottom:none}
.fin-status{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:2px;text-transform:uppercase;display:inline-block}
.fin-paid{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.fin-unpaid{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr)}
.fin-partial{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}
.fin-summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.fin-strip-item{padding:14px 18px;border-right:1px solid #f0ebe3;background:#fff}
.fin-strip-item:last-child{border-right:none}
.fin-strip-item .v{font-family:'Merriweather',serif;font-size:18px}

/* Docket / events */
.docket-filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.docket-filter-btn{font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-radius:3px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.docket-filter-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.event-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f8f5f0}
.event-row:last-child{border-bottom:none}
.event-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--cream);color:var(--muted);border:1px solid var(--line);flex-shrink:0}
.ek-filing .event-num{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bdr)}
.ek-order .event-num{background:var(--amber-bg);color:#8a6d1f;border-color:var(--amber-bdr)}
.event-main{flex:1;min-width:0}
.event-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.event-date{font-size:11px;color:#9a8f82}
.event-kind-badge{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.ek-event .event-kind-badge{background:var(--cream);color:var(--muted)}
.ek-filing .event-kind-badge{background:var(--blue-bg);color:var(--blue)}
.ek-order .event-kind-badge{background:var(--amber-bg);color:#8a6d1f}
.event-desc{font-size:13.5px;font-weight:600;color:var(--text)}
.event-comment{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.event-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* Tasks */
.task-card{border:1px solid var(--amber-bdr);background:#fffdf5;border-radius:4px;padding:14px 16px;margin-bottom:10px}
.task-card.done{border-color:var(--green-bdr);background:var(--green-bg);padding:9px 16px;cursor:pointer}
.task-card:last-child{margin-bottom:0}
.task-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task-title{font-size:13.5px;font-weight:700;color:var(--text)}
.task-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.task-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.task-card.done .task-meta{display:none}
.task-card.done.expanded{padding:14px 16px}
.task-card.done.expanded .task-meta{display:block}
.task-collapse-hint{font-size:10.5px;color:#9a8f82}

/* Notes */
.notes-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.note-item{background:var(--cream);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.note-meta{font-size:10.5px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between}
.note-text{font-size:12.5px;color:var(--text);line-height:1.5}
.note-add{display:flex;gap:8px}
.note-add textarea{flex:1;padding:8px 11px;border:1.5px solid var(--line);border-radius:4px;font-family:'DM Sans',sans-serif;font-size:12.5px;resize:vertical;min-height:38px;outline:none}

/* Audit log */
.audit-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f8f5f0;font-size:12px}
.audit-item:last-child{border-bottom:none}
.audit-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px}
.audit-time{color:var(--muted);font-size:10.5px;margin-top:1px}

/* Notifications */
.notif-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f8f5f0}
.notif-item:last-child{border-bottom:none}
.notif-icon{font-size:15px;flex-shrink:0}
.notif-title{font-size:12.5px;font-weight:700;color:var(--text)}
.notif-text{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.notif-time{font-size:10.5px;color:#b0a898;margin-top:3px}

/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl-date{font-size:10.5px;color:#9a8f82;margin-bottom:2px}
.tl-desc{font-size:13px;color:var(--text);font-weight:500}

/* Modal (used for hearing scheduling, order upload, party edit, etc.) */
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,.75);z-index:2000;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--white);border-radius:6px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-box.wide{max-width:760px}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hdr h4{font-family:'Merriweather',serif;font-size:15px;font-weight:400}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.mform-row{margin-bottom:14px}
.mform-row label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:6px}
.mform-row input,.mform-row select,.mform-row textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:4px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fff}
.mform-row textarea{resize:vertical;min-height:70px}
.mform-row .hint{font-size:11px;color:#9a8f82;margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0}
.mform-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:4px;background:var(--cream)}
.mform-file input[type=file]{font-size:12px;flex:1}
.mform-or{font-size:11px;color:#9a8f82;text-transform:uppercase;letter-spacing:.08em;text-align:center;margin:10px 0}
.mform-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mform-locked{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:4px;font-size:13px;background:#f4f1ec;color:#9a8f82}

.btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:4px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s;text-decoration:none}
.btn-primary:hover{background:var(--navy-mid)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--muted);border:1.5px solid var(--line);padding:8px 14px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.btn-ghost:hover{border-color:#b0a898;color:var(--text)}
.btn-green{background:var(--green)} .btn-green:hover{background:#116530}
.btn-red{background:var(--red)} .btn-red:hover{background:#b91c1c}
.btn-purple{background:var(--purple)} .btn-purple:hover{background:#5b21b6}
.btn-gold{background:var(--gold);color:var(--navy)} .btn-gold:hover{background:#b8974a}
.empty-note{color:#9a8f82;font-size:12.5px;padding:6px 0}

@media(max-width:800px){
  .info-grid{grid-template-columns:1fr 1fr}
  .fin-summary-strip{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .page-wrap,.hero-inner,.alerts-bar,.mgmt-layout{padding-left:16px;padding-right:16px}
  .info-grid{grid-template-columns:1fr}
  .mform-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-brand" href="/courts/micourt/">
    <div class="topbar-seal">⚖️</div>
    <span class="topbar-name">MiCOURT</span>
  </a>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user">Loading…</span>
  </div>
</div>

<div class="back-bar">
  <a href="/courts/micourt/dashboard/">⬅ Back to Dashboard</a>
  <div class="back-bar-sep"></div>
  <button class="linklike" id="back-bar-search-link" onclick="navigateBack()" style="display:none">🔎 Case Search</button>
  <span class="back-bar-label" id="back-bar-label">Case Management</span>
</div>

<div class="auth-overlay" id="auth-overlay">
  <div class="ao-seal">⚖️</div>
  <div class="ao-title">MiCOURT</div>
  <div class="ao-spin"></div>
  <div class="ao-msg" id="ao-msg">Verifying session…</div>
</div>

<div id="restricted-wrap" style="display:none"></div>

<!-- ═══════════ SEARCH SCREEN ═══════════ -->
<div id="search-screen" style="display:none">
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <div class="breadcrumb"><a href="/courts/micourt/dashboard/">Dashboard</a><span>›</span><span class="bc-cur">Case Management</span></div>
        <h1>Case Management</h1>
        <p>Find a case to manage its docket, parties, hearings, orders, financials, and internal case record.</p>
      </div>
    </div>
    <div class="search-card">
      <h3>Find a Case</h3>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search by case number, party name, or keyword…">
        <button class="btn-search" id="search-btn">Search</button>
      </div>

</div>

<!-- ═══════════ DETAIL / MANAGEMENT SCREEN ═══════════ -->
<div id="detail-screen">
  <div id="detail-loading" class="loading-inline" style="padding:80px"><span class="spin-sm"></span>Loading case record…</div>
  <div id="detail-content" style="display:none"></div>
</div>

<!-- Generic modal used for hearings, orders, parties, financials, bonds, etc. -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box">
    <div class="modal-hdr">
      <h4 id="modal-title">—</h4>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

const cfg = {
  apiKey:"AIzaSyA8sUFIq81cs6uQvqduardpGJ4R2DxO8NQ",
  authDomain:"micourt-dada6.firebaseapp.com",
  projectId:"micourt-dada6",
  storageBucket:"micourt-dada6.firebasestorage.app",
  messagingSenderId:"1013564619997",
  appId:"1:1013564619997:web:8f259dab457915758f6f34"
};
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// ── Roles (mirrors Manage Filings) ──
const STAFF_ROLES = [
  'Clerk','Clerk of the District Court','Law Clerk (DC)','Judicial Assistant (DC)',
  'Magistrate Judge','Judge','Chief Judge',
  'Clerk of the Supreme Court','Assistant Clerk of the Supreme Court','Law Clerk (SC)','Judicial Assistant (SC)',
  'Justice','Chief Justice'
];
const SC_ROLES = ['Clerk of the Supreme Court','Assistant Clerk of the Supreme Court','Law Clerk (SC)','Judicial Assistant (SC)','Justice','Chief Justice'];
const JUDGE_ROLES_DISTRICT = ['Magistrate Judge','Judge','Chief Judge'];
const JUDGE_ROLES_SC = ['Justice','Chief Justice'];
const JUDGE_STAFF_DISTRICT = ['Law Clerk (DC)','Judicial Assistant (DC)'];
const JUDGE_STAFF_SC = ['Law Clerk (SC)','Judicial Assistant (SC)'];
const ACTS_FOR_JUDGE_ROLES = [...JUDGE_STAFF_DISTRICT, ...JUDGE_STAFF_SC, ...JUDGE_ROLES_DISTRICT, ...JUDGE_ROLES_SC];
function courtOf(role){ return SC_ROLES.includes(role) ? 'Michigan Supreme Court' : 'Genesee Co. District Court'; }

// ── State ──
let userData = { name:'—', uid:null, role:'Portal User', court:'Genesee Co. District Court' };
let allCases = [];
let currentCase = null;   // the open case doc, with _id
let cm = null;            // caseManagement/{caseId} doc — internal, staff-only
let filingsForCase = [];  // pendingFilings tied to the open case
let judgesAll = [];       // accounts filtered to judge-ish roles
let sectionState = {};    // per-section collapsed/expanded, in-memory only
let docketFilter = 'all';
let expandedTasks = {};   // completed/dismissed tasks the user has expanded to view

const DEFAULT_COLLAPSED = new Set(['charges','bonds','sentencing','financials','filings','notes','audit','notifications','timeline']);
function isCollapsed(id){ return sectionState[id] !== undefined ? sectionState[id] : DEFAULT_COLLAPSED.has(id); }

// ── Formatting helpers ──
function esc(v){ if(v==null) return ''; return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return (s||'').toString().replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function hasVal(v){ return v!==undefined && v!==null && String(v).trim()!==''; }
function val(v, cls){ return hasVal(v) ? `<div class="v${cls?(' '+cls):''}">${esc(v)}</div>` : `<div class="v muted">N/A</div>`; }
function fmtDate(str){ if(!hasVal(str)) return null; const d=new Date(str); return isNaN(d)?str:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(str){ if(!hasVal(str)) return null; const d=new Date(str); return isNaN(d)?str:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }
function fmtMoney(n){ if(n==null||n==='') return null; return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2}); }
function timeAgo(s){
  if(!s) return '—';
  const d=new Date(s), mins=Math.floor((new Date()-d)/60000);
  if(mins<1) return 'just now'; if(mins<60) return `${mins}m ago`;
  const hrs=Math.floor(mins/60); if(hrs<24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
function toInputDate(str){ if(!hasVal(str)) return ''; const d=new Date(str); return isNaN(d)?'':d.toISOString().slice(0,10); }
function toInputDateTime(str){ if(!hasVal(str)) return ''; const d=new Date(str); return isNaN(d)?'':d.toISOString().slice(0,16); }
function stripTaskSuffix(t){ return (t||'').replace(/\s*[-–—]+\s*needs review\s*$/i,'').trim(); }

// Role options change based on case type — used for party pre-fill dropdowns.
function roleOptionsForCaseType(caseType){
  const t=(caseType||'').toLowerCase();
  if(t==='criminal'||t==='traffic') return ['Defendant','Victim','Witness','Interested Party'];
  if(t==='civil') return ['Plaintiff','Defendant','Interested Party','Witness'];
  if(t==='appellate'||t==='appeal') return ['Appellant','Appellee','Interested Party'];
  if(t==='administrative') return ['Petitioner','Respondent','Interested Party'];
  return ['Plaintiff','Defendant','Petitioner','Respondent','Appellant','Appellee','Interested Party'];
}

function getCaseTitle(c){
  if(hasVal(c.caseTitleOverride)) return c.caseTitleOverride;
  const t=(c.caseType||'').toLowerCase(); const p=c.parties||{};
  const list = Array.isArray(p) ? p : null;
  function findRole(roles){ return list ? list.find(x=>roles.includes((x.role||'').toLowerCase())) : null; }
  if(t==='criminal'||t==='traffic'){ const def=list?findRole(['defendant'])?.name:p.primaryDefendant?.name; return def?`State of Michigan v. ${def}`:'State of Michigan v. Unknown'; }
  if(t==='civil'){ const pl=list?findRole(['plaintiff'])?.name:p.primaryPlaintiff?.name; const df=list?findRole(['defendant'])?.name:p.primaryDefendant?.name; if(pl&&df) return `${pl} v. ${df}`; if(pl) return `Ex parte ${pl}`; if(df) return `In re ${df}`; return c.caseId||'Civil Matter'; }
  if(t==='appellate'||t==='appeal'){ const ap=list?findRole(['appellant'])?.name:p.appellant?.name; const apl=list?findRole(['appellee'])?.name:p.appellee?.name; if(ap&&apl) return `${ap} v. ${apl}`; if(ap) return `Ex parte ${ap}`; return c.caseId||'Appellate Matter'; }
  if(t==='administrative'){ const pet=list?findRole(['petitioner'])?.name:(p.primaryPetitioner?.name||p.petitioner?.name); const res=list?findRole(['respondent'])?.name:p.respondent?.name; if(pet&&res) return `${pet} v. ${res}`; return c.administrativeSubtype||'Administrative Matter'; }
  return c.caseId||'Case Record';
}
function getStatusClass(status){
  if(!status) return 'sp-open';
  const s = status.toLowerCase();
  if(s==='open') return 'sp-open';
  if(s==='mediation') return 'sp-mediation';
  if(s==='deferred') return 'sp-deferred';
  if(s==='disposed') return 'sp-disposed';
  if(s==='closed') return 'sp-closed';
  return 'sp-open';
}
function getBadgeClass(type){
  const t=(type||'').toLowerCase();
  if(t==='criminal') return 'badge-criminal';
  if(t==='civil') return 'badge-civil';
  if(t==='appellate'||t==='appeal') return 'badge-appellate';
  if(t==='administrative') return 'badge-administrative';
  if(t==='traffic') return 'badge-traffic';
  return 'badge-civil';
}
function partyList(c){
  const p=c.parties;
  if(Array.isArray(p)) return p;
  return [];
}


// ── Load & routing ──
async function loadJudges(){
  try{
    const snap = await getDocs(collection(db,'accounts'));
    judgesAll = [];
    snap.forEach(d=>{ const a=d.data(); if([...JUDGE_ROLES_DISTRICT,...JUDGE_ROLES_SC].includes(a.role)) judgesAll.push({uid:d.id, name:a.name||'Unnamed', role:a.role}); });
  }catch(e){ console.warn('accounts load failed', e); judgesAll=[]; }
}
function judgePoolForCourt(court){
  return judgesAll.filter(j => court==='Michigan Supreme Court' ? JUDGE_ROLES_SC.includes(j.role) : JUDGE_ROLES_DISTRICT.includes(j.role));
}

async function loadAllCasesForSearch(){
  const list = document.getElementById('results-list');
  list.innerHTML = `<div class="loading-inline"><span class="spin-sm"></span>Loading cases…</div>`;
  try{
    const snap = await getDocs(collection(db,'cases'));
    allCases = [];
    snap.forEach(d=>{ const c={...d.data(), _id:d.id}; if(c.court===userData.court) allCases.push(c); });
  }catch(e){ console.warn('cases load failed', e); allCases=[]; }
  renderStatRow();
  renderResults(allCases);
}

function renderStatRow(){
  const openCt = allCases.filter(c=>(c.status||'')==='Open').length;
  const mediationCt = allCases.filter(c=>(c.status||'')==='Mediation').length;
  const deferredCt = allCases.filter(c=>(c.status||'')==='Deferred').length;
  const disposedCt = allCases.filter(c=>(c.status||'')==='Disposed').length;
  const closedCt = allCases.filter(c=>(c.status||'')==='Closed').length;
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card gold"><span class="stat-label">Total Cases</span><span class="stat-value">${allCases.length}</span><span class="stat-sub">${userData.court}</span></div>
    <div class="stat-card green"><span class="stat-label">Open</span><span class="stat-value">${openCt}</span></div>
    <div class="stat-card purple"><span class="stat-label">Mediation</span><span class="stat-value">${mediationCt}</span></div>
    <div class="stat-card blue"><span class="stat-label">Deferred / Disposed</span><span class="stat-value">${deferredCt+disposedCt}</span></div>
    <div class="stat-card red"><span class="stat-label">Closed</span><span class="stat-value">${closedCt}</span></div>
  `;
}

function doSearch(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){ renderResults(allCases); return; }
  const filtered = allCases.filter(c=>{
    const title = getCaseTitle(c).toLowerCase();
    const caseId = (c.caseId||'').toLowerCase();
    const docket = (c.docketSummary||'').toLowerCase();
    const partiesStr = JSON.stringify(c.parties||[]).toLowerCase();
    return title.includes(q) || caseId.includes(q) || docket.includes(q) || partiesStr.includes(q);
  });
  renderResults(filtered);
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('search-btn')?.addEventListener('click', doSearch);
  document.getElementById('search-input')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
});

function renderResults(list){
  const el = document.getElementById('results-list');
  if(!list.length){ el.innerHTML = `<div class="empty-state"><div class="ei">📂</div><h4>No Cases Found</h4><p>Try a different search term.</p></div>`; return; }
  const sorted = [...list].sort((a,b)=> new Date(b.dates?.lastUpdated||b.dates?.filed||0) - new Date(a.dates?.lastUpdated||a.dates?.filed||0));
  el.innerHTML = sorted.map(c=>{
    const judge = c.judge || (Array.isArray(c.judges)?c.judges[0]:null) || '—';
    return `<a class="result-row" href="#case-${c._id}">
      <div class="rr-left">
        <div class="rr-num">${esc(c.caseId)}</div>
        <div class="rr-title">${esc(getCaseTitle(c))}</div>
        <div class="rr-meta"><span>${esc(c.caseType)}</span><span>Judge: ${esc(judge)}</span><span>Filed ${esc(fmtDate(c.dates?.filed)||'—')}</span></div>
      </div>
      <div class="rr-right">
        ${c.sealed ? `<span class="sealed-tag">🔒 Sealed</span>` : ''}
        <span class="badge ${getBadgeClass(c.caseType)}">${esc(c.caseType)}</span>
        <span class="status-pill ${getStatusClass(c.status)}">${esc(c.status)}</span>
        <span class="rr-arrow">Manage ›</span>
      </div>
    </a>`;
  }).join('');
}

function navigateToCase(id){ window.location.hash = `case-${id}`; }
function navigateBack(){ window.location.hash=''; }
window.navigateBack = navigateBack;
window.addEventListener('hashchange', handleHash);

function handleHash(){
  const hash = window.location.hash;
  if(hash.startsWith('#case-')) showDetailScreen(hash.slice(6));
  else showSearchScreen();
}

function showSearchScreen(){
  document.getElementById('detail-screen').classList.remove('active');
  document.getElementById('detail-screen').style.display='none';
  document.getElementById('search-screen').style.display='block';
  document.getElementById('back-bar-search-link').style.display='none';
  document.getElementById('back-bar-label').textContent='Case Management';
}

async function showDetailScreen(caseId){
  document.getElementById('search-screen').style.display='none';
  const ds = document.getElementById('detail-screen');
  ds.style.display='block'; ds.classList.add('active');
  document.getElementById('detail-loading').style.display='block';
  document.getElementById('detail-content').style.display='none';
  document.getElementById('back-bar-search-link').style.display='inline-flex';
  document.getElementById('back-bar-label').textContent='Managing Case';
  window.scrollTo(0,0);

  try{
    let caseData=null;
    const snap = await getDoc(doc(db,'cases', caseId));
    if(snap.exists()) caseData = {...snap.data(), _id:snap.id};
    else caseData = allCases.find(c=>c._id===caseId || c.caseId===caseId) || null;

    if(!caseData){
      document.getElementById('detail-loading').style.display='none';
      document.getElementById('detail-content').style.display='block';
      document.getElementById('detail-content').innerHTML = `<div style="padding:60px"><div class="empty-state"><div class="ei">📭</div><h4>Case Not Found</h4><p>No record found for "${esc(caseId)}".</p><button class="btn-primary" style="margin-top:14px" onclick="navigateBack()">← Back to Search</button></div></div>`;
      return;
    }
    if(caseData.court !== userData.court){
      document.getElementById('detail-loading').style.display='none';
      document.getElementById('detail-content').style.display='block';
      document.getElementById('detail-content').innerHTML = `<div style="padding:60px"><div class="restricted"><div class="ei">🔒</div><h2>Wrong Court</h2><p>This case belongs to ${esc(caseData.court)}. Your account only has access to manage ${esc(userData.court)} cases.</p><button class="btn-primary" style="margin-top:14px" onclick="navigateBack()">← Back to Search</button></div></div>`;
      return;
    }
    currentCase = caseData;

    const cmSnap = await getDoc(doc(db,'caseManagement', caseId));
    cm = cmSnap.exists() ? cmSnap.data() : { tasks:[], notifications:[], internalNotes:[], auditLog:[] };
    cm.tasks = cm.tasks||[]; cm.notifications = cm.notifications||[]; cm.internalNotes = cm.internalNotes||[]; cm.auditLog = cm.auditLog||[];

    try{
      const pfSnap = await getDocs(collection(db,'pendingFilings'));
      filingsForCase = [];
      pfSnap.forEach(d=>{ const f={...d.data(), _id:d.id}; if(f.caseFirestoreId===currentCase._id || f.linkedCaseFirestoreId===currentCase._id) filingsForCase.push(f); });
    }catch(e){ filingsForCase = []; }

    if(!judgesAll.length) await loadJudges();

    docketFilter = 'all';
    expandedTasks = {};
    document.getElementById('detail-loading').style.display='none';

  }catch(err){

    document.getElementById('detail-content').innerHTML = `<div style="padding:60px"><div class="empty-state"><div class="ei">⚠️</div><h4>Error Loading Case</h4><p>${esc(err.message)}</p></div></div>`;

}

// ── Persistence helpers ──
async function saveCase(patch, auditText){
  await updateDoc(doc(db,'cases', currentCase._id), patch);
  Object.assign(currentCase, patch);
  if(auditText) await addAudit(auditText);
  renderDetailPage();
}
function nextEventNumber(){ const arr=currentCase.events||[]; return arr.length ? Math.max(...arr.map(e=>e.eventNumber||0))+1 : 1; }
async function pushEvent(ev){
  const events = [...(currentCase.events||[]), { eventNumber: nextEventNumber(), sealed:false, ...ev }];
  const dates = { ...currentCase.dates, lastUpdated: new Date().toISOString() };
  await updateDoc(doc(db,'cases', currentCase._id), { events, dates });
  currentCase.events = events; currentCase.dates = dates;
}
async function saveCM(patch){
  await setDoc(doc(db,'caseManagement', currentCase._id), { ...cm, ...patch, caseFirestoreId: currentCase._id }, { merge:true });
  Object.assign(cm, patch);
}
async function addAudit(action){
  const auditLog = [...(cm.auditLog||[]), { action, by:userData.name, byUid:userData.uid, byRole:userData.role, at:new Date().toISOString() }];
  await saveCM({ auditLog });
}
// Notices are always system-generated (never manually authored). Every notice that
// goes out is automatically mirrored into the audit log so there is a durable record
// of when and why it was issued.
async function addNotification(notif){
  const notifications = [...(cm.notifications||[]), { num:(cm.notifications||[]).length+1, at:new Date().toISOString(), read:false, ...notif }];
  await saveCM({ notifications });
  await addAudit(`Auto-issued notice: ${notif.title||notif.type} — ${notif.text||''}`);
}
async function completeTask(idx){
  const tasks = [...(cm.tasks||[])];
  if(!tasks[idx]) return;
  tasks[idx] = { ...tasks[idx], status:'Completed', completedAt:new Date().toISOString(), completedBy:userData.name };
  await saveCM({ tasks });
  await addAudit(`Completed task: ${tasks[idx].title}`);
  renderDetailPage();
}
window.completeTask = completeTask;
async function dismissTask(idx){
  if(!confirm('Dismiss this task without further action?')) return;
  const tasks = [...(cm.tasks||[])];
  if(!tasks[idx]) return;
  tasks[idx] = { ...tasks[idx], status:'Dismissed', completedAt:new Date().toISOString(), completedBy:userData.name };
  await saveCM({ tasks });
  await addAudit(`Dismissed task: ${tasks[idx].title}`);
  renderDetailPage();
}
window.dismissTask = dismissTask;
function toggleTaskExpanded(idx){
  expandedTasks[idx] = !expandedTasks[idx];
  renderDetailPage();
}
window.toggleTaskExpanded = toggleTaskExpanded;

// ── Alerts (computed live, not stored) ──
function computeAlerts(){
  const alerts = [];
  const now = new Date();
  const openTasks = (cm.tasks||[]).filter(t=>t.status==='Open');
  if(openTasks.length) alerts.push({sev:'med', icon:'📋', html:`<strong>${openTasks.length} item${openTasks.length>1?'s':''}</strong> in Tasks need${openTasks.length>1?'':'s'} attention.`});

  (currentCase.hearings||[]).forEach(h=>{
    const d = h.date ? new Date(h.date) : null;
    if(!d || isNaN(d)) return;
    const diffDays = (d-now)/86400000;
    if(diffDays >= 0 && diffDays <= 3) alerts.push({sev:'high', icon:'📅', html:`<strong>Hearing scheduled:</strong> ${esc(h.type||'Hearing')} on ${esc(fmtDate(h.date))}${h.time?' at '+esc(h.time):''}.`});
    else if(diffDays < 0 && !hasVal(h.result)) alerts.push({sev:'high', icon:'⚠️', html:`Hearing on ${esc(fmtDate(h.date))} (${esc(h.type||'Hearing')}) has no recorded result.`});
  });

  const orders = currentCase.financialOrders||[];
  const totalOwed = orders.reduce((s,o)=>s+(o.amount||0),0);
  const totalPaid = orders.reduce((s,o)=>s+(o.payments||[]).reduce((ss,p)=>ss+(p.amount||0),0),0);
  const balance = Math.max(0, totalOwed-totalPaid);
  if(balance>0) alerts.push({sev:'med', icon:'💵', html:`Outstanding balance of <strong>${fmtMoney(balance)}</strong>.`});

  if(!currentCase.judge) alerts.push({sev:'med', icon:'⚖️', html:'No judge of record is currently assigned to this case.'});
  if(currentCase.sealed) alerts.push({sev:'low', icon:'🔒', html:'This case is sealed and withheld from public Case Search.'});
  if((currentCase.status||'')==='Closed' && orders.length && balance>0) alerts.push({sev:'high', icon:'⚠️', html:'This case is closed with an outstanding balance still owed.'});

  return alerts;
}

// ── 6. Docket (unified, filterable) ──
function buildDocketSection(){
  const events = [...(currentCase.events||[])].sort((a,b)=>{
    const ad=new Date(a.date||0), bd=new Date(b.date||0);
    if(ad-bd!==0) return ad-bd;
    return (a.eventNumber||0)-(b.eventNumber||0);
  });
  const filtered = docketFilter==='all' ? events : events.filter(e=>(e.type||'event')===docketFilter);
  const filters = [['all','All'],['filing','Filings'],['order','Orders'],['event','Events']];
  const filterBtns = filters.map(([v,l])=>`<button class="docket-filter-btn${docketFilter===v?' active':''}" onclick="setDocketFilter('${v}')">${l}</button>`).join('');
  const rows = !filtered.length ? `<div class="empty-note">No docket entries${docketFilter!=='all'?' of this type':''}.</div>` : filtered.map(e=>{
    const type=(e.type||'event').toLowerCase();
    const cls = type==='filing'?'ek-filing':(type==='order'?'ek-order':'ek-event');
    const struckStyle = e.struck ? 'text-decoration:line-through;opacity:.6' : '';
    return `<div class="event-row ${cls}">
      <span class="event-num">${esc(e.eventNumber??'—')}</span>
      <div class="event-main">
        <div class="event-top">
          <span class="event-date">${esc(fmtDateTime(e.date)||'')}</span>
          <span class="event-kind-badge">${type}${e.sealed?' · 🔒 sealed':''}${e.struck?' · struck':''}</span>
        </div>
        <div class="event-desc" style="${struckStyle}">${esc(e.description)}</div>
        ${hasVal(e.comment)?`<div class="event-comment">${esc(e.comment)}</div>`:''}
        <div class="event-actions">
          ${e.documentLink?`<a class="mini-btn blue" href="${escAttr(e.documentLink)}" target="_blank" rel="noopener">↗ Open Document</a>`:''}
          <button class="mini-btn" onclick="showEditEventModal(${e.eventNumber})">✎ Edit Entry</button>
          <button class="mini-btn" onclick="showReplaceDocModal(${e.eventNumber})">🔄 Replace Document</button>
          <button class="mini-btn ${e.sealed?'red':''}" onclick="toggleEventSeal(${e.eventNumber})">${e.sealed?'🔓 Unseal':'🔒 Seal'}</button>
          <button class="mini-btn ${e.struck?'red':''}" onclick="toggleEventStrike(${e.eventNumber})">${e.struck?'↩ Unstrike':'⊘ Strike Entry'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
  return { id:'docket', label:'Docket', icon:'📖', count: events.length||null, html: `<div class="docket-filters">${filterBtns}</div>${rows}` };
}
function setDocketFilter(v){ docketFilter=v; renderDetailPage(); const el=document.getElementById('sec-docket'); if(el) el.classList.remove('collapsed'); }
window.setDocketFilter = setDocketFilter;
function findEvent(num){ return (currentCase.events||[]).find(e=>e.eventNumber===num); }
async function toggleEventSeal(num){

window.toggleEventSeal = toggleEventSeal;

async function cancelHearing(idx){
  if(!confirm('Cancel this hearing?')) return;
  const hearings = [...(currentCase.hearings||[])];
  const h = hearings[idx]; if(!h) return;
  hearings[idx] = { ...h, result:'Cancelled' };
  await updateDoc(doc(db,'cases', currentCase._id), { hearings });
  currentCase.hearings = hearings;
  await pushEvent({ type:'event', date:new Date().toISOString(), description:`Hearing cancelled: ${h.type} (was set for ${fmtDate(h.date)})` });
  await addAudit(`Cancelled hearing: ${h.type} on ${fmtDate(h.date)}`);
  renderDetailPage();
}
window.cancelHearing = cancelHearing;
async function continueHearing(idx){
  const hearings = [...(currentCase.hearings||[])];
  const h = hearings[idx]; if(!h) return;
  const newDate = prompt('New date/time for the continued hearing (e.g. 2026-09-15T13:30):', toInputDateTime(h.date));
  if(!newDate) return;
  const iso = new Date(newDate).toISOString();
  hearings[idx] = { ...h, date: iso, result:null, notes: (h.notes?h.notes+' — ':'')+'Continued from '+fmtDate(h.date) };
  await updateDoc(doc(db,'cases', currentCase._id), { hearings });
  currentCase.hearings = hearings;
  await pushEvent({ type:'event', date:new Date().toISOString(), description:`Hearing continued: ${h.type} — new date ${fmtDate(iso)}` });
  await addAudit(`Continued hearing: ${h.type} to ${fmtDate(iso)}`);
  renderDetailPage();
}
window.continueHearing = continueHearing;
async function generateHearingNotice(idx){
  const h = (currentCase.hearings||[])[idx]; if(!h) return;
  await addNotification({ type:'Notice of Hearing', title:'Notice of Hearing', text:`${h.type} scheduled for ${fmtDate(h.date)}${h.time?' at '+h.time:''} before ${h.officer||currentCase.judge||'the assigned judicial officer'}.` });
  alert('Notice of Hearing generated — see the Notifications section.');
  renderDetailPage();
}
window.generateHearingNotice = generateHearingNotice;

// ── 14. Timeline ──
function buildTimelineSection(){
  const items = [];
  if(currentCase.dates?.filed) items.push({ date:currentCase.dates.filed, desc:'Case filed' });
  (currentCase.hearings||[]).forEach(h=> items.push({ date:h.date, desc:`Hearing: ${h.type}${hasVal(h.result)?' — '+h.result:''}` }));
  (currentCase.events||[]).filter(e=>e.type==='order').forEach(e=> items.push({ date:e.date, desc:e.description }));
  (currentCase.sentencing||[]).forEach(s=> items.push({ date:s.sentenceDate, desc:`Sentenced on ${s.chargeRef||s.charge||'charge'}` }));
  if(currentCase.dates?.closed) items.push({ date:currentCase.dates.closed, desc:'Case closed' });
  const sorted = items.filter(i=>i.date).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const html = !sorted.length ? `<div class="empty-note">Not enough case history yet to build a timeline.</div>` : `<div class="timeline">${sorted.map(i=>`

  return { id:'timeline', label:'Timeline', icon:'📈', count: sorted.length||null, html };
}

  openModal(editing?'Edit Party':'Add Party', `

async function savePartyModal(idx){

  const pin = document.getElementById('pm-pin').value.trim();
  const selfRepresented = document.getElementById('pm-selfrep').value==='yes';
  const attyName = document.getElementById('pm-atty').value.trim();
  const barNumber = document.getElementById('pm-bar').value.trim();
  const aliases = document.getElementById('pm-aliases').value.split(',').map(s=>s.trim()).filter(Boolean);
  const serviceDate = document.getElementById('pm-service').value;
  const answerDate = document.getElementById('pm-answer').value;
  const responseDate = document.getElementById('pm-response').value;
  const extraLines = document.getElementById('pm-extra').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const additionalFields = extraLines.map(line=>{ const idx2=line.indexOf(':'); return idx2>-1 ? {label:line.slice(0,idx2).trim(), value:line.slice(idx2+1).trim()} : {label:line, value:''}; });
  if(!name){ alert("Please enter the party's name."); return; }
  const partyObj = { role, name, selfRepresented: selfRepresented || !attyName };
  if(dob) partyObj.dob = new Date(dob).toISOString();
  if(pin) partyObj.pin = pin;
  if(aliases.length) partyObj.aliases = aliases;
  if(serviceDate) partyObj.serviceDate = new Date(serviceDate).toISOString();
  if(answerDate) partyObj.answerDate = new Date(answerDate).toISOString();
  if(responseDate) partyObj.responseDate = new Date(responseDate).toISOString();
  if(additionalFields.length) partyObj.additionalFields = additionalFields;
  if(!partyObj.selfRepresented && attyName) partyObj.attorney = { name: attyName, ...(barNumber?{barNumber}:{}) };
  const parties = partyList(currentCase).slice();
  if(idx>=0) parties[idx] = partyObj; else parties.push(partyObj);
  closeModal();
  await saveCase({ parties }, idx>=0 ? `Edited party: ${name}` : `Added party: ${name} (${role})`);
}

  const deferredVal = document.getElementById('sm-csi-deferred').value;
  const rec = {
    chargeRef,
    sentenceDate: document.getElementById('sm-date').value ? new Date(document.getElementById('sm-date').value).toISOString() : null,
    facility: document.getElementById('sm-facility').value.trim()||null,
    probationTerm: document.getElementById('sm-probation').value.trim()||null,
    incarcerationTerm: document.getElementById('sm-incarceration').value.trim()||null,

      location: document.getElementById('sm-csi-location').value.trim()||null,
      creditTimeServed: document.getElementById('sm-csi-credit').value.trim()||null,
      terms: document.getElementById('sm-csi-terms').value.trim()||null,
      concurrency: document.getElementById('sm-csi-concurrency').value||null,
      deferredAdjudication: deferredVal==='' ? null : (deferredVal==='yes'),
    },
    probation: {
      officer: document.getElementById('sm-prob-officer').value.trim()||null,
      term: document.getElementById('sm-prob-term').value.trim()||null,
      conditions: document.getElementById('sm-prob-conditions').value.split('\n').map(s=>s.trim()).filter(Boolean),
    },
    license: {
      status: document.getElementById('sm-lic-status').value.trim()||null,
      daysSuspended: document.getElementById('sm-lic-days').value.trim()||null,
      restrictions: document.getElementById('sm-lic-restrictions').value.trim()||null,
    },
    notes: document.getElementById('sm-notes').value.trim()||null,
  };
  const sentencing = [...(currentCase.sentencing||[])];
  closeModal();
  if(idx>=0){ sentencing[idx] = {...sentencing[idx], ...rec}; await saveCase({ sentencing }, `Edited sentencing record for ${chargeRef}`); }
  else{
    sentencing.push(rec);
    await saveCase({ sentencing }, `Added sentencing record for ${chargeRef}`);
    await pushEvent({ type:'order', date:new Date().toISOString(), description:`Sentencing entered: ${chargeRef}`, judge: currentCase.judge||null });
    renderDetailPage();
  }
}
window.saveSentencingModal = saveSentencingModal;

function showIssueOrderModal(taskIdx){
  const task = (taskIdx!=null && taskIdx>=0) ? (cm.tasks||[])[taskIdx] : null;
  const pool = judgePoolForCourt(currentCase.court);
  const officerOptions = `<option value="${escAttr(currentCase.judge||'')}">Judge of Record — ${esc(currentCase.judge||'Unassigned')}</option>` + pool.filter(j=>j.name!==currentCase.judge).map(j=>`<option value="${escAttr(j.name)}">${esc(j.name)} — ${esc(j.role)}</option>`).join('');
  const isStaffEnteringForJudge = ACTS_FOR_JUDGE_ROLES.includes(userData.role) && !['Magistrate Judge','Judge','Chief Judge','Justice','Chief Justice'].includes(userData.role);
  const cleanTaskTitle = task ? stripTaskSuffix(task.title) : '';
  openModal('Issue an Order / Ruling', `
    ${task?`<div class="summary-box" style="margin-bottom:14px"><p>Ruling on: ${esc(task.title)}</p></div>`:''}
    <div class="mform-row"><label>Order Title</label><input id="om-title" value="${escAttr(task?('Order on '+(task.docType||cleanTaskTitle)):'')}" placeholder="e.g. Order Granting Motion to Dismiss"></div>
    <div class="mform-row"><label>Judge / Justice</label><select id="om-judge">${officerOptions}</select></div>
    ${isStaffEnteringForJudge?`<div class="summary-box" style="margin-bottom:14px"><p>Entered by ${esc(userData.name)} (${esc(userData.role)}) on behalf of the selected judicial officer.</p></div>`:''}
    <div class="mform-row">
      <label>Order Document</label>
      <div class="mform-file"><span style="font-size:15px">📄</span><input type="file" id="om-file" accept="application/pdf"></div>
      <div class="mform-or">— or —</div>
      <input id="om-link" placeholder="Paste a document link (https://…)">
    </div>
    <div class="mform-row"><label>Comment / Summary</label><textarea id="om-comment" placeholder="Brief summary of the ruling for the docket…"></textarea></div>
    <div class="mform-row"><label><input type="checkbox" id="om-seal" style="width:auto;margin-right:6px">Seal this order from public access</label></div>
  `, `${cancelBtn()}<button class="btn-primary btn-gold" id="om-submit-btn" onclick="saveIssueOrder(${taskIdx!=null?taskIdx:-1})">Enter Order</button>`);
}
window.showIssueOrderModal = showIssueOrderModal;
async function saveIssueOrder(taskIdx){
  const title = document.getElementById('om-title').value.trim();
  if(!title){ alert('Please enter an order title.'); return; }
  const judge = document.getElementById('om-judge').value || currentCase.judge || null;
  const file = document.getElementById('om-file')?.files?.[0] || null;
  let link = document.getElementById('om-link').value.trim()||null;
  const comment = document.getElementById('om-comment').value.trim()||null;
  const sealed = document.getElementById('om-seal').checked;

  const submitBtn = document.getElementById('om-submit-btn');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.innerHTML = '<span class="spin"></span> Saving…'; }
  try{
    if(file){
      const path = `case-orders/${currentCase._id}/${Date.now()}-${file.name}`;
      const fileRef = storageRef(storage, path);
      await uploadBytes(fileRef, file);
      link = await getDownloadURL(fileRef);
    }
    closeModal();
    await pushEvent({ type:'order', date:new Date().toISOString(), description:title, documentLink:link, comment, judge, sealed, enteredBy:userData.name, enteredByRole:userData.role });
    await addAudit(`Entered order: ${title}${judge?' (Judge: '+judge+')':''}${file?' — uploaded '+file.name:''}`);
    if(!sealed){
      await addNotification({ type:'NEF', title:'Notice of Entry of Order', text:`${title} was entered on the docket${judge?' by '+judge:''}.` });
    }
    if(taskIdx!=null && taskIdx>=0) await completeTask(taskIdx);
    else renderDetailPage();
  }catch(err){
    console.error(err);
    alert('Could not save this order. Please try again.');
    if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent='Enter Order'; }
  }
}
window.saveIssueOrder = saveIssueOrder;

function showFileOnBehalfModal(){
  openModal('File on Behalf of a Party', `
    <div class="mform-grid">
      <div class="mform-row"><label>Document Type</label><input id="fob-doctype" placeholder="e.g. Motion to Dismiss, Response, Notice of Appearance" list="fob-doctype-options"></div>

    </div>
    <datalist id="fob-doctype-options"><option value="Motion to Dismiss"><option value="Motion for Continuance"><option value="Response"><option value="Notice of Appearance"><option value="Objection"><option value="Stipulation"></datalist>
    ${partyDatalist('fob-party-options')}
    <div class="mform-row">

  `, `${cancelBtn()}<button class="btn-primary" id="fob-submit-btn" onclick="saveFileOnBehalf()">File Now</button>`);
}
window.showFileOnBehalfModal = showFileOnBehalfModal;
async function saveFileOnBehalf(){
  const documentType = document.getElementById('fob-doctype').value.trim();
  const filedBy = document.getElementById('fob-filedby').value.trim();
  if(!documentType || !filedBy){ alert('Please enter a document type and who it is being filed on behalf of.'); return; }
  const file = document.getElementById('fob-file')?.files?.[0] || null;
  let link = document.getElementById('fob-link').value.trim()||null;
  const notesToClerk = document.getElementById('fob-notes').value.trim()||null;
  const nowIso = new Date().toISOString();

  const submitBtn = document.getElementById('fob-submit-btn');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.innerHTML = '<span class="spin"></span> Filing…'; }
  try{
    if(file){
      const path = `case-filings/${currentCase._id}/${Date.now()}-${file.name}`;
      const fileRef = storageRef(storage, path);
      await uploadBytes(fileRef, file);
      link = await getDownloadURL(fileRef);
    }
    closeModal();

    const pfDoc = {
      filingType:'existing', court: currentCase.court, caseFirestoreId: currentCase._id, caseId: currentCase.caseId,
      documentType, filedBy, filerRole:'Court Staff (Filed on Behalf)', notesToClerk, dateFiled: nowIso,
      documents:[{ name: file?file.name:documentType, type: link?(file?'pdf':'link'):'pdf', documentType, link, fee:0 }],
      status:'Accepted', accepted:true, autoFiled:true,
      reviewedBy:userData.name, reviewedByUid:userData.uid, reviewedByRole:userData.role, reviewedAt: nowIso,
      linkedCaseId: currentCase.caseId, linkedCaseFirestoreId: currentCase._id,
      activityLog:[{ text:`Filed on behalf of ${filedBy} by ${userData.name}`, by:userData.name, at:nowIso }],
    };
    const newRef = doc(collection(db,'pendingFilings'));
    await setDoc(newRef, pfDoc);
    filingsForCase.push({...pfDoc, _id:newRef.id});

    await pushEvent({ type:'filing', date:nowIso, description:documentType, documentLink:link, comment:notesToClerk, filedBy, role:'Court Staff (Filed on Behalf)' });
    await addAudit(`Filed on behalf of ${filedBy}: ${documentType}`);

    const MOTION_KEYWORDS = ['motion','petition','application','objection'];
    if(MOTION_KEYWORDS.some(k=>documentType.toLowerCase().includes(k))){
      const tasks = [...(cm.tasks||[]), { num:(cm.tasks||[]).length+1, id:`${newRef.id}-1`, title:`${documentType} — needs review`, docType:documentType, filedBy, confirmationNumber:null, status:'Open', createdAt:nowIso, suggestedActions:['scheduleHearing','issueRuling'] }];
      await saveCM({ tasks });
    }
    await addNotification({ type:'NEF', title:'Notice of Electronic Filing', text:`${documentType} filed by ${filedBy} was entered on the docket.` });
    renderDetailPage();
  }catch(err){
    console.error(err);
    alert('Could not file this document. Please try again.');
    if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent='File Now'; }
  }
}
window.saveFileOnBehalf = saveFileOnBehalf;

// ── Auth / bootstrap ──
function showRestricted(){
  document.getElementById('restricted-wrap').style.display='block';
  document.getElementById('restricted-wrap').innerHTML = `<div class="restricted"><div class="ei">🔒</div><h2>Staff Access Only</h2><p>Case Management is limited to clerks, judicial assistants, law clerks, judges, and justices. If you believe you should have access, contact your court administrator.</p></div>`;
  document.getElementById('search-screen').style.display='none';
  document.getElementById('detail-screen').style.display='none';
}

await setPersistence(auth, browserLocalPersistence);
const unsub = onAuthStateChanged(auth, async (user) => {
  unsub();
  if(!user){
    document.getElementById('ao-msg').textContent='Session expired. Redirecting…';
    setTimeout(()=>{ window.location.href='/courts/micourt/'; }, 1500);
    return;
  }
  document.getElementById('ao-msg').textContent='Loading your profile…';
  try{
    const snap = await getDoc(doc(db,'accounts', user.uid));
    if(!snap.exists()){
      document.getElementById('ao-msg').textContent='Account not found. Redirecting…';
      setTimeout(()=>{ window.location.href='/courts/micourt/'; }, 1500);
      return;
    }
    const data = snap.data();
    userData.uid = user.uid;
    userData.name = data.name || user.displayName || 'Unknown User';
    userData.role = data.role || 'Portal User';
    userData.court = courtOf(userData.role);
    document.getElementById('topbar-user').textContent = `${userData.name} · ${userData.role}`;
    document.getElementById('auth-overlay').classList.add('hidden');

    if(!STAFF_ROLES.includes(userData.role)){
      showRestricted();
      return;
    }

    await loadJudges();
    await loadAllCasesForSearch();

    // Support deep-linking from Manage Filings (?case=ID) in addition to #case-ID hash routing.
    const params = new URLSearchParams(window.location.search);
    const caseParam = params.get('case');
    if(caseParam && !window.location.hash) window.location.hash = `case-${caseParam}`;
    else handleHash();
  }catch(err){
    console.error(err);
    document.getElementById('ao-msg').textContent='Error loading profile. Retrying…';
    setTimeout(()=>{ window.location.reload(); }, 3000);
  }
});
setTimeout(()=>{ if(!document.getElementById('auth-overlay').classList.contains('hidden')) window.location.reload(); }, 12000);
</script>

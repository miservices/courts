<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | MiCOURT</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/courts/micourt/dashboard/assets/css/dashboard.css">
</head>
<body>

<aside class="sidebar" id="sidebar-root">
  <!-- injected by assets/js/sidebar.js -->
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-eyebrow" id="topbar-court-name">Loading…</span>
      <span class="topbar-page-title" id="topbar-title">Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-date" id="topbar-date"></span>
      <div class="notif-wrap" id="notif-root"><!-- injected by assets/js/notifications.js --></div>
    </div>
  </div>

  <div class="page-body">
    <div class="page-panel">
      <div class="section-hdr">
        <div class="section-hdr-text">
          <h2 id="page-title">Dashboard</h2>
          <p id="page-subtitle"></p>
        </div>
        <div class="section-hdr-action" id="page-action"></div>
      </div>
      <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading…</div></div>
    </div>
  </div>
</div>

<div class="auth-loading-overlay" id="auth-overlay">
  <div class="alo-seal">⚖️</div>
  <div class="alo-title">MiCOURT</div>
  <div class="alo-spin"></div>
  <div class="alo-sub" id="auth-overlay-msg">Verifying your session…</div>
</div>

<script>window.PAGE_ID = "overview";</script>
<script type="module" src="/courts/micourt/dashboard/assets/js/dashboard.js"></script>
</body>
</html>

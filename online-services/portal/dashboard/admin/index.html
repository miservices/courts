<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts and Licensing | Online Portal</title>
<link rel="icon" type="image/png" href="/courts/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/courts/online-services/portal/dashboard/assets/css/dashboard.css?v=5">
<style>
.sigbox{border:1px solid var(--line,#c9d3e3);border-radius:6px;background:#fff;min-height:110px;display:flex;align-items:center;justify-content:center;padding:10px;margin:10px 0}.sigbox img{max-width:100%;max-height:120px}
.edg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:10px;max-width:600px}.edg label{display:flex;flex-direction:column;gap:4px;font-size:13px}.edg input{width:100%}
.sigbox.ck{background:repeating-conic-gradient(#e9edf3 0 25%,#fff 0 50%) 0 0/16px 16px}
.sigpad{display:block;width:100%;max-width:600px;height:180px;border:1px dashed #8a9bb5;border-radius:6px;background:#fff;touch-action:none;cursor:crosshair}
.m{color:var(--muted);font-weight:400}.mt{margin-top:14px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools .in{flex:1;min-width:200px;width:auto}.tools select.in{flex:0 0 auto;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--navy);white-space:nowrap}.chk input{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button{font:inherit;font-weight:600;font-size:14px;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chips i{font-style:normal;opacity:.75;margin-left:6px}
.tabs i{font-style:normal;font-weight:500;color:var(--muted);margin-left:6px}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:#f6f9fd}
td small,th small{display:block;color:var(--muted);font-weight:400}.num{text-align:right;white-space:nowrap}th.num{text-align:right}.pills{display:flex;gap:6px;flex-wrap:wrap}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin-bottom:14px}.amts div{display:grid;gap:2px}.amts dt{font-size:13px;color:var(--muted)}.amts dd{font-weight:700;font-size:17px;color:var(--navy)}.amts dd.owe{font-size:22px}
.alert-line{border-left:4px solid #b7791f;background:#fdf6e7;color:#6e4a10;border-radius:4px;padding:10px 14px;margin-bottom:10px}.alert-line.red{border-color:#b3261e;background:#fdf1f0;color:#7a1b13}
.note{border-left:4px solid var(--navy);background:#eef3f9;border-radius:4px;padding:10px 14px;margin-bottom:12px;color:var(--navy)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.sec{margin:18px 0 8px;font-size:16px;color:var(--navy)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 22px;margin-bottom:6px;text-align:left}.kv dt{font-size:13px;color:var(--muted)}.kv dd{font-weight:600;overflow-wrap:anywhere}
.rcpt{text-align:center;padding:6px 0 4px}.rcpt .big{font-family:var(--font-head);font-size:34px;color:var(--navy);font-weight:700;margin:6px 0}.rcpt .tick{width:54px;height:54px;border-radius:50%;background:#e4f3ea;color:#2f7d4f;font-size:30px;line-height:54px;margin:0 auto 6px}
.quote{background:#f4f7fb;border-radius:4px;padding:10px 14px;margin-bottom:16px;color:var(--navy)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.cols{grid-template-columns:1fr}}
dialog{border:0;padding:0;border-radius:6px;width:min(660px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:0 24px 60px rgba(9,22,40,.35);color:var(--text);font:inherit;overflow:hidden;margin:auto}
dialog[open]{display:flex;flex-direction:column}dialog.wide{width:min(900px,calc(100vw - 24px))}dialog::backdrop{background:rgba(9,22,40,.55)}
dialog>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:#f4f7fb}dialog>header h3{font-size:19px}dialog>header p{color:var(--muted);margin-top:2px}
.x{font:inherit;font-size:22px;line-height:1;width:36px;height:36px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;color:var(--navy);flex-shrink:0}.x:hover{background:#eef3f9}
#dlg-b{padding:20px 22px 6px;overflow:auto}#dlg-e{padding:0 22px 14px}#dlg-e .alert{margin:0}
dialog>footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#f4f7fb}
@media print{body>*:not(dialog){display:none!important}dialog{position:static!important;box-shadow:none!important;width:auto!important;max-height:none!important}dialog>footer,.x{display:none!important}}

.m{color:var(--muted);font-weight:400}.card h3{margin-bottom:6px}.card+.card{margin-top:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 22px;margin-top:12px;text-align:left}.kv dt{font-size:13px;color:var(--muted)}.kv dd{font-weight:600;overflow-wrap:anywhere}
.cols3{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:16px}@media(max-width:700px){.cols3{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tgl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.tgl input{width:20px;height:20px;margin-top:3px}.tgl small{display:block;color:var(--muted)}
.card .note,.card .alert{margin:10px 0}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools .in{flex:1;min-width:200px;width:auto}.tools select.in{flex:0 0 auto;min-width:190px}
table.t{width:100%;border-collapse:collapse}table.t th,table.t td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}table.t th{font-size:13px;color:var(--muted);font-weight:600;border-top:0}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover{background:#f6f9fd}table.t td small{display:block;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;background:#e8eef8;color:var(--navy);font-size:13px;font-weight:600}.pill.att{background:#e6f4ea;color:#1b5e32}.pill.stf{background:#fdf1dc;color:#6e4a10}
.hist{font-size:13px;color:var(--muted);margin:10px 0 0;padding-left:18px}.f{display:grid;gap:4px;margin-bottom:12px;font-weight:600;color:var(--navy)}.f small{font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="topbar-eyebrow">Online Portal</span><span class="topbar-page-title" id="topbar-title">Accounts and Licensing</span></div>
    </div>
    <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><div class="notif-wrap" id="notif-root"></div></div>
  </header>
  <main class="page-body">
    <div class="page-head"><div><h2 id="page-title">Accounts and Licensing</h2><p id="page-subtitle"></p></div><div id="page-action"></div></div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading accounts…</div></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlg-t">
  <header><div><h3 id="dlg-t"></h3><p id="dlg-w"></p></div><button class="x" type="button" aria-label="Close" data-close>×</button></header>
  <div id="dlg-b"></div><div id="dlg-e"></div><footer id="dlg-f"></footer>
</dialog>
<div class="auth-loading-overlay" id="auth-overlay" role="status"><div class="alo-title">Online Portal</div><div class="spin"></div><div>Verifying your session…</div></div>

<script type="module">
import { boot, db, $, esc, has, SELF, ATTY, STAFF } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js?v=7';
import { collection, getDocs, doc, updateDoc, arrayUnion, deleteField } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

/* The one account that may use this page. The page also needs matching Firestore rules (see firebase-setup/accounts-rule.txt):
   hiding it here is not security on its own. */
const ADMIN_UID = 'pq0nR9t2jIhBKNyw0L46vcwO2Zl1';
const { account, role, user } = await boot({ id: 'admin', title: 'Accounts and Licensing', subtitle: 'Change roles and license attorneys.' });
const root = $('page-body');
if (account.uid !== ADMIN_UID) { $('auth-overlay').hidden = true; document.body.innerHTML = '<main style="font-family:Arial,sans-serif;max-width:520px;margin:15vh auto;padding:0 20px;text-align:center"><h2>Page not found</h2><p><a href="https://migovt.org/courts/online-services/portal/dashboard/">Back to the portal</a></p></main>'; throw new Error('not authorized'); }

const ROLES = [...new Set([...SELF, ...STAFF])], GROUPS = [['Public and party roles', SELF.filter(r => !ATTY.includes(r))], ['Attorney roles (a bar number is required)', ATTY], ['Court staff and judicial roles', STAFF]];
const key = x => String(x || '').toLowerCase().replace(/[^a-z]/g, '');
const canon = r => ROLES.find(x => key(x) === key(r)) || r || 'Public User';
const isAtty = r => has(ATTY, r), kind = r => isAtty(r) ? 'att' : has(STAFF, r) ? 'stf' : '';
let people = [], q = '', rf = '';

async function load() {
  root.innerHTML = '<div class="loading-inline"><span class="spin-sm"></span>Loading accounts…</div>';
  try { people = (await getDocs(collection(db, 'accounts'))).docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''))); }
  catch (e) { console.error(e); root.innerHTML = '<div class="alert" role="alert">We could not load the accounts.</div>'; return; }
  draw();
}
function draw() {
  const n = q.trim().toLowerCase(), list = people.filter(p => (!rf || canon(p.role) === rf) && (!n || [p.name, p.email, p.barNumber, p.uid, p.role].some(v => String(v || '').toLowerCase().includes(n))));
  const roles = [...new Set(people.map(p => canon(p.role)))].sort();
  root.innerHTML = `<div id="msg"></div><section class="card"><div class="tools"><input class="in" id="q" type="search" placeholder="Search by name, email, bar number or account ID" aria-label="Search accounts" value="${esc(q)}"><select class="in" id="rf" aria-label="Filter by role"><option value="">All roles</option>${roles.map(r => `<option${rf === r ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select></div>
    <p class="m" style="margin:0 0 8px">${list.length} of ${people.length} accounts. Select one to change its role or license.</p>
    <div style="overflow:auto"><table class="t"><thead><tr><th>Name</th><th>Role</th><th>Bar number</th><th>Email</th></tr></thead><tbody>${list.map(p => `<tr data-u="${esc(p.uid)}"><td>${esc(p.name || '(no name)')}</td><td><span class="pill ${kind(canon(p.role))}">${esc(canon(p.role))}</span></td><td>${esc(p.barNumber || '')}</td><td>${esc(p.email || '')}</td></tr>`).join('') || '<tr><td colspan="4">No accounts match.</td></tr>'}</tbody></table></div></section>`;
  $('q').oninput = e => { q = e.target.value; const c = e.target.selectionStart; draw(); $('q').focus(); $('q').setSelectionRange(c, c); };
  $('rf').onchange = e => { rf = e.target.value; draw(); };
  root.querySelectorAll('tr[data-u]').forEach(r => r.onclick = () => edit(people.find(p => p.uid === r.dataset.u)));
}

/* ── one account ── */
const dlg = $('dlg'); let dlgOk = null;
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); else if (e.target.closest('#dlg-ok')) run(); });
function open(title, who, body, ok, cls, onOk) {
  $('dlg-t').textContent = title; $('dlg-w').textContent = who; $('dlg-b').innerHTML = body; $('dlg-e').innerHTML = '';
  $('dlg-f').innerHTML = `<button class="btn outline" type="button" data-close>Cancel</button><button class="btn ${cls || ''}" type="button" id="dlg-ok">${ok}</button>`; dlgOk = onOk; if (!dlg.open) dlg.showModal();
}
async function run() {
  const b = $('dlg-ok'), l = b.textContent; b.disabled = true; b.textContent = 'Saving…'; $('dlg-e').innerHTML = '';
  try { await dlgOk(); dlg.close(); draw(); } catch (e) { if (e?.name !== 'UE') console.error(e); $('dlg-e').innerHTML = `<div class="alert" role="alert">${esc(e?.name === 'UE' ? e.message : e?.code === 'permission-denied' ? 'The database refused the change. Check the accounts rule.' : 'We could not save that. Try again.')}</div>`; b.disabled = false; b.textContent = l; }
}
const bad = m => { const e = new Error(m); e.name = 'UE'; throw e; };
const when = h => { const d = new Date(h); return isNaN(d) ? '' : d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); };

function edit(p) {
  if (!p) return; const cur = canon(p.role), hist = (p.roleHistory || []).slice(-6).reverse();
  open('Role and license', `${p.name || '(no name)'} · ${p.email || p.uid}`, `
    <dl class="kv" style="margin:0 0 14px"><div><dt>Current role</dt><dd>${esc(cur)}</dd></div><div><dt>Bar number</dt><dd>${esc(p.barNumber || 'None')}</dd></div><div><dt>Account ID</dt><dd style="word-break:break-all;font-size:13px">${esc(p.uid)}</dd></div></dl>
    <label class="f"><span>Role</span><select id="e-role">${GROUPS.map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(r => `<option${r === cur ? ' selected' : ''}>${esc(r)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <label class="f" id="e-barw"><span>Bar number</span><input class="in" id="e-bar" value="${esc(p.barNumber || '')}" placeholder="e.g. P12345" autocomplete="off"><small>Attorney roles carry a bar number. It appears on every filing and appearance.</small></label>
    ${hist.length ? `<p class="sec" style="margin:14px 0 4px">Recent changes</p><ul class="hist">${hist.map(h => `<li>${esc(when(h.at))}: ${esc(h.from || '—')} to ${esc(h.to || '—')}${h.bar ? ' (Bar No. ' + esc(h.bar) + ')' : ''}${h.byName ? ' by ' + esc(h.byName) : ''}</li>`).join('')}</ul>` : ''}`,
    'Save changes', '', async () => {
      const to = $('e-role').value, bar = $('e-bar').value.trim().toUpperCase().replace(/\s+/g, '');
      if (isAtty(to) && !bar && to !== 'Provisional Attorney') bad('Enter a bar number to license this attorney.');
      if (bar && !/^[A-Z]{0,2}\d{3,8}$/.test(bar)) bad('A bar number is letters and digits, like P12345.');
      if (bar) { const dup = people.find(x => x.uid !== p.uid && String(x.barNumber || '').toUpperCase().replace(/\s+/g, '') === bar); if (dup) bad(`Bar number ${bar} already belongs to ${dup.name || dup.uid}.`); }
      if (p.uid === account.uid && to !== cur && !confirm('You are changing your own role. Continue?')) bad('Cancelled.');
      if (to === cur && bar === String(p.barNumber || '').toUpperCase()) bad('Nothing has changed.');
      const keepBar = isAtty(to) || (bar && !has(SELF.filter(r => !ATTY.includes(r)), to)), entry = { at: new Date().toISOString(), by: account.uid, byName: account.name || '', from: cur, to, ...(keepBar && bar ? { bar } : {}) };
      const patch = { role: to, roleUpdatedAt: entry.at, roleUpdatedBy: account.uid, roleHistory: arrayUnion(entry), ...(keepBar && bar ? { barNumber: bar } : { barNumber: deleteField() }), ...(isAtty(to) && bar ? { licensedAt: entry.at, licensedBy: account.uid } : {}) };
      await updateDoc(doc(db, 'accounts', p.uid), patch);
      Object.assign(p, { role: to, roleUpdatedAt: entry.at, roleHistory: [...(p.roleHistory || []), entry] }); if (keepBar && bar) p.barNumber = bar; else delete p.barNumber;
      $('msg') && ($('msg').innerHTML = `<div class="note" role="status">${esc(p.name || 'The account')} is now ${esc(to)}${keepBar && bar ? ', Bar No. ' + esc(bar) : ''}. They see it the next time they open the portal.</div>`);
    });
  const sync = () => { const a = isAtty($('e-role').value); $('e-barw').style.display = a || $('e-bar').value ? '' : 'none'; };
  $('e-role').onchange = sync; sync();
}
load();
</script>
</body>
</html>

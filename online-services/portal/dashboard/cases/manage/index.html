<!DOCTYPE html>
<html lang="en">
<head>

<style>
.m{color:var(--muted);font-weight:400}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.tools .in{flex:1;min-width:220px;width:auto}.tools select.in{flex:0 0 auto;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--navy);white-space:nowrap}.chk input{width:18px;height:18px}
.rowlink{text-decoration:none;color:var(--navy);font-weight:600}.rowlink:hover{text-decoration:underline}
tr[data-open]{cursor:pointer}
.more{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;color:var(--muted)}

.ch{padding:24px 28px}.pills{display:flex;gap:8px;flex-wrap:wrap}
.ch-title{font-size:27px;margin:10px 0 2px}.ch-num{color:var(--muted)}.ch-num b{color:var(--text);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 28px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}.facts dd{font-weight:600;overflow-wrap:anywhere}
.al{border-left:4px solid;border-radius:4px;padding:11px 16px;margin-bottom:8px}
.al.hi{border-color:#b3261e;background:#fdf1f0;color:#7a1b13}.al.med{border-color:#b7791f;background:#fdf6e7;color:#6e4a10}.al.low{border-color:var(--blue);background:#eaf2fc;color:#17335f}
.alerts{margin-bottom:16px}
.ok-bar{border-left:4px solid #2f7d4f;background:#eaf6ef;color:#154d2e;border-radius:4px;padding:11px 16px;margin-bottom:16px;font-weight:600}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.dside{position:sticky;top:88px}.dside .btn{display:block;width:100%;text-align:center;margin-bottom:8px}.dside hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.dside h4{font-family:var(--font-head);color:var(--navy);font-size:15px;margin:2px 0 10px}
@media(max-width:1000px){.dgrid{grid-template-columns:1fr}.dside{position:static}}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar .in{flex:1;min-width:200px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{font:inherit;font-weight:600;font-size:14px;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ent{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:15px 22px;border-top:1px solid #e3e9f1}.ent:first-child{border-top:0}
.en{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;padding-top:2px}
.em{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px;color:var(--muted);font-size:14px}
.edsc{font-weight:600}.struck .edsc{text-decoration:line-through;color:var(--muted)}.ecm{color:var(--muted);font-size:14.5px;margin-top:2px}
.ea{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.ent{grid-template-columns:1fr}.ea{justify-content:flex-start}}

.tk{border:1px solid var(--line);border-left:4px solid #b7791f;border-radius:4px;padding:14px 16px;margin-bottom:10px;background:#fff}.tk.done{border-left-color:#9aa8bd;background:#f8fafd}
.tk-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.tk.done .tk-top{margin-bottom:0}
details.fold>summary{cursor:pointer;font-weight:600;color:var(--navy);padding:6px 0;margin-bottom:6px}
.hrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:16px 22px;border-top:1px solid #e3e9f1}.hrow:first-child{border-top:0}
.hdate{text-align:center;border:1px solid var(--line);border-radius:4px;background:#f8fafd;padding:6px 0;align-self:start}
.hdate small{font-size:12px;text-transform:uppercase;letter-spacing:.05em}.hdate b{display:block;font-family:var(--font-head);font-size:24px;line-height:1.1;color:var(--navy)}
.hdate span{display:block;font-size:12px;color:var(--muted)}
.hh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.grp{font-family:var(--font-head);color:var(--navy);font-size:17px;padding:14px 22px 6px;background:#f4f7fb;border-top:1px solid #e3e9f1}.grp:first-child{border-top:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 22px;margin-top:12px}.kv dt{font-size:13px;color:var(--muted)}.kv dd{font-weight:600;overflow-wrap:anywhere}
.item{border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:12px;background:#fff}
.ih{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.ih h4{font-family:var(--font-head);font-size:18px;color:var(--navy)}
.sec-add{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.note{padding:12px 0;border-top:1px solid #eef2f7}.note:first-child{border-top:0}
.tl{list-style:none;margin-left:8px;border-left:2px solid var(--line)}.tl li{padding:0 0 16px 20px;position:relative}.tl li:before{content:'';position:absolute;left:-7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--navy)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}.cols3 .f{margin-bottom:16px}
.arow{display:grid;grid-template-columns:1fr 170px auto;gap:10px;margin-bottom:10px;align-items:center}
@media(max-width:700px){.cols3{grid-template-columns:1fr}.arow{grid-template-columns:1fr}}
.fin3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.fin3 div{background:#f4f7fb;border-radius:4px;padding:12px 16px}.fin3 span{display:block;font-size:13px;color:var(--muted)}.fin3 b{font-family:var(--font-head);font-size:22px;color:var(--navy)}

dialog{border:0;padding:0;border-radius:6px;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:0 24px 60px rgba(9,22,40,.35);color:var(--text);font:inherit;overflow:hidden;margin:auto}
dialog[open]{display:flex;flex-direction:column}dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(9,22,40,.55)}
dialog>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:#f4f7fb}
dialog>header h3{font-size:19px}
.x{font:inherit;font-size:22px;line-height:1;width:36px;height:36px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;color:var(--navy)}.x:hover{background:#eef3f9}
#dlg-b{padding:20px 22px 6px;overflow:auto}#dlg-e{padding:0 22px 14px}#dlg-e .alert{margin:0}
dialog>footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#f4f7fb}
#dlg-b p{margin-bottom:12px}.quote{background:#f4f7fb;border-radius:4px;padding:10px 14px;margin-bottom:16px;color:var(--navy)}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="topbar-eyebrow">Online Portal</span><span class="topbar-page-title" id="topbar-title">Case Management</span></div>
    </div>
    <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><div class="notif-wrap" id="notif-root"></div></div>
  </header>
  <main class="page-body">
    <div class="page-head"><div><h2 id="page-title">Case Management</h2><p id="page-subtitle"></p></div><div id="page-action"></div></div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading…</div></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlg-t">
  <header><h3 id="dlg-t"></h3><button class="x" type="button" aria-label="Close" data-close>×</button></header>
  <div id="dlg-b"></div><div id="dlg-e"></div>
  <footer id="dlg-f"></footer>
</dialog>
<div class="auth-loading-overlay" id="auth-overlay" role="status"><div class="alo-title">Online Portal</div><div class="spin"></div><div>Verifying your session…</div></div>

<script type="module">
import { boot, db, app, $, esc, has, STAFF, SUPREME, scopeOf, colFor, reserveFilingNumber, logAction, DISTRICT_COURT, SUPREME_COURT } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js?v=7';
import * as F from '/courts/online-services/portal/dashboard/assets/js/finance.js?v=1';
import { collection, getDocs, getDoc, doc, query, where, updateDoc, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

const { account, role } = await boot({ id: 'mcases', title: 'Case Management', subtitle: 'Find a case to manage its docket, parties, hearings, orders, and financials.' });
const root = $('page-body');
if (!has(STAFF, role)) root.innerHTML = '<section class="card"><div class="empty"><strong>Court staff only</strong><p>Case Management is limited to clerks, judicial officers, and court staff. Contact your court administrator if you need access.</p></div></section>';
else await main();

async function main() {
/* ── Roles & constants ──────────────────────────────────────────────── */
const JD = ['Magistrate', 'Judge', 'Chief Judge'], JS = ['Justice', 'Chief Justice'], JUDICIAL = [...JD, ...JS];
const scope = scopeOf(role), storage = getStorage(app), isJudicial = has(JUDICIAL, role);
// The Supreme Court has superintending control: its staff can open and manage any district court case, but those cases are not listed unless they look one up.
const superior = has(SUPREME, role), reach = superior ? [DISTRICT_COURT, SUPREME_COURT] : scope, isChief = has(['Chief Judge', 'Chief Justice'], role);
const STATUSES = ['Open', 'Mediation', 'Deferred', 'Disposed', 'Closed'];
const hashFor = id => '#' + encodeURIComponent(id);
const FILE_MANAGE = 'https://migovt.org/courts/online-services/portal/dashboard/file/manage/';

/* ── Formatting ─────────────────────────────────────────────────────── */
const hv = v => v !== undefined && v !== null && String(v).trim() !== '';
const parse = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const dateOnly = d => d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0 && d.getUTCMilliseconds() === 0;   // older records stored dates at UTC midnight
const fmtDate = s => { if (!hv(s)) return ''; const d = parse(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', ...(dateOnly(d) ? { timeZone: 'UTC' } : {}) }) : String(s); };
const fmtDT = s => { if (!hv(s)) return ''; const d = parse(s); return d ? d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : String(s); };
const fmtTime = s => { const d = hv(s) && parse(s); return d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; };
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ago = s => { if (!s) return '—'; const m = Math.floor((Date.now() - new Date(s)) / 6e4); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago'; };
const p2 = n => String(n).padStart(2, '0');
const inDate = s => { const d = parse(s); if (!d) return ''; return dateOnly(d) ? d.toISOString().slice(0, 10) : `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
const inDT = s => { const d = parse(s); return d ? `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}` : ''; };
const isoDate = v => v ? new Date(v + 'T12:00:00').toISOString() : null;   // date-only values are stored at local noon so they never slip a day
const isoDT = v => v ? new Date(v).toISOString() : null;
const now = () => new Date().toISOString();
const nameKey = n => { const t = String(n || '').toLowerCase().replace(/^hon\.?\s+/, '').replace(/[.,]/g, '').trim().split(/\s+/); return t.length ? t[0] + ' ' + t[t.length - 1] : ''; };
const stripSuffix = t => String(t || '').replace(/\s*[-–—]+\s*needs review\s*$/i, '').trim();
const stPill = s => { const t = String(s || '').toLowerCase(); return `<span class="pill ${/closed|disposed/.test(t) ? 'plain' : /pending|deferred/.test(t) ? 'warn' : t === 'mediation' ? 'mid' : 'live'}">${esc(s || 'No status')}</span>`; };
const empty = (t, p) => `<div class="empty"><strong>${esc(t)}</strong>${p ? `<p>${esc(p)}</p>` : ''}</div>`;
const dl = rows => `<dl class="details">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${hv(v) ? esc(v) : '<span class="m">—</span>'}</dd></div>`).join('')}</dl>`;
const kv = rows => `<dl class="kv">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${hv(v) ? esc(v) : '<span class="m">—</span>'}</dd></div>`).join('')}</dl>`;
const btn = (a, label, cls = 'outline sm') => `<button class="btn ${cls}" type="button" data-a="${a}">${label}</button>`;

/* ── Case helpers ───────────────────────────────────────────────────── */
const sideOf = r => /defendant|respondent|appellee/i.test(r || '') ? 1 : /plaintiff|petitioner|prosecut|appellant|applicant|complainant|claimant/i.test(r || '') ? 0 : null;
const plist = c => Array.isArray(c.parties) ? c.parties.filter(x => x && x.name) : [];
const counselOf = p => { const a = [...(p.attorneys || [])]; if (p.attorney?.name && !a.some(x => x.name === p.attorney.name)) a.unshift(p.attorney); return a.filter(x => x && x.name); };
const subOf = c => c.appellateSubtype || c.civilSubtype || c.administrativeSubtype || c.offenseType || '';
const judgeName = c => c.judge || (Array.isArray(c.judges) ? c.judges.join(', ') : '') || '';
const isCrim = c => c.caseType === 'Criminal' || c.caseType === 'Traffic';
const subField = c => { if (c.court === SUPREME_COURT) return null; const t = String(c.caseType || '').toLowerCase(); return t === 'appellate' || t === 'appeal' ? 'appellateSubtype' : t === 'civil' ? 'civilSubtype' : t === 'administrative' ? 'administrativeSubtype' : 'offenseType'; };
function pairOf(c) {
  if (Array.isArray(c.parties)) { const l = plist(c); return [l.find(x => sideOf(x.role) === 0), l.find(x => sideOf(x.role) === 1)]; }
  const o = c.parties || {};   // older records kept named slots instead of a list
  return [o.primaryPlaintiff || o.primaryPetitioner || o.appellant || o.petitioner, o.primaryDefendant || o.respondent || o.appellee];
}
function caption(c) {
  if (hv(c.caseTitleOverride)) return c.caseTitleOverride;
  const t = String(c.caseType || '').toLowerCase(), [a, b] = pairOf(c);
  if (t === 'criminal' || t === 'traffic') return a && b ? `${a.name} v. ${b.name}` : `State of Michigan v. ${b?.name || 'Unknown'}`;
  if (a && b) return `${a.name} v. ${b.name}`;
  if (a) return `Ex parte ${a.name}`;
  if (b) return `In re ${b.name}`;
  return (t === 'administrative' && c.administrativeSubtype) || c.caseId || 'Case record';
}
function roleOptions(c) {
  const t = String(c.caseType || '').toLowerCase();
  if (c.court === SUPREME_COURT) return /appeal/.test(t) ? ['Appellant', 'Appellee', 'Interested Party'] : ['Petitioner', 'Respondent', 'Interested Party'];
  if (t === 'criminal') return ['Prosecution', 'Defendant', 'Victim', 'Witness', 'Interested Party'];
  if (t === 'traffic') return ['Prosecuting Authority', 'Defendant', 'Witness', 'Interested Party'];
  if (t === 'civil') return ['Plaintiff', 'Defendant', 'Petitioner', 'Respondent', 'Third Party', 'Intervenor', 'Cross-Claimant', 'Cross-Defendant', 'Interested Party', 'Witness'];
  if (t === 'appellate') return ['Appellant', 'Appellee', 'Interested Party'];
  if (t === 'administrative') return ['Petitioner', 'Respondent', 'Interested Party'];
  return ['Plaintiff', 'Defendant', 'Petitioner', 'Respondent', 'Appellant', 'Appellee', 'Interested Party'];
}
const pool = court => judges.filter(j => has(court === SUPREME_COURT ? JS : JD, j.role));
// Courtrooms follow the judicial officer: Chief Judge 1, Judge 2, Magistrate 3.
const ROOM = { 'Chief Judge': '1', Judge: '2', Magistrate: '3' };
const roomOf = j => ROOM[j?.role] || null;
const roomLabel = v => /^\d+$/.test(String(v || '')) ? 'Courtroom ' + v : v || '';
// Who may be drawn for a case: Small Claims and Civil Infractions go to magistrates only; Special Proceedings and criminal cases to magistrates, judges or chief judges; everything else to judges or chief judges; Supreme Court cases to justices.
function eligibleRoles(c) {
  if (c.court === SUPREME_COURT) return JS;
  if (c.caseType === 'Traffic' || subOf(c) === 'Small Claims') return ['Magistrate'];
  return c.caseType === 'Criminal' || subOf(c) === 'Special Proceedings' ? ['Magistrate', 'Judge', 'Chief Judge'] : ['Judge', 'Chief Judge'];
}
function eligible(c) { const r = eligibleRoles(c); let l = judges.filter(j => has(r, j.role)); if (!l.length && !(r.length === 1 && r[0] === 'Magistrate')) l = pool(c.court); return l; }
const lot = l => l[crypto.getRandomValues(new Uint32Array(1))[0] % l.length];
const iAmPresiding = c => isJudicial && (c.judgeUid === account.uid || (!!c.judge && nameKey(c.judge) === nameKey(account.name)));
const authority = c => ({ presiding: iAmPresiding(c), chief: isChief, over: superior && c.court === DISTRICT_COURT });
const canReassign = c => { const a = authority(c); return a.presiding || a.chief || a.over; };
const canManual = c => { const a = authority(c); return a.chief || a.over; };
const isServed = p => p.served === true || (p.served === undefined && hv(p.serviceDate));
const defSide = r => sideOf(r) === 1;
const balanceOf = c => { const o = c.financialOrders || [], owed = o.reduce((s, x) => s + (x.amount || 0), 0), paid = o.reduce((s, x) => s + (x.payments || []).reduce((t, p) => t + (p.amount || 0), 0), 0); return { owed, paid, bal: Math.max(0, owed - paid) }; };

/* ── State ──────────────────────────────────────────────────────────── */
let cases = [], judges = [], cur = null, col = null, cm = null, cmExists = false, filings = [];
let tab = 'overview', docketFilter = 'all', docketQ = '', docketNewest = false, note = '', noteKind = 'ok';
const LS = { q: '', status: '', court: '', mine: isJudicial, shown: 40 };
class UserError extends Error {}
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : x);   // same record, whatever order Firestore returns its fields in
const bad = m => { throw new UserError(m); };

/* ── Load & routing ─────────────────────────────────────────────────── */
async function loadAll() {
  const [cs, acc] = await Promise.all([Promise.all(scope.map(ct => getDocs(collection(db, colFor(ct))).catch(() => ({ docs: [] })))), getDocs(collection(db, 'accounts')).catch(() => ({ docs: [] }))]);
  cases = cs.flatMap(s => s.docs.map(d => ({ ...d.data(), _id: d.id })));
  judges = acc.docs.map(d => ({ uid: d.id, name: d.data().name || 'Unnamed', role: d.data().role })).filter(j => has(JUDICIAL, j.role));
}
const idFromHash = () => { try { return decodeURIComponent(location.hash.slice(1)).replace(/^case-/, ''); } catch { return ''; } };
const setHead = (sub, action = '') => { $('page-subtitle').textContent = sub; $('page-action').innerHTML = action; };
async function route() { note = ''; const id = idFromHash(); if (id) await showCase(id); else showList(); }
window.addEventListener('hashchange', route);

/* ── Search screen ──────────────────────────────────────────────────── */
function showList() {
  cur = null; setHead('Find a case to manage its docket, parties, hearings, orders, and financials.');
  const open = cases.filter(c => !/closed|disposed/i.test(c.status || '')), weekOut = Date.now() + 7 * 864e5;
  const hearings = cases.reduce((n, c) => n + (c.hearings || []).filter(h => { const d = parse(h.date); return d && d.getTime() >= Date.now() && d.getTime() <= weekOut && !hv(h.result); }).length, 0);
  const noJudge = open.filter(c => !judgeName(c)).length;
  const stat = (l, v, al) => `<div class="stat ${al ? 'alert-stat' : ''}"><span>${l}</span><b>${v}</b></div>`;
  const statuses = [...new Set([...STATUSES, ...cases.map(c => c.status).filter(Boolean)])];
  root.innerHTML = `<div id="msg"></div><div class="stats">${stat('Total cases', cases.length)}${stat('Open', open.length)}${stat('Without a judge', noJudge, noJudge > 0)}${stat('Hearings, next 7 days', hearings)}</div>
    ${superior ? `<section class="card"><header><h3>Lower court cases</h3></header><p class="m">The Supreme Court has superintending control over the district court. Lower court cases stay out of this list, but you can open any of them by case number and manage it exactly as a district court clerk or judge would.</p>
      <div class="acts"><input class="in" id="lc-no" placeholder="Case number, e.g. 26-52996-CV" aria-label="Lower court case number" style="max-width:340px">${btn('lclookup', 'Open case', '')}</div><div id="lc-err"></div></section>` : ''}
    <div class="tools"><input class="in" id="ls-q" type="search" placeholder="Search by case number, party, judge, or keyword" aria-label="Search cases" value="${esc(LS.q)}">

/* ── Open a case ────────────────────────────────────────────────────── */
async function showCase(id) {

    }

    cur = found;

    cmExists = !!cs?.exists();
    cm = { tasks: [], notifications: [], internalNotes: [], auditLog: [], ...(cmExists ? cs.data() : {}) };
    ['tasks', 'notifications', 'internalNotes', 'auditLog'].forEach(k => cm[k] = cm[k] || []);
    const safe = p => p.catch(() => ({ docs: [] })), seen = new Set(); filings = [];
    (await Promise.all([safe(getDocs(query(collection(db, 'pendingFilings'), where('caseFirestoreId', '==', cur._id)))), safe(getDocs(query(collection(db, 'pendingFilings'), where('linkedCaseFirestoreId', '==', cur._id))))]))
      .forEach(s => s.docs.forEach(d => { if (!seen.has(d.id)) { seen.add(d.id); filings.push({ ...d.data(), _id: d.id }); } }));

}

/* ── Saving ─────────────────────────────────────────────────────────── */
// Every change re-reads the case first and applies to that copy, so edits made at the same time by e-filing or another clerk are never overwritten.
async function change(fn, audit) {
  const ref = doc(db, col, cur._id);
  const next = await runTransaction(db, async tx => {
    const s = await tx.get(ref); if (!s.exists()) bad('This case no longer exists.');
    const d = s.data(), p = fn(d) || {};
    p.dates = { ...(p.dates || d.dates || {}), lastUpdated: now() };
    tx.update(ref, p); return { ...d, ...p, __was: d };
  });
  const was = next.__was; delete next.__was;
  cur = { ...next, _id: cur._id };
  if (audit) await addAudit(audit);
  // Compensation (AO No. 4 § I): each new docket entry is an event entered; closing a case pays the officer's chambers staff.
  const added = (next.events || []).slice((was.events || []).length), isClosed = x => /^closed$/i.test(x.status || '');
  for (const e of added) await logAction(account, role, cur.court, 'event-entry', { caseId: cur.caseId, ref: `${cur.caseId}:event:${e.eventNumber}` });
  if (isClosed(next) && !isClosed(was)) await logAction(account, role, cur.court, 'case-closed', { caseId: cur.caseId, ref: `${cur.caseId}:closed`, judgeUid: cur.judgeUid, judgeName: cur.judge });
}
const withEvent = (d, ev) => { const e = [...(d.events || [])]; e.push({ eventNumber: e.reduce((m, x) => Math.max(m, x.eventNumber || 0), 0) + 1, sealed: false, ...ev }); return e; };
// Add (idx < 0), change, or remove (fn returns null) one item of a list field, optionally with a docket entry in the same save.
async function listChange(field, idx, fn, audit, evFn, xFn) {
  const old = idx >= 0 ? (cur[field] || [])[idx] : null;
  await change(d => {
    const arr = [...(d[field] || [])]; let k = -1;
    if (idx >= 0) { k = arr.findIndex(x => canon(x) === canon(old)); if (k < 0) bad('Someone else changed this record while you were editing it. Reload the case and try again.'); }
    const res = fn(idx >= 0 ? arr[k] : null, d);
    if (idx >= 0) { if (res === null) arr.splice(k, 1); else arr[k] = res; } else arr.push(res);
    const p = { [field]: arr }, ev = evFn && evFn(res, d); if (ev) p.events = withEvent(d, ev); if (xFn) Object.assign(p, xFn(res, d)); return p;
  }, audit);
}
async function eventChange(num, fn, audit) {
  await change(d => { if (!(d.events || []).some(e => e.eventNumber === num)) bad('That docket entry no longer exists.'); return { events: d.events.map(e => e.eventNumber === num ? fn(e) : e) }; }, audit);
}
// Staff-only record (caseManagement/{caseId}): tasks, notices, internal notes, audit log.
async function cmUpdate(field, fn) {
  const r = doc(db, 'caseManagement', cur._id);
  const arr = await runTransaction(db, async tx => {
    const s = await tx.get(r), next = fn([...((s.exists() && s.data()[field]) || [])]);
    if (s.exists()) tx.update(r, { [field]: next }); else tx.set(r, { tasks: [], notifications: [], internalNotes: [], auditLog: [], caseFirestoreId: cur._id, [field]: next });
    return next;
  });
  cm[field] = arr; cmExists = true;
}
const cmPush = (field, mk) => cmUpdate(field, a => [...a, mk(a)]);
const addAudit = async action => { try { await cmPush('auditLog', () => ({ action, by: account.name, byUid: account.uid, byRole: role, at: now() })); } catch (e) { console.warn('Audit entry not saved', e); } };
// Notices go out on their own whenever a hearing, order or assignment changes. A notice that fails to save never undoes the change itself.
const notify = async n => { try { await cmPush('notifications', a => ({ num: a.reduce((m, x) => Math.max(m, x.num || 0), 0) + 1, at: now(), read: false, ...n })); await addAudit(`Auto-issued notice: ${n.title || n.type} — ${n.text || ''}`); } catch (e) { console.warn('Notice not saved', e); } };
async function setTask(i, status) {

  await cmUpdate('tasks', a => { let k = a.findIndex(x => t.id && x.id === t.id); if (k < 0) k = a.findIndex(x => x.title === t.title && x.status === 'Open'); if (k < 0) bad('That task was already handled.'); a[k] = { ...a[k], status, completedAt: now(), completedBy: account.name }; return a; });

/* ── Alerts ─────────────────────────────────────────────────────────── */
function alerts() {
  const out = [], n = new Date(), open = cm.tasks.filter(t => t.status === 'Open');
  if (open.length) out.push(['med', `<b>${open.length} item${open.length > 1 ? 's' : ''}</b> in Tasks need${open.length > 1 ? '' : 's'} attention.`]);
  (cur.hearings || []).forEach(h => {
    const d = parse(h.date); if (!d) return; const diff = (d - n) / 864e5;
    if (diff >= 0 && diff <= 3 && h.result !== 'Cancelled') out.push(['hi', `<b>Hearing coming up:</b> ${esc(h.type || 'Hearing')} on ${esc(fmtDate(h.date))} at ${esc(d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }))}.`]);
    else if (diff < 0 && !hv(h.result)) out.push(['hi', `The ${esc(h.type || 'hearing')} on ${esc(fmtDate(h.date))} has no recorded result.`]);
  });
  const b = balanceOf(cur); if (b.bal > 0) out.push(['med', `Outstanding balance of <b>${money(b.bal)}</b>.`]);
  if (!cur.judge) out.push(['med', 'No judge is assigned yet. Use Randomize judge to assign one.']);
  const unserved = plist(cur).filter(p => defSide(p.role) && !isServed(p));
  if (unserved.length && !isCrim(cur) && !/closed|disposed/i.test(cur.status || '')) out.push(['med', `<b>Not yet served:</b> ${unserved.map(p => esc(p.name)).join(', ')}.`]);
  (cur.adr || []).forEach(a => { const d = parse(a.responseDeadline), diff = d ? (d - n) / 864e5 : null; if (diff !== null && diff >= -1 && diff <= 7 && !['Settled', 'Cancelled'].includes(a.result)) out.push(['med', `<b>${esc(a.type)}:</b> response due ${esc(fmtDate(a.responseDeadline))}.`]); });
  (cur.judgments || []).forEach(j => { const d = parse(j.reviewDate), diff = d ? (d - n) / 864e5 : null; if (diff !== null && diff >= -1 && diff <= 7) out.push(['low', `Compliance review for “${esc(j.outcome)}” on ${esc(fmtDate(j.reviewDate))}.`]); });
  if (cur.sealed) out.push(['low', 'This case is sealed and withheld from public Case Search.']);
  if (/closed/i.test(cur.status || '') && b.bal > 0) out.push(['hi', 'This case is closed with a balance still owed.']);
  return out;
}

/* File on behalf of a party */
function behalfModal() {
  modal({ title: 'File on behalf of a party', wide: true, ok: 'File now', body: g2(fld('Document type', 'fb-type', '', { ph: 'e.g. Motion to Dismiss, Response, Appearance', list: 'fb-types' }), fld('Filing on behalf of', 'fb-by', '', { ph: 'Party or attorney name', list: 'fb-parties' }))
    + dlist('fb-types', ['Motion to Dismiss', 'Motion for Continuance', 'Response', 'Appearance', 'Objection', 'Stipulation']) + dlist('fb-parties', partyNames())
    + fileIn('fb-file', 'Document') + fld('Or paste a document link', 'fb-link', '', { ph: 'https://…' }) + area('Notes for the docket', 'fb-notes'),
    onOk: async () => {
      const documentType = val('fb-type'), filedBy = val('fb-by'); if (!documentType || !filedBy) bad('Enter a document type and who the filing is on behalf of.');
      const file = $('fb-file').files[0]; let link = val('fb-link') || null; if (file) link = await upload('case-filings', file);
      const notes = val('fb-notes') || null, at = now(), conf = await reserveFilingNumber(cur.court, cur._id, cur.caseId);
      const pf = { confirmationNumber: conf, filingType: 'existing', court: cur.court, caseType: cur.caseType || '', caseFirestoreId: cur._id, caseId: cur.caseId, documentType, filedBy, filerRole: 'Court Staff (Filed on Behalf)', notesToClerk: notes, dateFiled: at,
        documents: [{ name: file ? file.name : documentType, type: link ? (file ? 'pdf' : 'link') : 'pdf', documentType, link, fee: 0 }], totalFee: 0, status: 'Accepted', accepted: true, autoFiled: true,
        reviewedBy: account.name, reviewedByUid: account.uid, reviewedByRole: role, reviewedAt: at, linkedCaseId: cur.caseId, linkedCaseFirestoreId: cur._id, activityLog: [{ text: `Filed on behalf of ${filedBy} by ${account.name}`, by: account.name, at }] };
      const ref = doc(collection(db, 'pendingFilings')); await setDoc(ref, pf); filings.push({ ...pf, _id: ref.id });
      await change(d => ({ events: withEvent(d, { type: 'filing', date: at, description: documentType, documentLink: link, comment: notes, filedBy, role: 'Court Staff (Filed on Behalf)', confirmationNumber: conf, docName: file ? file.name : documentType }) }), `Filed on behalf of ${filedBy}: ${documentType} (${conf})`);
      if (['motion', 'petition', 'application', 'objection'].some(k => documentType.toLowerCase().includes(k)))
        await cmPush('tasks', a => ({ num: a.reduce((m, t) => Math.max(m, t.num || 0), 0) + 1, id: `${ref.id}-1`, title: `${documentType} — needs review`, docType: documentType, filedBy, confirmationNumber: conf, status: 'Open', createdAt: at, suggestedActions: ['scheduleHearing', 'issueRuling'] }));
      await notify({ type: 'NEF', title: 'Notice of Electronic Filing', text: `${documentType} filed by ${filedBy} was entered on the docket.`, confirmationNumber: conf });
    } });
}

/* Notes */
const saveNote = async text => { if (!text) return false; await cmPush('internalNotes', () => ({ text, by: account.name, byUid: account.uid, at: now() })); return true; };

/* ── Actions ────────────────────────────────────────────────────────── */
const num = v => parseInt(v, 10);
const A = {
  more: () => { LS.shown += 40; drawResults(); },
  lclookup: async () => { const id = val('lc-no').toUpperCase(), box = $('lc-err'); box.innerHTML = ''; if (!id) { box.innerHTML = '<div class="alert" role="alert">Enter a case number.</div>'; return; }
    const s = await getDoc(doc(db, 'cases', id)).catch(() => null); if (!s?.exists()) { box.innerHTML = `<div class="alert" role="alert">No district court case has the number ${esc(id)}.</div>`; return; } location.hash = hashFor(id); },
  status: statusModal, randomize, reassign: reassignModal, entryadd: entryAddModal, judgment: i => judgmentModal(num(i)), adr: i => adrModal(num(i)),
  tab: t => { tab = t; note = ''; draw(); },
  dfilter: f => { docketFilter = f; draw(); }, dsort: () => { docketNewest = !docketNewest; draw(); },
  editdetails: editDetails, entry: n => entryModal(num(n)), behalf: behalfModal,
  order: t => orderModal(t === undefined ? -1 : num(t)), hearing: (i, t) => hearingModal(num(i), t === undefined ? -1 : num(t)),
  party: i => partyModal(num(i)), charge: i => chargeModal(num(i)), bond: i => bondModal(num(i)), bondact: i => bondActionModal(num(i)), sent: i => sentModal(num(i)), finorder: i => finModal(num(i)), pay: i => payModal(num(i)),
  hdone: i => hearingDoneModal(num(i)), hcont: i => hearingContinueModal(num(i)),
  addatty: () => { const l = readAtty(); l.push({ name: '', bar: '' }); drawAtty(l); }, rmatty: i => { const l = readAtty(); l.splice(num(i), 1); drawAtty(l); },
  newnote: () => modal({ title: 'Add an internal note', ok: 'Add note', body: area('Note', 'nn-text', '', 'Visible only to court staff'), onOk: async () => { if (!(await saveNote(val('nn-text')))) bad('Enter a note.'); } }),
  addnote: async () => { if (await saveNote(val('nt-in'))) draw(); },
  rmparty: async i => { const p = cur.parties[num(i)]; if (await ask('Remove party', `Remove <b>${esc(p.name)}</b> from this case record?`, 'Remove party', 'danger')) { await listChange('parties', num(i), () => null, 'Removed a party from the case record'); draw(); } },
  hcancel: async i => { const h = cur.hearings[num(i)]; if (await ask('Cancel hearing', `Cancel the ${esc(h.type)} on ${esc(fmtDate(h.date))}?`, 'Cancel hearing', 'danger')) {
    await listChange('hearings', num(i), x => ({ ...x, result: 'Cancelled' }), `Cancelled hearing: ${h.type} on ${fmtDate(h.date)}`, () => ({ type: 'event', date: now(), description: `Hearing cancelled: ${h.type} (was set for ${fmtDate(h.date)})` }));
    await notify({ type: 'Notice of Hearing', title: 'Notice of Hearing Cancelled', text: `The ${h.type} set for ${fmtDate(h.date)} has been cancelled.` }); draw(); } },
  taskdone: async i => { await setTask(num(i), 'Completed'); draw(); },
  taskdismiss: async i => { if (await ask('Dismiss task', 'Dismiss this task without further action?', 'Dismiss task')) { await setTask(num(i), 'Dismissed'); draw(); } },
  seal: async () => { const s = !cur.sealed; if (await ask(s ? 'Seal case' : 'Unseal case', s ? 'Seal this entire case from public Case Search?' : 'Unseal this case for public Case Search?', s ? 'Seal case' : 'Unseal case')) { await change(() => ({ sealed: s }), s ? 'Sealed the entire case from public search' : 'Unsealed the case for public search'); draw(); } },
  close: async () => { const closing = !/closed/i.test(cur.status || '');
    if (await ask(closing ? 'Close case' : 'Reopen case', closing ? 'Close this case? You can reopen it later.' : 'Reopen this case?', closing ? 'Close case' : 'Reopen case', closing ? 'danger' : '')) {
      await change(d => closing ? { status: 'Closed', dates: { ...(d.dates || {}), closed: now() } } : { status: 'Open', dates: { ...(d.dates || {}), closed: null } }, closing ? 'Closed the case' : 'Reopened the case'); draw(); } }
};
document.addEventListener('click', async e => {
  const row = e.target.closest('tr[data-open]'); if (row && !e.target.closest('a,button')) { location.hash = hashFor(row.dataset.open); return; }
  const el = e.target.closest('[data-a]'); if (!el || dlg.contains(el) && !['addatty', 'rmatty'].includes(el.dataset.a.split(':')[0])) return;
  const [n, ...v] = el.dataset.a.split(':'); if (!A[n]) return;
  try { await A[n](...v); } catch (err) { console.error(err); flash(errText(err), 'bad'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lc-no') A.lclookup(); });
document.addEventListener('input', e => {
  if (e.target.id === 'ls-q') { LS.q = e.target.value; LS.shown = 40; drawResults(); } else if (e.target.id === 'dk-q') { docketQ = e.target.value; $('dk-list').innerHTML = docketRows(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ls-status') { LS.status = e.target.value; LS.shown = 40; drawResults(); } else if (e.target.id === 'ls-court') { LS.court = e.target.value; LS.shown = 40; drawResults(); } else if (e.target.id === 'ls-mine') { LS.mine = e.target.checked; LS.shown = 40; drawResults(); }
});

/* ── Start ──────────────────────────────────────────────────────────── */
try { await loadAll(); } catch (e) { console.error(e); }
await route();
}
</script>
</body>
</html>

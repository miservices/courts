const root = $('page-body'), CM = 'https://migovt.org/courts/online-services/portal/dashboard/cases/manage/#', MH = 'https://migovt.org/courts/online-services/portal/dashboard/hearings/manage/';

async function main() {

dlg.addEventListener('input', e => dlgChange?.(e)); dlg.addEventListener('change', e => dlgChange?.(e));
const val = id => ($(id)?.value || '').trim();
const fld = (label, id, v = '', o = {}) => `<label class="f"><span>${label}</span><input id="${id}" type="${o.type || 'text'}" value="${esc(v)}"${o.step ? ` step="${o.step}"` : ''}${o.min != null ? ` min="${o.min}"` : ''}${o.list ? ` list="${o.list}"` : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.ro ? ' readonly' : ''}>${o.hint ? `<small class="m">${o.hint}</small>` : ''}</label>`;
const area = (label, id, v = '', ph = '') => `<label class="f"><span>${label}</span><textarea id="${id}" rows="4" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
const selF = (label, id, opts, v) => `<label class="f"><span>${label}</span><select id="${id}">${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${ov === v ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
const g2 = (...c) => `<div class="cols">${c.join('')}</div>`, dlist = (id, l) => `<datalist id="${id}">${l.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;

const stat = (l, v, al) => `<div class="stat ${al ? 'alert-stat' : ''}"><span>${l}</span><b>${v}</b></div>`;
const notAllowed = (t, m) => `<section class="card"><div class="empty"><strong>${t}</strong><p>${m}</p></div></section>`;
// Updates one case in a transaction (adds docket events and summary fields) and returns the new case data.
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : x);   // same record, whatever order Firestore returns its fields in
async function editCase(c, fn) {

  const next = await runTransaction(db, async tx => { const s = await tx.get(r); if (!s.exists()) bad('This case no longer exists.'); const d = s.data(), out = fn(d, at) || {}, p = { ...(out.patch || {}), dates: { ...(d.dates || {}), lastUpdated: iso(at) } };

const scope = scopeOf(role), p2 = n => String(n).padStart(2, '0'), dayKey = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hv = v => v !== undefined && v !== null && String(v).trim() !== '', parse = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const fmtLong = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }), fmtDate = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }), fmtTime = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

const roomLabel = v => /^\d+$/.test(String(v || '')) ? 'Courtroom ' + v : v || 'No courtroom (video or unassigned)';
const MINS = { Arraignment: 15, 'Pretrial Conference': 20, 'Small Claims Hearing': 30, 'Motion Hearing': 30, 'Preliminary Examination': 60, 'Traffic Hearing': 15, 'Jury Trial': 480, 'Bench Trial': 240, 'Sentencing Hearing': 30, 'Oral Argument': 15 };
const hMins = h => parseInt(h.minutes, 10) || MINS[h.type] || 30;
const ctx = () => ({ account, role, accts, scope });
let cases = [], accts = [], all = [], conflicts = new Map(), tab = 'daily', day = dayKey(new Date()), fRoom = '', fOfficer = '', fType = '', q = '', cs = { status: 'active', type: '', judge: '', q: '', n: 80 }, note = '', noteKind = 'ok', newest = true;
const safe = p => p.catch(() => ({ docs: [] }));
async function load() {
  const [a, b] = await Promise.all([Promise.all(scope.map(ct => safe(getDocs(collection(db, colFor(ct)))))), safe(getDocs(collection(db, 'accounts')))]);
  cases = a.flatMap(s => s.docs.map(d => ({ ...d.data(), _id: d.id }))); accts = b.docs.map(d => ({ uid: d.id, ...d.data() })); rebuild();
}
function rebuild() {
  all = []; cases.forEach(c => (c.hearings || []).forEach((h, i) => { const when = parse(h.date); if (when) all.push({ key: `${c._id}~${i}`, c, h, when, mins: hMins(h) }); })); all.sort((x, y) => x.when - y.when);
  conflicts = new Map(); const live = all.filter(x => !hv(x.h.result));
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) { const a = live[i], b = live[j]; if (b.when >= new Date(a.when.getTime() + a.mins * 6e4)) break;
    const why = a.h.officer && a.h.officer === b.h.officer ? `${a.h.officer} is in two hearings at once` : a.h.courtroom && a.h.courtroom === b.h.courtroom && a.h.attendance !== 'video' && b.h.attendance !== 'video' ? `${roomLabel(a.h.courtroom)} is double-booked` : '';

const can = c => governs(ctx(), c);
const stateOf = x => x.h.result === 'Cancelled' ? ['plain', 'Cancelled'] : hv(x.h.result) ? ['done', 'Held'] : x.when < new Date() ? ['bad', 'Needs result'] : ['live', 'Set'];
const attys = c => [...new Set(partiesOf(c).flatMap(p => [...(p.attorneys || []), ...(p.attorney ? [p.attorney] : [])].map(a => a?.name).filter(Boolean)))].slice(0, 3);
const isOpenC = c => !/closed|disposed|dismissed/i.test(c.status || '');
const caseByRef = k => cases.find(c => c._id === k);

/* ── Views ──────────────────────────────────────────────────────────── */
function draw() {
  const today = dayKey(new Date()), todays = all.filter(x => dayKey(x.when) === today && x.h.result !== 'Cancelled'), needs = all.filter(x => !hv(x.h.result) && x.when < new Date()).length, open = cases.filter(isOpenC).length;
  const wr = cases.reduce((n, c) => n + (c.warrants || []).filter(w => w.status === 'Issued').length, 0);
  const label = scope.length === 1 ? scope[0] : 'Michigan Courts';
  root.innerHTML = `${note ? `<div class="${noteKind === 'ok' ? 'note' : 'alert-line red'}" role="status">${esc(note)}</div>` : ''}
    <section class="dk-hero"><div><h3>Official docket</h3><div class="court">${esc(label)}</div><div class="day">${esc(fmtLong(new Date()))}</div></div>
      <div class="dk-nums"><div><b>${todays.length}</b><span>On today</span></div><div><b>${open}</b><span>Open cases</span></div><div class="${needs ? 'hot' : ''}"><b>${needs}</b><span>Need a result</span></div><div class="${wr ? 'hot' : ''}"><b>${wr}</b><span>Active warrants</span></div></div></section>
    <div class="perm ${isJudicial(role) ? 'edit' : 'view'}">${isChief(role) ? `<b>Chief ${scope[0] === 'Michigan Supreme Court' ? 'Justice' : 'Judge'}.</b> You can change anything on this docket.` : isJudicial(role) ? '<b>You can change</b> hearings and entries in cases you preside over, and cases heard by magistrates you supervise. Everything else is view only.' : '<b>View only.</b> Only the chief judge, the presiding judge, or a magistrate’s supervising judge can change the docket.'}</div>
    <div class="tabs" role="tablist">${[['daily', 'Daily docket'], ['register', 'Case register'], ['oversight', 'Oversight']].map(([k, l]) => `<button type="button" role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-a="tab:${k}">${l}</button>`).join('')}</div>
    ${tab === 'daily' ? dailyView() : tab === 'register' ? registerView() : oversightView()}`;
}
const dayList = k => all.filter(x => dayKey(x.when) === k);
function dailyView() {
  const d0 = new Date(day + 'T12:00:00'), start = new Date(d0); start.setDate(d0.getDate() - d0.getDay());
  const strip = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); const k = dayKey(d), n = dayList(k).filter(x => x.h.result !== 'Cancelled').length; return `<button type="button" class="${k === day ? 'on' : ''} ${k === dayKey(new Date()) ? 'today' : ''}" data-a="day:${k}"><small>${d.toLocaleDateString('en-US', { weekday: 'short' })}</small><b>${d.getDate()}</b><i>${n} hearing${n === 1 ? '' : 's'}</i></button>`; }).join('');
  const base = dayList(day), rooms = [...new Set(base.map(x => x.h.courtroom || x.c.courtroomNumber || ''))].sort(), officers = [...new Set(base.map(x => x.h.officer).filter(Boolean))].sort(), types = [...new Set(base.map(x => x.h.type).filter(Boolean))].sort();
  const l = base.filter(x => (!fRoom || (x.h.courtroom || x.c.courtroomNumber || '') === fRoom) && (!fOfficer || x.h.officer === fOfficer) && (!fType || x.h.type === fType) && (!q || [x.c.caseId, caption(x.c), x.h.type, x.h.officer].join(' ').toLowerCase().includes(q.toLowerCase())));
  const by = {}; l.forEach(x => (by[x.h.courtroom || x.c.courtroomNumber || ''] ||= []).push(x));
  const sheets = Object.keys(by).sort().map(r => { const items = by[r], offs = [...new Set(items.map(x => x.h.officer).filter(Boolean))];
    return `<section class="sheet"><div class="room-h"><h4>${esc(roomLabel(r))}</h4><span>${offs.length ? esc(offs.join(' · ')) + ' · ' : ''}${items.length} matter${items.length === 1 ? '' : 's'}</span></div>${items.map(x => { const [st, stl] = stateOf(x), end = new Date(x.when.getTime() + x.mins * 6e4), a = attys(x.c); return `<div class="call" data-a="h:${esc(x.key)}"><div class="t">${esc(fmtTime(x.when))}<small>to ${esc(fmtTime(end))}</small></div><div><div class="cn">${esc(x.c.caseId)} · ${esc(x.c.caseType || '')}</div><div class="cap">${esc(caption(x.c))}</div><div class="mat"><b>${esc(x.h.type || 'Hearing')}</b>${x.h.attendance === 'video' ? ' · Video' : x.h.attendance === 'hybrid' ? ' · In person or video' : ''}${x.h.officer ? ` · ${esc(x.h.officer)}` : ''}</div>${a.length ? `<div class="atty">Counsel: ${esc(a.join('; '))}</div>` : ''}${conflicts.has(x.key) ? `<div class="clash">${esc(conflicts.get(x.key))}</div>` : ''}</div><div class="st"><span class="stamp ${st}">${stl}</span>${can(x.c) ? '' : '<small class="m">View only</small>'}</div></div>`; }).join('')}</section>`; }).join('');

    <div class="datebar"><h3>${esc(fmtLong(d0))}</h3><button class="btn outline sm" type="button" data-a="step:-1">Previous day</button><button class="btn outline sm" type="button" data-a="step:1">Next day</button><button class="btn outline sm" type="button" data-a="day:${dayKey(new Date())}">Today</button><input class="in" type="date" id="f-day" value="${day}" aria-label="Go to date"></div>
    <div class="tools"><input class="in" id="f-q" type="search" placeholder="Search by case, caption, hearing, or judge" value="${esc(q)}"><select class="in" id="f-room" aria-label="Courtroom"><option value="">All courtrooms</option>${rooms.map(r => `<option value="${esc(r)}" ${fRoom === r ? 'selected' : ''}>${esc(roomLabel(r))}</option>`).join('')}</select><select class="in" id="f-off" aria-label="Judicial officer"><option value="">All judicial officers</option>${officers.map(o => `<option ${fOfficer === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><select class="in" id="f-type" aria-label="Hearing type"><option value="">All hearing types</option>${types.map(o => `<option ${fType === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>
    ${sheets || `<section class="card"><div class="empty"><strong>No hearings on ${esc(fmtDate(d0))}</strong><p>${base.length ? 'Nothing matches your filters.' : 'Use the week strip or date box to look at another day.'}</p></div></section>`}`;
}
function registerView() {
  const judges = [...new Set(cases.map(c => c.judge).filter(Boolean))].sort(), types = [...new Set(cases.map(c => c.caseType).filter(Boolean))].sort();
  const l = cases.filter(c => (cs.status === 'all' || (cs.status === 'active' ? isOpenC(c) : !isOpenC(c))) && (!cs.type || c.caseType === cs.type) && (!cs.judge || (cs.judge === '__none' ? !c.judge : c.judge === cs.judge)) && (!cs.q || [c.caseId, caption(c), c.judge, ...partiesOf(c).map(p => p.name)].join(' ').toLowerCase().includes(cs.q.toLowerCase()))).sort((x, y) => String(y.dates?.filed || '').localeCompare(String(x.dates?.filed || '')));
  const nextH = c => (c.hearings || []).map(h => ({ h, w: parse(h.date) })).filter(x => x.w && x.w > new Date() && !hv(x.h.result)).sort((a, b) => a.w - b.w)[0];
  return `<div class="tools"><input class="in" id="c-q" type="search" placeholder="Search by case number, caption, party, or judge" value="${esc(cs.q)}"><select class="in" id="c-status" aria-label="Status"><option value="active" ${cs.status === 'active' ? 'selected' : ''}>Open cases</option><option value="closed" ${cs.status === 'closed' ? 'selected' : ''}>Closed cases</option><option value="all" ${cs.status === 'all' ? 'selected' : ''}>All cases</option></select><select class="in" id="c-type" aria-label="Case type"><option value="">All case types</option>${types.map(t => `<option ${cs.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select><select class="in" id="c-judge" aria-label="Judge"><option value="">All judges</option><option value="__none" ${cs.judge === '__none' ? 'selected' : ''}>Not assigned</option>${judges.map(j => `<option ${cs.judge === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}</select></div>
  <section class="card flush">${!l.length ? '<div class="empty"><strong>No cases match</strong></div>' : `<div class="table-scroll"><table><thead><tr><th>Case</th><th>Type</th><th>Judicial officer</th><th>Filed</th><th>Next hearing</th><th>Status</th></tr></thead><tbody>${l.slice(0, cs.n).map(c => { const n = nextH(c); return `<tr data-a="case:${esc(c._id)}"><td><b>${esc(c.caseId)}</b><small>${esc(caption(c))}</small></td><td>${esc(c.caseType || '—')}</td><td>${esc(c.judge || 'Not assigned')}${c.courtroomNumber ? `<small>Courtroom ${esc(c.courtroomNumber)}</small>` : ''}</td><td>${esc(sd(c.dates?.filed))}</td><td>${n ? `${esc(fmtDate(n.w))}<small>${esc(n.h.type || '')}</small>` : '<span class="m">None</span>'}</td><td><span class="pill ${isOpenC(c) ? 'live' : 'plain'}">${esc(c.status || '—')}</span></td></tr>`; }).join('')}</tbody></table></div>${l.length > cs.n ? `<div style="padding:12px;text-align:center"><button class="btn outline" type="button" data-a="more">Show more (${l.length - cs.n} left)</button></div>` : ''}`}</section>`;

  const nojudge = cases.filter(c => isOpenC(c) && !c.judge).slice(0, 30), wc = cases.filter(c => (c.warrants || []).some(w => w.status === 'Issued')).slice(0, 30), unserved = cases.filter(c => isOpenC(c) && partiesOf(c).some(p => /defendant|respondent/i.test(p.role || '') && !(p.served === true || (p.served === undefined && p.serviceDate)))).slice(0, 30);

/* ── Hearing detail and changes ─────────────────────────────────────── */
const kvl = r => `<dl class="sh-head">${r.filter(x => x[1] !== undefined && x[1] !== null && x[1] !== '').map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;

    body: `<div class="pills" style="margin-bottom:10px"><span class="stamp ${st}">${stl}</span></div>` + kvl([['Date', fmtLong(x.when)], ['Time', `${fmtTime(x.when)} to ${fmtTime(new Date(x.when.getTime() + x.mins * 6e4))}`], ['Courtroom', roomLabel(x.h.courtroom || c.courtroomNumber)], ['Judicial officer', x.h.officer || pres?.name || c.judge], ['Attendance', x.h.attendance === 'video' ? 'Video only' : x.h.attendance === 'hybrid' ? 'In person or by video' : 'In person'], ['Result', x.h.result], ['Notes', x.h.notes]])
      + (conflicts.has(x.key) ? `<div class="alert-line red">${esc(conflicts.get(x.key))}</div>` : '') + (!can(c) ? '<p class="m">Only the chief judge, the presiding judge, or a magistrate’s supervising judge can change this hearing. To record a result, use Manage Hearings.</p>' : `<p class="m">To record the outcome of the hearing, use <a href="${MH}">Manage Hearings</a>.</p>`) });
}
const clashFor = (x, when, room, officer, mins) => { const end = new Date(when.getTime() + mins * 6e4); return all.filter(y => y.key !== x.key && !hv(y.h.result) && y.when < end && new Date(y.when.getTime() + y.mins * 6e4) > when).map(y => officer && y.h.officer === officer ? `${officer} is in ${y.c.caseId} at that time.` : room && (y.h.courtroom || y.c.courtroomNumber) === room && y.h.attendance !== 'video' ? `${roomLabel(room)} is booked for ${y.c.caseId} at that time.` : '').find(Boolean); };
const cmNotice = async (c, n) => { try { const r = doc(db, 'caseManagement', c._id); await runTransaction(db, async tx => { const s = await tx.get(r), a = [...((s.exists() && s.data().notifications) || [])], next = [...a, { num: a.reduce((m, y) => Math.max(m, y.num || 0), 0) + 1, at: iso(), read: false, ...n }]; s.exists() ? tx.update(r, { notifications: next }) : tx.set(r, { tasks: [], notifications: next, internalNotes: [], auditLog: [], caseFirestoreId: c._id }); }); } catch (e) { console.warn('Notice not saved', e); } };
function reschedModal(x) {

  modal({ title: 'Reschedule hearing', sub: `${c.caseId} · ${x.h.type || 'Hearing'}`, ok: 'Reschedule', okCls: 'good', body: fld('New date and time', 'r-when', loc, { type: 'datetime-local' }) + selF('Courtroom', 'r-room', [['', 'No courtroom (video)'], ['1', 'Courtroom 1'], ['2', 'Courtroom 2'], ['3', 'Courtroom 3'], ...(x.h.courtroom && !['1', '2', '3'].includes(String(x.h.courtroom)) ? [[x.h.courtroom, x.h.courtroom]] : [])], String(x.h.courtroom || '')) + area('Reason (required)', 'r-why'),

        return { patch: { hearings: arr }, event: { description: `${old.type || 'Hearing'} rescheduled from ${parse(old.date).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })} to ${nd.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}${room ? ', ' + roomLabel(room) : ''}.`, comment: why } }; });

      + `<h4 class="sec">Register of actions <button class="btn outline sm" type="button" data-a="flip:${esc(c._id)}">${newest ? 'Newest first' : 'Oldest first'}</button></h4><table class="reg"><thead><tr><th>No.</th><th>Date</th><th>Proceedings</th></tr></thead><tbody>${ev.map(e => `<tr class="${e.sealed ? 'sealed' : ''}"><td>${esc(e.eventNumber ?? '')}</td><td>${esc(sd(e.date))}</td><td>${esc(e.description || e.type || '')}${e.sealed ? ' <span class="pill warn">Sealed</span>' : ''}${e.comment ? `<small>${esc(e.comment)}</small>` : ''}${e.documentLink ? ` <a href="${esc(e.documentLink)}" target="_blank" rel="noopener">Document</a>` : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="m">No entries.</td></tr>'}</tbody></table>` });

function entryModal(c) {

    onOk: async () => { const d = val('e-desc'); need(d, 'Enter the docket entry.'); await editCase(c, () => ({ event: { type: val('e-type'), description: d, comment: val('e-com') || null, sealed: $('e-seal').checked } })); rebuild(); note = 'Docket entry added.'; noteKind = 'ok'; caseModal(c); draw(); } });

/* ── Events ─────────────────────────────────────────────────────────── */
function act(a) {
  const i = a.indexOf(':'), n = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  if (n === 'tab') { tab = v; note = ''; draw(); } else if (n === 'day') { day = v; draw(); } else if (n === 'step') { const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + Number(v)); day = dayKey(d); draw(); }
  else if (n === 'h') { const x = all.find(y => y.key === v); x && hearingModal(x); } else if (n === 'resched') { const x = all.find(y => y.key === v); x && reschedModal(x); } else if (n === 'cancelh') { const x = all.find(y => y.key === v); x && cancelModal(x); }
  else if (n === 'case') { const c = caseByRef(v); c && caseModal(c); } else if (n === 'entry') { const c = caseByRef(v); c && entryModal(c); } else if (n === 'flip') { newest = !newest; const c = caseByRef(v); c && caseModal(c); } else if (n === 'more') { cs.n += 80; draw(); }
}
const keep = id => { const i = $(id); if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch { } } };
root.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); });
root.addEventListener('input', e => { const t = e.target; if (t.id === 'f-q') { q = t.value; draw(); keep('f-q'); } else if (t.id === 'c-q') { cs.q = t.value; cs.n = 80; draw(); keep('c-q'); } });
root.addEventListener('change', e => { const t = e.target, m = { 'f-day': () => day = t.value || day, 'f-room': () => fRoom = t.value, 'f-off': () => fOfficer = t.value, 'f-type': () => fType = t.value, 'c-status': () => cs.status = t.value, 'c-type': () => cs.type = t.value, 'c-judge': () => cs.judge = t.value }; if (m[t.id]) { m[t.id](); draw(); } });
try { await load(); } catch (e) { console.error(e); root.innerHTML = '<div class="alert" role="alert"><strong>We could not load the docket.</strong><p>Refresh to try again.</p></div>'; throw e; }
{ const h = decodeURIComponent(location.hash.slice(1)); const c = h && cases.find(k => k.caseId === h || k._id === h); if (c) { tab = 'register'; cs.q = c.caseId; cs.status = 'all'; draw(); caseModal(c); } else draw(); }

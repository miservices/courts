/* ===== Redesign: library, cards, editor chrome ===== */
:root{--dd-navy:var(--navy,#10264a);--dd-line:#dbe1ec;--dd-soft:#f3f6fb;--dd-ink:#18223a;--dd-mut:#5f6c82;--dd-acc:#2b5db8}

.dd-search{position:relative;flex:1 1 320px;min-width:220px}
.dd-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7a869b;pointer-events:none}
.dd-search input{width:100%;box-sizing:border-box;height:46px;padding:0 16px 0 44px;border:1px solid var(--dd-line);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--dd-ink);box-shadow:0 1px 2px rgba(16,38,74,.05)}

.dd-bar .btn{height:46px;border-radius:12px;white-space:nowrap}
.dd-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}.dd-h h3{margin:0;font-size:19px;color:var(--dd-navy);font-family:var(--font-head,inherit)}.dd-h span{color:var(--dd-mut);font-size:13px}.dd-h .sp{flex:1}
.dd-sec{margin-bottom:34px}

.dd-seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--dd-mut);padding:6px 13px;border-radius:8px;cursor:pointer}
.dd-seg button i{font-style:normal;opacity:.7;margin-left:5px;font-weight:500}
.dd-seg button.on{background:#fff;color:var(--dd-navy);box-shadow:0 1px 3px rgba(16,38,74,.18)}
.dd-seg button:focus-visible{outline:2px solid var(--dd-acc)}
.dd-sort{height:34px;border:1px solid var(--dd-line);border-radius:8px;background:#fff;font:inherit;font-size:13px;padding:0 8px;color:var(--dd-ink)}
/* new-document tiles */
.dd-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dd-tile{display:flex;gap:14px;align-items:flex-start;padding:14px;background:#fff;border:1px solid var(--dd-line);border-radius:14px;text-decoration:none;color:inherit;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}
.dd-tile:hover{transform:translateY(-2px);border-color:#b7c5de;box-shadow:0 8px 22px rgba(16,38,74,.12)}
.dd-tile:focus-visible{outline:3px solid #7fa9e6;outline-offset:2px}
.dd-tile .ic{flex:none;width:52px;height:68px;border-radius:5px;background:#fff;border:1px solid #cdd6e6;box-shadow:2px 3px 0 #e3e9f4;padding:8px 7px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}

    try { keys.forEach(k => cur.engine.assign(k, { uid: 'link:' + token, name })); await s.flush();
      await be.createSignLink(token, { docId: s.docId, ownerUid: s.meta.ownerUid, title: s.meta.title || 'Untitled', formId: cur.form.id, name, keys, md: cur.engine.getMd(), createdBy: uid, createdByName: myName, expiresAt: Date.now() + 14 * 864e5 });
      gname = ''; gbusy = false; let copied = false; try { await navigator.clipboard.writeText(SIGN_URL(token)); copied = true; } catch { }
      shMsg(copied ? `Signing link for ${name} created and copied. Send it to them.` : `Signing link for ${name} created. Use Copy link next to their name.`); }
    catch (er) { console.error(er); keys.forEach(k => cur.engine.assign(k, null)); gbusy = false; shMsg(er?.code === 'permission-denied' ? 'The Firestore rules do not allow signing links yet. (permission-denied)' : 'We could not create the link. Try again.', true); }
  }
  else if (a === 'copylink') { try { await navigator.clipboard.writeText(SIGN_URL(b.dataset.t)); shMsg('Signing link copied.'); } catch { shMsg(SIGN_URL(b.dataset.t)); } }
  else if (a === 'revoke') { const l = links.find(x => x.id === b.dataset.t); try { await be.setSignLink(b.dataset.t, { status: 'revoked' }); (l?.keys || []).forEach(k => cur.engine.assign(k, null)); await s.flush(); shMsg('Signing link cancelled.'); } catch (er) { console.error(er); shMsg('We could not cancel that link. Try again.', true); } }
  else if (a === 'remove') { try { (s.meta?.signKeys?.[b.dataset.uid] || []).forEach(k => cur.engine.assign(k, null)); await s.flush(); await s.removeMember(b.dataset.uid); shMsg('Removed.'); } catch (er) { console.error(er); shMsg('We could not remove them. Try again.', true); } }
});
dlg.addEventListener('change', async e => {
  const s = cur?.session; if (!s) return;
  try {
    if (e.target.id === 'sh-link') { await s.setLinkAccess(e.target.value); shMsg('Link setting saved.'); }
    else if (e.target.id === 'sh-role') syncLine();
    else if (e.target.id === 'sh-any' || e.target.name === 'sl') { if (e.target.id === 'sh-any') signAny = e.target.checked; else e.target.checked ? signSel.add(e.target.value) : signSel.delete(e.target.value); renderShare(); }
    else if (e.target.dataset.role) { await s.setRole(e.target.dataset.role, e.target.value); shMsg('Access updated.'); }
  } catch (er) { console.error(er); shMsg('We could not change that. Try again.', true); }

/* ---------- File: hand the saved document to the filing screen ---------- */
const SIG_URL = 'https://migovt.org/courts/online-services/portal/dashboard/settings/#signature';
const FILE_URL = 'https://migovt.org/courts/online-services/portal/dashboard/file/';
async function fileIt(def) {
  const s = cur?.session, e = cur?.engine; if (!s || !e) return;
  const waiting = (e.sigLines?.() || []).filter(l => l.awaiting && !l.signed);
  if (waiting.length && !(await ask({ title: 'Not signed yet', message: 'Still waiting for: ' + waiting.map(l => l.label + ' (' + l.awaiting + ')').join('; ') + '. Continue anyway?', ok: 'Continue', cancel: 'Go back' }))) return;
  try { if (!s.docId) await s.save(true); else await s.flush(); } catch (er) { console.warn(er); }
  if (!s.docId || s.isDirty()) { await ask({ title: 'Could not save yet', message: 'This document has to be saved before it can be filed. Check your connection and try again.', ok: 'OK', info: true }); return; }
  if (has(STAFF, role)) { try { sessionStorage.setItem('fd-order', JSON.stringify({ id: s.docId, title: cur.session?.title || e.api.val?.('title') || '', md: e.getMd() })); } catch { }   // handed over in this tab, so the order does not depend on a second Storage read
    location.href = 'https://migovt.org/courts/online-services/portal/dashboard/cases/manage/?order=' + encodeURIComponent(s.docId); return; }
  location.href = FILE_URL + '#from=' + encodeURIComponent(s.docId);
}

/* ---------- builder settings ---------- */
async function settingsView() {
  if (favCache === null) { favCache = await be.getFavs(uid); if (favCache === null) { try { favCache = JSON.parse(localStorage.getItem('fd-font-favs') || '[]'); } catch { favCache = []; } } }
  if (!document.getElementById('fd-gfonts')) { const l = document.createElement('link'); l.id = 'fd-gfonts'; l.rel = 'stylesheet'; l.href = GFONTS; document.head.appendChild(l); }
  const mySig = await be.getSignature(uid), cfg = settings?.fonts || {}, sizes = [8, 9, 10, 11, 12, 13, 14, 15, 16];
  const fontSel = (k, first) => `<select id="st-${k}-f" aria-label="Font">${first}${FONT_TYPES.filter(t => t.id !== 'sigimg').map(t => { const l = t.fonts.filter(f => f !== 'Arial' && fontAllowed(f, role, k)); return l.length ? `<optgroup label="${esc(t.label)}">${l.map(f => `<option value="${esc(f)}"${cfg[k]?.f === f ? ' selected' : ''}>${esc(f)}</option>`).join('')}</optgroup>` : ''; }).join('')}</select>`;
  const row = (k, t, h, first) => `<div class="st-r"><div class="st-t"><b>${t}</b><small class="fd-hint">${h}</small></div>${fontSel(k, first)}<select id="st-${k}-s" aria-label="Size in points"><option value="">Auto size</option>${sizes.map(n => `<option value="${n}"${+cfg[k]?.s === n ? ' selected' : ''}>${n} pt</option>`).join('')}</select><div class="st-p" id="st-${k}-p"></div></div>`;
  root.innerHTML = `<div class="fd-top fd-bar"><a class="fd-back" href="${BASE}#"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>All documents</a><h3 style="margin:0">Document builder settings</h3></div>
    <section class="card"><h3>Signature</h3><p class="m">${mySig ? 'This is the signature on file. You can sign any of your signature lines with it, or with a plain /s/.' : 'Until you add a picture, signature lines show a typed signature: /s/ and your name in the standard font at 10 pt.'}</p>
      <div style="border:1px solid #c9d3e3;border-radius:6px;background:#fff;padding:12px 16px;margin:8px 0 12px;min-height:48px;display:flex;align-items:center">${mySig ? `<img src="${esc(mySig)}" alt="Your signature" style="max-height:70px;max-width:100%">` : `<span style="font:10pt 'Times New Roman',serif;color:#000">/s/ ${esc(myName || 'Your name')}</span>`}</div>
      <a class="btn outline" href="https://migovt.org/courts/online-services/portal/dashboard/settings/#signature">${mySig ? 'Change or remove signature' : 'Add a signature'}</a></section>
    <section class="card"><h3>Document fonts</h3><p class="m">New documents start with these fonts. You can still change fonts inside any document.</p>
      ${row('body', 'Default text', 'The main text of the form', '<option value="">Arial (standard)</option>')}${row('date', 'Date blocks', 'Dates beside a signature', '<option value="">Same as default text</option>')}${row('sig', 'Signature blocks', 'Signatures and typed names', '<option value="">Same as default text</option>')}
      <div class="st-r"><div class="st-t"><b>Case number and judge</b><small class="fd-hint">Starts as the document's own font. Handwriting or cursive is fine here; the size always matches the document.</small></div>${fontSel('case', '<option value="">Same as document text</option>')}<div class="st-p" id="st-case-p"></div></div>
      <div class="st-r"><div class="st-t"><b>Case number on forms</b><small class="fd-hint">How the case number is filled in when you link a document to a case. The court's official number is always the full year.</small></div><select id="st-cy" aria-label="Case number year format"><option value="2"${settings?.caseYear !== '4' ? ' selected' : ''}>2-digit year: 26-0108-CR</option><option value="4"${settings?.caseYear === '4' ? ' selected' : ''}>4-digit year: 2026-0108-CR</option></select></div>
      <div class="fd-warn" id="st-warn" role="note" hidden>${esc(FONT_WARNING)}</div>
      <div class="fd-top" style="margin-top:14px"><button class="btn" type="button" id="st-save">Save settings</button><button class="btn outline" type="button" id="st-reset">Use standard fonts</button><span class="m" id="st-msg" role="status"></span></div></section>
    <section class="card"><h3>Favorite fonts</h3><div id="st-fav"></div></section>`;
  const paintPrev = () => ['body', 'date', 'sig', 'case'].forEach(k => { const f = $(`st-${k}-f`).value, p = $(`st-${k}-p`); p.innerHTML = f ? `<span style="${fontCss(f)}">${esc(k === 'date' ? '10/05/2026' : k === 'case' ? '2026-000123-FH' : 'Jane Q. Public')}</span>` : ''; });
  const warn = () => { const f = $('st-body-f').value; $('st-warn').hidden = !f || FONT_TYPES.find(t => t.fonts.includes(f))?.id === 'default'; };
  const favs = () => { $('st-fav').innerHTML = favCache.length ? favCache.map(f => `<span class="st-chip" style="${fontCss(f)}">${esc(f)}<button type="button" data-unfav="${esc(f)}" aria-label="Remove ${esc(f)} from favorites">\u00d7</button></span>`).join('') : '<p class="m">No favorites yet. Use the star in the font list inside a document.</p>'; };
  paintPrev(); warn(); favs();
  root.onchange = e => { if (/^st-(body|date|sig|case)-f$/.test(e.target.id)) { paintPrev(); if (e.target.id === 'st-body-f') { const was = !$('st-warn').hidden; warn(); if (!$('st-warn').hidden && !was) ask({ title: 'Keep your text readable', message: FONT_WARNING, ok: 'I understand', info: true }); } } };

    catch (er) { console.error(er); settings = v; try { localStorage.setItem(SET_KEY, JSON.stringify(v)); } catch { } $('st-msg').textContent = 'Saved on this device only. We could not reach your account.'; }
  };
}

/* ---------- routing ---------- */
async function route() {
  const h = location.hash.replace(/^#/, ''), my = ++gen;
  if (!(await closeCurrent())) { history.replaceState(null, '', BASE + lastHash); return; }
  lastHash = location.hash;
  unList?.(); unList = null; dlg.open && dlg.close(); sharing = false;
  if (my !== gen) return;
  if (h === 'settings') return settingsView();
  const d = /^d\/(.+)$/.exec(h);
  if (d) return editor({ docId: decodeURIComponent(d[1]) });
  const im = /^import\/(.+)$/.exec(h);
  if (im) {   // a filed court form opened for the court to complete (the order section, for example)
    try { const st = await import('https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js'); const t = new TextDecoder().decode(await st.getBytes(st.ref(st.getStorage(app), decodeURIComponent(im[1])), 4 * 1024 * 1024)), n = formOf(t), f = n && byNumber(n); if (my !== gen) return; if (f) { pendingMd = t; location.hash = f.id; return; } } catch (e) { console.error(e); }
    return library('We could not open that filed document.');
  }
  const form = h && byId(h);
  if (form) { const md0 = pendingMd; pendingMd = null; return editor({ form, md0 }); }
  library(h ? 'That form was not found.' : '');
}
window.addEventListener('hashchange', route); route();

/* ---------- editor ---------- */

    if (favCache === null) { favCache = await be.getFavs(uid); if (favCache === null) { try { favCache = JSON.parse(localStorage.getItem('fd-font-favs') || '[]'); } catch { favCache = []; } } if (my !== gen) return; }
    const engine = await mountForm(def, $('fd-host'), { account, role, favs: favCache, onFavs: l => { favCache = l; try { localStorage.setItem('fd-font-favs', JSON.stringify(l)); } catch { } be.setFavs(uid, l).catch(e => console.warn('Favorites not saved', e)); }, md: text ?? md0, readOnly: !canEdit, actions: canEdit ? ['save', 'share'] : ['share'], onEdit: () => session?.touch(), onAction: a => a === 'save' ? session.save(true) : openShare() });

/* ---------- sharing ---------- */
const dlg = $('dlg'); let sharing = false, found = [], shareMsg = null;

/* ---------- type-ahead for adding people ---------- */

dlg.addEventListener('input', e => { if (e.target.id === 'sh-q') suggest(false); });

dlg.addEventListener('click', async e => {

/* ---------- routing ---------- */
async function route() {

<!DOCTYPE html>
<html lang="en">
<head>

<style>
.m{color:var(--muted);font-weight:400}.mt{margin-top:14px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools .in{flex:1;min-width:200px;width:auto}.tools select.in{flex:0 0 auto;min-width:0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button{font:inherit;font-weight:600;font-size:14px;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chips i{font-style:normal;opacity:.75;margin-left:6px}
.tabs i{font-style:normal;font-weight:500;color:var(--muted);margin-left:6px}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:#f6f9fd}
td small,th small{display:block;color:var(--muted);font-weight:400}.num{text-align:right;white-space:nowrap}th.num{text-align:right}.pills{display:flex;gap:6px;flex-wrap:wrap}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin-bottom:14px}.amts div{display:grid;gap:2px}.amts dt{font-size:13px;color:var(--muted)}.amts dd{font-weight:700;font-size:17px;color:var(--navy)}.amts dd.owe{font-size:22px}

dialog{border:0;padding:0;border-radius:6px;width:min(660px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:0 24px 60px rgba(9,22,40,.35);color:var(--text);font:inherit;overflow:hidden;margin:auto}

.stats .stat.alert-stat b{color:#b3261e}

.card h3{margin-bottom:10px}.tbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}.tbar .in{max-width:280px}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:#f6f9fd}
.sh-head dd,.sh-head dt,.kv dd,.kv dt{margin:0}
</style>

<body>
<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="topbar-eyebrow">Online Portal</span><span class="topbar-page-title" id="topbar-title">Enforcement administration</span></div>
    </div>
    <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><div class="notif-wrap" id="notif-root"></div></div>
  </header>
  <main class="page-body">
    <div class="page-head"><div><h2 id="page-title">Enforcement administration</h2><p id="page-subtitle"></p></div><div id="page-action"></div></div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading enforcement administration…</div></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlg-t">
  <header><div><h3 id="dlg-t"></h3><p id="dlg-w"></p></div><button class="x" type="button" aria-label="Close" data-close>×</button></header>
  <div id="dlg-b"></div><div id="dlg-e"></div><footer id="dlg-f"></footer>
</dialog>
<div class="auth-loading-overlay" id="auth-overlay" role="status"><div class="alo-title">Online Portal</div><div class="spin"></div><div>Verifying your session…</div></div>

<script type="module">
import { boot, db, $, esc, has, STAFF, DISTRICT, scopeOf, colFor, DISTRICT_COURT } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js?v=7';
import { collection, getDocs, doc, runTransaction, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { partiesOf, caption, isDefendantSide, addEvent, iso, fmtD, fmtDT, uid, isJudicial, isChief, governs, presidingOf, reviewerUidOf, is } from '/courts/online-services/portal/dashboard/assets/js/court.js?v=1';

const { account, role } = await boot({ id: 'menforce', title: 'Enforcement administration', subtitle: 'Warrants, supervision orders, and reports from probation, pretrial services and community service sites.' });
const root = $('page-body');
if (!has(STAFF, role)) root.innerHTML = '<section class="card"><div class="empty"><strong>Court staff only</strong></div></section>';
else if (!has(DISTRICT, role)) root.innerHTML = '<section class="card"><div class="empty"><strong>District court only</strong><p>Warrants and supervision orders are handled in the district court.</p></div></section>';
else await main();

async function main() {
/* ── Shared dialog and form helpers ─────────────────────────────────── */
class UserError extends Error {} const bad = m => { throw new UserError(m); }, need = (c, m) => { if (!c) bad(m); };
const errText = e => e instanceof UserError ? e.message : e?.code === 'permission-denied' ? 'Your account is not allowed to save this. The Firestore rules must allow this change. (permission-denied)' : `We could not save this. Check your connection and try again.${e?.code ? ' (' + e.code + ')' : ''}`;
const dlg = $('dlg'); let dlgOk = null, dlgChange = null;
function modal({ title, sub = '', body, ok = 'Save', okCls = '', wide = false, onOk, onChange, extra = '' }) {
  dlgChange = onChange || null; $('dlg-t').textContent = title; $('dlg-w').textContent = sub; $('dlg-b').innerHTML = body; $('dlg-e').innerHTML = ''; dlg.classList.toggle('wide', wide); dlgOk = onOk;
  $('dlg-f').innerHTML = `${extra}<button class="btn outline" type="button" data-close>${onOk ? 'Cancel' : 'Close'}</button>${onOk ? `<button class="btn ${okCls}" type="button" id="dlg-ok">${ok}</button>` : ''}`;
  if (!dlg.open) dlg.showModal(); if (onOk) dlg.querySelector('#dlg-b input:not([type=hidden]):not([type=radio]):not([type=checkbox]):not([readonly]),#dlg-b select')?.focus();
}
const closeDlg = () => { dlg.close(); draw(); };
async function runOk() { const b = $('dlg-ok'), label = b.textContent; b.disabled = true; b.textContent = 'Saving…'; $('dlg-e').innerHTML = '';
  try { await dlgOk(); } catch (e) { if (!(e instanceof UserError)) console.error(e); $('dlg-e').innerHTML = `<div class="alert" role="alert">${esc(errText(e))}</div>`; b.disabled = false; b.textContent = label; } }
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) closeDlg(); else if (e.target.closest('#dlg-ok')) runOk(); else { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); } });
dlg.addEventListener('input', e => dlgChange?.(e)); dlg.addEventListener('change', e => dlgChange?.(e));
const val = id => ($(id)?.value || '').trim();
const fld = (label, id, v = '', o = {}) => `<label class="f"><span>${label}</span><input id="${id}" type="${o.type || 'text'}" value="${esc(v)}"${o.step ? ` step="${o.step}"` : ''}${o.min != null ? ` min="${o.min}"` : ''}${o.list ? ` list="${o.list}"` : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.ro ? ' readonly' : ''}>${o.hint ? `<small class="m">${o.hint}</small>` : ''}</label>`;
const area = (label, id, v = '', ph = '') => `<label class="f"><span>${label}</span><textarea id="${id}" rows="4" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
const selF = (label, id, opts, v) => `<label class="f"><span>${label}</span><select id="${id}">${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${ov === v ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
const g2 = (...c) => `<div class="cols">${c.join('')}</div>`, dlist = (id, l) => `<datalist id="${id}">${l.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
const chk = (id, label, on) => `<label class="chk"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
const ymd = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const mapParties = (p, fn) => Array.isArray(p) ? p.map(fn) : p && typeof p === 'object' ? Object.fromEntries(Object.entries(p).map(([k, v]) => [k, Array.isArray(v) ? v.map(fn) : v && typeof v === 'object' && v.name ? fn(v) : v])) : p;
const PILL = { Requested: 'mid', Issued: 'live', Denied: 'bad', Executed: 'done', Recalled: 'plain', Expired: 'plain', 'Pending review': 'mid', Accepted: 'done', Returned: 'warn', Active: 'live', Completed: 'done', Revoked: 'bad', Terminated: 'plain' };
const pillOf = s => `<span class="pill ${PILL[s] || 'plain'}">${esc(s)}</span>`;
const stat = (l, v, al) => `<div class="stat ${al ? 'alert-stat' : ''}"><span>${l}</span><b>${v}</b></div>`;
const notAllowed = (t, m) => `<section class="card"><div class="empty"><strong>${t}</strong><p>${m}</p></div></section>`;
// Updates one case in a transaction (adds docket events and summary fields) and returns the new case data.
async function editCase(c, fn) {
  const r = doc(db, colFor(c.court), c._id), at = new Date();
  const next = await runTransaction(db, async tx => { const s = await tx.get(r); if (!s.exists()) bad('This case no longer exists.'); const d = s.data(), out = fn(d, at) || {}, p = { ...(out.patch || {}), dates: { ...(d.dates || {}), lastUpdated: iso(at) } };
    if (out.event) p.events = addEvent(d.events, { judge: d.judge || null, enteredBy: account.name, enteredByRole: role, ...out.event }); tx.update(r, p); return { ...d, ...p }; });
  Object.assign(c, next); return next;
}

const judicial = isJudicial(role), chief = isChief(role), scope = scopeOf(role);
let cases = [], accts = [], warrants = [], orders = [], logs = [], returns = [], tab = 'requests', note = '', noteKind = 'ok', q = '', wf = 'Issued', of = 'Active', rv = judicial && !chief ? 'mine' : 'all';
const safe = p => p.catch(() => ({ docs: [] })), rows = s => s.docs.map(d => ({ ...d.data(), _id: d.id }));
async function load() {
  const [a, b, w, o, l, r] = await Promise.all(['cases', 'accounts', 'warrants', 'supervisionOrders', 'supervisionLogs', 'serviceReturns'].map(n => safe(getDocs(collection(db, n)))));
  cases = rows(a); accts = b.docs.map(d => ({ uid: d.id, ...d.data() })); warrants = rows(w).filter(x => !x.court || x.court === DISTRICT_COURT); orders = rows(o); logs = rows(l); returns = rows(r);
}
const ctx = () => ({ account, role, accts, scope });
const caseById = id => cases.find(c => c._id === id || c.caseId === id), openCases = () => cases.filter(c => !/closed|disposed/i.test(c.status || ''));
const caseLabel = c => `${c.caseId} — ${caption(c)}`, findCase = v => cases.find(c => caseLabel(c) === v || c.caseId === String(v).trim());
const myCases = () => openCases().filter(c => governs(ctx(), c));
const mineSet = () => { const s = new Set([account.uid]); accts.filter(a => a.supervisorUid === account.uid && is(['Magistrate'], a.role)).forEach(a => s.add(a.uid)); return s; };
const forMe = l => judicial && ((l.reviewerUid && mineSet().has(l.reviewerUid)) || (chief && !l.reviewerUid));
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const kvl = r => `<dl class="kv">${r.filter(x => x[1] !== undefined && x[1] !== null && x[1] !== '').map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
const caseCell = (id, cs) => { const c = cs || caseById(id); return `<b>${esc(c?.caseId || id || '—')}</b>${c ? `<small>${esc(caption(c))}</small>` : ''}`; };
const sumW = w => ({ id: w.id || w._id, type: w.type, subject: w.subject || null, status: w.status, issuedAt: w.decision?.at || null, bond: w.decision?.bond || null, issuedBy: w.decision?.by || null });
const sumO = o => ({ id: o._id || o.id, type: o.type, subject: o.subject, status: o.status, hours: o.hours || null, hoursCompleted: o.hoursCompleted || 0, startDate: o.startDate || null, endDate: o.endDate || null });
const upsert = (arr, item) => { const a = [...(arr || [])], k = a.findIndex(x => x.id === item.id); k < 0 ? a.push(item) : a[k] = { ...a[k], ...item }; return a; };

/* ── Views ──────────────────────────────────────────────────────────── */
const requestsList = () => warrants.filter(w => w.status === 'Requested').sort((x, y) => (y.urgency === 'Urgent') - (x.urgency === 'Urgent') || String(x.requestedAt).localeCompare(String(y.requestedAt)));
const reviewList = () => logs.filter(l => l.status === 'Pending review' && (rv === 'all' || forMe(l))).sort((x, y) => String(x.createdAt).localeCompare(String(y.createdAt)));
function draw() {
  const rq = requestsList().length, rvMine = logs.filter(l => l.status === 'Pending review' && forMe(l)).length;
  const tabs = [['requests', 'Warrant requests', rq], ['warrants', 'Warrants'], ['orders', 'Supervision orders'], ['reviews', 'Reports to review', rvMine], ['service', 'Service returns']];
  $('page-action').innerHTML = judicial ? '<button class="btn outline" type="button" data-a="issue">Issue a warrant</button> <button class="btn" type="button" data-a="order">Order supervision</button>' : '';
  root.innerHTML = `${note ? `<div class="${noteKind === 'ok' ? 'note' : 'alert-line red'}" role="status">${esc(note)}</div>` : ''}
    <div class="stats">${stat('Warrant requests waiting', rq, rq > 0 && judicial)}${stat('Active warrants', warrants.filter(w => w.status === 'Issued').length)}${stat('Active supervision orders', orders.filter(o => o.status === 'Active').length)}${stat('Reports for me to review', rvMine, rvMine > 0)}</div>
    <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-a="tab:${k}">${l}${n ? `<i>${n}</i>` : ''}</button>`).join('')}</div>
    ${tab === 'requests' ? requestsView() : tab === 'warrants' ? warrantsView() : tab === 'orders' ? ordersView() : tab === 'reviews' ? reviewsView() : serviceView()}`;
}
const filt = (...v) => !q || v.join(' ').toLowerCase().includes(q.toLowerCase());
const search = ph => `<input class="in" id="f-q" type="search" placeholder="${ph}" aria-label="Search" value="${esc(q)}">`;
function requestsView() {
  const l = requestsList().filter(w => filt(w.caseId, w.subject, w.type, w.requestedBy));
  return `<section class="card"><div class="tbar"><div><h3>Warrant requests</h3><p class="m">Any judge or magistrate may rule on a request. The first ruling decides it.${judicial ? '' : ' Only judicial officers can rule.'}</p></div>${search('Search requests')}</div>
    ${!l.length ? '<div class="empty"><strong>No requests waiting</strong></div>' : `<div class="table-scroll"><table><thead><tr><th>Warrant</th><th>Case</th><th>Requested by</th><th>Requested</th><th></th></tr></thead><tbody>${l.map(w => `<tr data-a="wopen:${esc(w._id)}"><td><b>${esc(w.type)}</b><small>${esc(w.subject || w.reference || '')}</small></td><td>${w.caseFirestoreId ? caseCell(w.caseFirestoreId) : '<span class="m">No case</span>'}</td><td>${esc(w.requestedBy)}<small>${esc(w.agency || w.requestedByRole || '')}</small></td><td>${esc(fmtD(w.requestedAt))}</td><td>${w.urgency === 'Urgent' ? '<span class="pill bad">Urgent</span>' : ''}</td></tr>`).join('')}</tbody></table></div>`}</section>`;
}
function warrantsView() {
  const l = warrants.filter(w => w.status !== 'Requested' && (wf === 'All' || w.status === wf) && filt(w.caseId, w.subject, w.type, w.decision?.by)).sort((x, y) => String(y.decision?.at || '').localeCompare(String(x.decision?.at || '')));
  return `<section class="card"><div class="tbar"><div class="chips" style="margin:0">${['Issued', 'Executed', 'Recalled', 'Denied', 'All'].map(k => `<button type="button" class="${wf === k ? 'on' : ''}" data-a="wf:${k}">${k}</button>`).join('')}</div>${search('Search by case, name or judge')}</div>
    ${!l.length ? '<div class="empty"><strong>No warrants here</strong></div>' : `<div class="table-scroll"><table><thead><tr><th>Subject</th><th>Warrant</th><th>Case</th><th>Status</th><th>Decided</th><th class="num">Bond</th></tr></thead><tbody>${l.map(w => `<tr data-a="wopen:${esc(w._id)}"><td><b>${esc(w.subject || (w.type === 'Search Warrant' ? 'Search warrant' : '—'))}</b></td><td>${esc(w.type)}</td><td>${w.caseFirestoreId ? caseCell(w.caseFirestoreId) : '<span class="m">No case</span>'}</td><td>${pillOf(w.status)}</td><td>${esc(w.decision?.by || '—')}<small>${esc(fmtD(w.decision?.at))}</small></td><td class="num">${w.decision?.bond ? money(w.decision.bond) : '—'}</td></tr>`).join('')}</tbody></table></div>`}</section>`;
}
const progress = o => o.type === 'Community Service' ? `${o.hoursCompleted || 0} of ${o.hours} hours` : o.endDate ? `${fmtD(o.startDate)} to ${fmtD(o.endDate)}` : fmtD(o.startDate);
function ordersView() {
  const l = orders.filter(o => (of === 'All' || o.status === of) && filt(o.caseId, o.subject, o.type)).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
  return `<section class="card"><div class="tbar"><div class="chips" style="margin:0">${['Active', 'Completed', 'Revoked', 'All'].map(k => `<button type="button" class="${of === k ? 'on' : ''}" data-a="of:${k}">${k}</button>`).join('')}</div>${search('Search by person or case')}</div>
    ${!l.length ? `<div class="empty"><strong>No supervision orders</strong>${judicial ? '<p>Choose Order supervision to order community service, probation or pretrial services in one of your cases.</p>' : ''}</div>` : `<div class="table-scroll"><table><thead><tr><th>Person</th><th>Order</th><th>Case</th><th>Progress</th><th>Reports go to</th><th>Status</th></tr></thead><tbody>${l.map(o => `<tr data-a="oopen:${esc(o._id)}"><td><b>${esc(o.subject)}</b></td><td>${esc(o.type)}</td><td>${caseCell(o.caseFirestoreId)}</td><td>${esc(progress(o))}</td><td>${esc(o.judgeName || '—')}</td><td>${pillOf(o.status)}</td></tr>`).join('')}</tbody></table></div>`}</section>`;
}
const summary = x => x.type === 'community-service' ? `${x.f?.hours || 0} hours at ${x.f?.site || '—'}` : `Compliance: ${x.f?.compliance || '—'}`;
const TYPE_LABEL = { 'community-service': 'Community service log', probation: 'Probation report', pretrial: 'Pretrial services report' };
function reviewsView() {

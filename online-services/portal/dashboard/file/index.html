<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My filings | Online Portal</title>
<link rel="icon" type="image/png" href="/courts/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/courts/online-services/portal/dashboard/assets/css/dashboard.css?v=5">
</head>
<body>
<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="topbar-eyebrow">Online Portal</span><span class="topbar-page-title" id="topbar-title">My filings</span></div>
    </div>
    <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><div class="notif-wrap" id="notif-root"></div></div>
  </header>
  <main class="page-body">
    <div class="page-head"><div><h2 id="page-title">My filings</h2><p id="page-subtitle"></p></div><div id="page-action"></div></div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading…</div></div>
  </main>
</div>
<div class="auth-loading-overlay" id="auth-overlay" role="status"><div class="alo-title">Online Portal</div><div class="spin"></div><div>Verifying your session…</div></div>

<script type="module">
import { boot, db, app, $, esc, has, ATTY, STAFF, CASE_CODES, DISTRICT_COURT, SUPREME_COURT, reserveCaseNumber, reserveFilingNumber, colFor } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js';
import { collection, getDocs, addDoc, query, where, doc, getDoc, updateDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const { account, role } = await boot({ id: 'filings', title: 'My filings', subtitle: 'File a new case, add to an existing one, enter an appearance, and track what you have submitted.' });
const isAtty = has(ATTY, role), isPros = has(['Prosecuting Attorney'], role);

/* ── SCAO forms: read live from the published Google Sheet (CSV) ─────── */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnHhVqcjdBGTNLl3_VmFuLQ77GQ-02-6UIW55zl5EV2sUrfxjaRrBDR-LAaFGEklpJ4d5XXJaFA75R/pub?gid=0&single=true&output=csv';
let FORMS = [];
function parseCSV(text) {
  const rows = []; let col = '', row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i + 1];
    if (inQ) { if (ch === '"' && nx === '"') { col += '"'; i++; } else if (ch === '"') inQ = false; else col += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(col.trim()); col = ''; }
    else if (ch === '\n' || (ch === '\r' && nx === '\n')) { row.push(col.trim()); col = ''; if (row.some(c => c !== '')) rows.push(row); row = []; if (ch === '\r') i++; }
    else col += ch;
  }
  if (col || row.length) { row.push(col.trim()); if (row.some(c => c !== '')) rows.push(row); }
  return rows;
}
fetch(CSV_URL).then(r => { if (!r.ok) throw new Error('csv'); return r.text(); }).then(t => {
  const rows = parseCSV(t), h = (rows[0] || []).map(x => x.toLowerCase().replace(/\s+/g, '_'));
  FORMS = rows.slice(1).map(r => Object.fromEntries(h.map((k, i) => [k, r[i] || '']))).filter(o => o.form_number)
    .map(o => ({ number: o.form_number, title: o.title, category: o.category || 'Other', description: o.description, court: o.court }));
  if (S.step === 2) render();
}).catch(() => {});

/* ── Court data ─────────────────────────────────────────────────────── */
const COURTS = {
  [DISTRICT_COURT]: ['Small Claims', 'Civil Infraction', 'General Civil', 'Administrative Appeal', 'General Appeal', 'Special Proceedings', ...(has(STAFF, role) || isPros ? ['General Criminal'] : [])],
  [SUPREME_COURT]: ['Appeal (by right)', 'Appeal (by application)', ...(has(['Magistrate', 'Judge', 'Chief Judge'], role) ? ['Certified Question'] : []), ...(has(['Legal Services User'], role) ? ['Disciplinary Proceeding'] : []), 'Original Jurisdiction']
};
const PR = ['Plaintiff', 'Defendant'], PT = ['Petitioner', 'Respondent'], AP = ['Appellant', 'Appellee'];
const ROLES = { 'Small Claims': PR, 'General Civil': PR, 'Civil Infraction': ['Defendant', 'Prosecuting Authority'], 'General Criminal': ['Prosecution', 'Defendant'], 'Special Proceedings': PT, 'General Appeal': AP, 'Administrative Appeal': PT,
  'Appeal (by right)': AP, 'Appeal (by application)': AP, 'Certified Question': PT, 'Disciplinary Proceeding': PT, 'Original Jurisdiction': PT };
// What can be filed to OPEN a case. 'MC ##' entries come from your published forms CSV. A criminal case can only be opened with the Criminal Complaint Packet (MC 200).
const INIT = { 'Small Claims': ['MC 84', 'MC 97A', 'MC 97B', 'MC 20'], 'General Civil': ['Complaint', 'MC 01A', 'MC 01B', 'MC 01C', 'MC 97A', 'MC 97B', 'MC 20'], 'Civil Infraction': ['Appeal of Civil Infraction', 'MC 20'], 'General Criminal': ['MC 200'],
  'Administrative Appeal': ['Petition for Review'], 'General Appeal': ['Application for Leave to Appeal', 'Notice of Appeal (as of right)'],
  'Special Proceedings': ['Application to Set Aside a Conviction or Arrest (MC 227)', 'Application for Writ of Habeas Corpus', 'Application for Writ of Garnishment', 'Petition for Order of Contempt', 'Petition', 'MC 452', 'MC 97A', 'MC 20'],
  'Appeal (by right)': ['Notice of Appeal (as of right)'], 'Appeal (by application)': ['Application for Leave to Appeal'], 'Certified Question': ['Certified Question'], 'Disciplinary Proceeding': ['Formal Complaint'],
  'Original Jurisdiction': ['Complaint', 'Petition for Writ of Mandamus', 'Petition for Writ of Prohibition', 'Petition for Superintending Control', 'Petition for Quo Warranto'] };
// What can be filed in an EXISTING case besides the SCAO forms from your CSV. Edit freely.
const DOCS = {
  'Motions': ['Motion (General)', 'Emergency Motion', 'Motion to Dismiss', 'Motion for Summary Disposition', 'Motion for Default Judgment', 'Motion to Set Aside Default', 'Motion for Reconsideration', 'Motion for Relief from Judgment', 'Motion to Amend', 'Motion to Adjourn or Continue',
    'Motion for Extension of Time', 'Motion to Compel', 'Motion in Limine', 'Motion to Suppress', 'Motion to Quash', 'Motion for New Trial', 'Motion for Protective Order', 'Motion for Stay', 'Motion to Intervene', 'Motion to Withdraw as Counsel',
    'Motion to Substitute Counsel', 'Motion for Substituted Service', 'Motion to Seal', 'Motion for Sanctions', 'Motion to Enforce', 'Motion for Costs and Attorney Fees', 'Motion for Bond Modification', 'Motion for Oral Argument'],
  'Responses & briefs': ['Response / Answer', 'Brief', 'Response Brief', 'Reply Brief', 'Supplemental Brief', 'Amicus Curiae Brief', 'Objection', 'Sentencing Memorandum'],
  'Pleadings': ['Answer to Complaint', 'Affirmative Defenses', 'Counterclaim', 'Cross-Claim', 'Third-Party Complaint', 'Amended Complaint', 'Amended Petition'],
  'Orders, stipulations & judgments': ['Proposed Order', 'Stipulated Order', 'Stipulation', 'Consent Judgment', 'Proposed Judgment', 'Stipulation to Dismiss', 'Notice of Dismissal'],
  'Notices': ['Notice (General)', 'Notice of Hearing', 'Notice of Withdrawal', 'Notice of Substitution of Counsel', 'Notice of Change of Address'],
  'Service & evidence': ['Proof of Service', 'Affidavit of Service', 'Affidavit / Declaration', 'Exhibit(s)', 'Witness List', 'Transcript'],
  'Fees & costs': ['Bill of Costs'],
  'Discovery': ['Discovery Request', 'Discovery Response'],
  'Appeals': ['Notice of Appeal (as of right)', 'Application for Leave to Appeal', 'Petition for Review'],
  'Criminal': ['Waiver of Rights', 'Bond Document'],
  'Other': ['Other']
};
const FL = f => `${f.title} (${f.number})`, byNum = n => FORMS.find(f => f.number === n);
const fOpt = (f, g) => ({ v: FL(f), g, d: f.description });
const fits = (f, court) => { const c = String(f.court || '').toLowerCase(); return !c || c === 'all' || (c.includes('district') && court === DISTRICT_COURT) || (c.includes('supreme') && court === SUPREME_COURT); };
const docOpts = () => {
  if (S.type === 'new') return (INIT[S.ctype] || []).map(x => /^MC \d/.test(x) && byNum(x) ? fOpt(byNum(x), 'Initiating documents') : { v: x, g: 'Initiating documents' });
  if (S.type === 'appearance') return [byNum('MC 02') ? fOpt(byNum('MC 02'), 'Appearance') : { v: 'Appearance (MC 02)', g: 'Appearance' }];
  const crim = /criminal/i.test(S.kase?.caseType || ''), skip = ['MC 02', 'MC 84', 'MC 200', 'MC 452'];   // these open a case or have their own flow
  const cats = [...new Set(FORMS.map(f => f.category))], pref = (crim ? ['Criminal', 'General', 'Civil'] : ['Civil', 'General', 'Criminal']).filter(c => cats.includes(c));
  const forms = [...pref, ...cats.filter(c => !pref.includes(c))].flatMap(c => FORMS.filter(f => f.category === c && !skip.includes(f.number) && fits(f, S.kase?.court)).map(f => fOpt(f, 'SCAO forms · ' + c)));
  const all = [...forms, ...Object.entries(DOCS).flatMap(([g, l]) => l.map(v => ({ v, g })))];
  // After a fee waiver is denied with prejudice, only a request for review of the denial may be filed.
  return S.kase?.feeWaiverBarred ? all.filter(x => !/\bMC 20\b/.test(x.v)) : all;
};
const fee = (t, court) => /fee waiver|Appearance|Litigant Identification|Summons|Extreme Risk/i.test(t) ? 0 : t === 'Complaint' ? (S.ctype === 'Original Jurisdiction' ? 150 : 75) : /Small Claims Complaint/.test(t) ? 30 : /Set Aside/.test(t) ? 40 : /Appeal of Civil/.test(t) ? 20 : /Criminal Complaint|Formal Complaint/.test(t) ? 0
  : /Notice of Appeal \(|Leave to Appeal|Petition for (Writ|Superintending|Quo)/.test(t) ? 100 : /Petition for Review/.test(t) ? 50 : court === SUPREME_COURT ? 50 : 25;
const money = n => '$' + Number(n || 0).toFixed(2);
const fmt = v => v ? new Date(v).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

/* ── Case helpers ───────────────────────────────────────────────────── */
const lc = s => String(s || '').trim().toLowerCase();
const partiesOf = c => (Array.isArray(c.parties) ? c.parties : Object.values(c.parties || {}).flat()).filter(p => p && typeof p === 'object' && p.name);
const counselOf = p => [p.attorney, ...(p.attorneys || [])].filter(a => a && a.name);
const attyOn = p => counselOf(p).some(a => lc(a.name) === lc(account.name));
const isMine = c => (c.relatedUserIds || []).includes(account.uid) || partiesOf(c).some(p => lc(p.name) === lc(account.name) || attyOn(p));
const caption = c => { const p = partiesOf(c); return p[0] && p[1] ? `${p[0].name} v. ${p[1].name}` : c.caseId; };
const byQ = (c, q) => (c.caseId + ' ' + partiesOf(c).map(p => p.name).join(' ')).toLowerCase().includes(q);
// How the signed-in user stands in an existing case: counsel of record for some parties, or a party themselves.
const standing = c => { const ps = partiesOf(c), rep = ps.filter(attyOn), own = ps.find(p => lc(p.name) === lc(account.name));
  return rep.length ? { counsel: true, text: 'Attorney for ' + rep.map(p => p.name).join(' and '), reps: rep.map(p => p.name).join(', ') } : { counsel: false, text: own ? own.role : 'Party of Record', reps: null }; };

// Which side of a case a role is on (null when it doesn't clearly belong to one). An attorney can represent only one side.
const sideOf = r => /defendant|respondent|appellee/i.test(r || '') ? 1 : /plaintiff|petitioner|prosecut|appellant|applicant|complainant|claimant/i.test(r || '') ? 0 : null;
const AUTH = ['City of Flint', 'County of Genesee', 'People of the State of Michigan'];
const opposing = p => p.role === ROLES[S.ctype][1] || p.role === 'Cross-Defendant';   // when opening a case you can't be counsel for the other side

/* ── State ──────────────────────────────────────────────────────────── */
const blank = () => ({ step: 0, view: 'new', counsel: false, type: '', court: '', ctype: '', kase: null, repIds: [], lower: null, lq: '', touched: false, prefilled: false, parties: [], files: [], links: [],
  email: account.email || '', notes: '', cert: false, q: '', err: '', busy: false, done: null });
let S = blank(), cases = [], mine = [];
const root = $('page-body');
const courtOf = () => S.type === 'new' ? S.court : S.kase?.court;
const lockCounsel = () => isPros && S.ctype === 'General Criminal';
const ymd = v => { const m = String(v || '').match(/^(\d{4}-\d{2}-\d{2})/); if (m) return m[1]; const d = v ? new Date(v) : null; return d && !isNaN(d) ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : ''; };
const acctDob = ymd(account.dob || account.dateOfBirth || account.birthDate || account.birthdate);   // comes from the account, so it cannot be changed here
const mkParty = (r, i) => { const own = i === 0 && !S.counsel; return { role: r, kind: 'Person', name: own ? account.name || '' : '', pin: own ? account.mipassPin || '' : '', dob: own ? acctDob : '', pinUnknown: false, dobUnknown: false, self: own, mine: false }; };

Promise.all([getDocs(collection(db, 'cases')), getDocs(collection(db, 'mscCases')).catch(() => ({ docs: [] }))]).then(r => { cases = r.flatMap(s => s.docs.map(d => ({ ...d.data(), _id: d.id }))); if (S.step === 1) render(); }).catch(() => {});
const loadMine = () => getDocs(query(collection(db, 'pendingFilings'), where('filedByUid', '==', account.uid)))
  .then(s => { mine = s.docs.map(d => ({ ...d.data(), _id: d.id })).sort((a, b) => new Date(b.dateFiled) - new Date(a.dateFiled)); renderAction(); if (S.view === 'history') render(); }).catch(() => {});
loadMine();

/* ── Form helpers ───────────────────────────────────────────────────── */
const F = (label, inner, hint) => `<label class="f"><span>${label}</span>${inner}${hint ? `<small>${hint}</small>` : ''}</label>`;
const inp = (k, v, ph = '', t = 'text', ro) => `<input type="${t}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}" ${ro ? 'readonly' : ''}>`;
const sel = (k, v, opts, ph, r, dis) => `<select data-k="${k}" ${r ? 'data-r' : ''} ${dis ? 'disabled' : ''}>${ph ? `<option value="">${ph}</option>` : ''}${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${ov === v ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
const opt = (on, a, title, sub) => `<div class="opt${on ? ' on' : ''}" role="radio" aria-checked="${on}" tabindex="0" data-a="${a}"><input type="radio" tabindex="-1" ${on ? 'checked' : ''}><div><b>${title}</b><small>${sub}</small></div></div>`;
const cb = (key, val) => `<div class="f"><span>Document type</span><div class="cb"><input class="cbi" data-cb="${key}" role="combobox" aria-label="Document type" aria-expanded="false" autocomplete="off" value="${esc(val)}" placeholder="Search by name or form number…"><div class="cbl" role="listbox" hidden></div></div></div>`;
const loading = '<div class="loading-inline"><span class="spin-sm"></span>Loading cases…</div>';
const none = '<div class="empty"><strong>No matching cases</strong><p>Check the case number or try a party’s last name.</p></div>';
const caseOpt = (c, a, on) => `<div class="opt${on ? ' on' : ''}" role="radio" aria-checked="${!!on}" tabindex="0" data-a="${a}:${esc(c._id)}"><input type="radio" tabindex="-1" ${on ? 'checked' : ''}><div><b>${esc(caption(c))}</b><small>${esc(c.caseId)} · ${esc(c.court)} · ${esc(c.civilSubtype || c.caseType || '')}</small></div><span class="pill live" style="margin-left:auto">${esc(c.status || '')}</span></div>`;

/* ── Case lists ─────────────────────────────────────────────────────── */
function caseList() {
  if (!cases.length) return loading; const q = lc(S.q);
  if (S.type === 'existing') { const l = cases.filter(c => isMine(c) && (!q || byQ(c, q))); return l.length ? l.map(c => caseOpt(c, 'case', S.kase?._id === c._id)).join('') : '<div class="empty"><strong>No cases found</strong><p>Only cases where you are a party or attorney are listed. Attorneys can enter an appearance from the first screen.</p></div>'; }
  if (q.length < 2) return '<p style="color:var(--muted)">Start typing a case number or party name.</p>';
  const l = cases.filter(c => !c.sealed && byQ(c, q)).slice(0, 8); return l.length ? l.map(c => caseOpt(c, 'case', S.kase?._id === c._id)).join('') : none;
}
function lowerList() {
  if (!cases.length) return loading; const q = lc(S.lq);
  if (isAtty && q.length < 2) return '<p style="color:var(--muted)">Start typing to search district court cases.</p>';
  const l = cases.filter(c => c.court === DISTRICT_COURT && !c.sealed && (isAtty || isMine(c)) && (!q || byQ(c, q))).slice(0, 8);
  return l.length ? l.map(c => `<div class="opt" role="radio" aria-checked="false" tabindex="0" data-a="lower:${esc(c._id)}"><input type="radio" tabindex="-1"><div><b>${esc(caption(c))}</b><small>${esc(c.caseId)} · ${esc(c.civilSubtype || c.caseType || '')}${c.judge ? ' · ' + esc(c.judge) : ''}</small></div></div>`).join('')
    : `<div class="empty"><strong>No matching cases</strong><p>${isAtty ? 'Check the case number or try a party’s last name.' : 'Only district court cases you are a party to are listed.'}</p></div>`;
}
const lowerFrom = c => c && ({ court: c.court, caseNumber: c.caseId, caseFirestoreId: c._id, caption: caption(c), caseType: c.civilSubtype || c.administrativeSubtype || c.appellateSubtype || c.caseType || null, judge: c.judge || null, dateFiled: c.dates?.filed || null, status: c.status || null });

/* ── Parties ────────────────────────────────────────────────────────── */
const kindOf = n => /^(state|city|county|township|village|people|department|board|commission|office)\b|\bof michigan\b/i.test(n) ? 'Government' : /\b(inc|llc|l\.l\.c|corp|corporation|company|co|ltd|lp|association|bank)\b/i.test(n) ? 'Business or organization' : 'Person';
function initParties() {
  const r = ROLES[S.ctype]; if (!r) return;
  if (lockCounsel()) S.counsel = true;
  S.touched = false; S.prefilled = false; S.parties = [mkParty(r[0], 0), mkParty(r[1], 1)];
  // A prosecutor opening a criminal case: party 1 is always the People, a government party they represent.
  if (lockCounsel()) S.parties[0] = { role: r[0], kind: 'Government', name: 'People of the State of Michigan', pin: '', self: false, locked: true, mine: true };
  if (S.ctype === 'Civil Infraction') S.parties[1] = { role: r[1], kind: 'Government', name: '', pin: '', self: false, mine: false };
  if (S.lower) prefillFromLower();
}
// Start the parties from the lower court case. The filer's own side becomes the first role; otherwise the first party's side does
// (criminal and traffic cases put the defendant side first, since they are usually the one appealing).
function prefillFromLower() {
  const c = cases.find(x => x._id === S.lower?.caseFirestoreId), roles = ROLES[S.ctype];
  if (!c || !roles || S.touched || lockCounsel()) return;
  const lp = partiesOf(c); if (!lp.length) return;
  const side = r => /plaintiff|petitioner|prosecut|appellant|applicant|complainant/i.test(r || '') ? 0 : 1, me = lc(account.name);
  const m = lp.find(p => lc(p.name) === me || lc(p.attorney?.name) === me);
  const first = m ? side(m.role) : /criminal|traffic/i.test(c.caseType || '') ? 1 : side(lp[0].role);
  const mk = (p, ri) => { const self = !S.counsel && lc(p.name) === me; return { role: roles[ri], kind: kindOf(p.name), name: p.name, pin: p.pin || (self ? account.mipassPin || '' : ''), dob: ymd(p.dob) || (self ? acctDob : ''), pinUnknown: false, dobUnknown: false, self, mine: S.counsel && counselOf(p).some(a => lc(a.name) === me) }; };
  const a = lp.filter(p => side(p.role) === first).map(p => mk(p, 0)), b = lp.filter(p => side(p.role) !== first).map(p => mk(p, 1));
  S.parties = [a[0] || mkParty(roles[0], 0), b[0] || mkParty(roles[1], 1), ...a.slice(1), ...b.slice(1)]; S.prefilled = true;
}
const unk = (k, on) => `<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600"><input type="checkbox" data-k="${k}" data-r ${on ? 'checked' : ''}> Unknown</label>`;
function idFields(p, i, L) {
  const canU = !p.self && !p.locked, pinU = canU && p.pinUnknown, dobU = canU && p.dobUnknown, pinLock = L && !!p.pin && !pinU, dobLock = p.self && !!acctDob;
  return `<div class="cols"><label class="f"><span>Michigan PIN</span><input type="text" data-k="parties.${i}.pin" value="${esc(pinU ? '' : p.pin)}" placeholder="${pinU ? 'Unknown' : 'Michigan PIN'}" ${pinLock || pinU ? 'readonly' : ''}>${canU ? unk(`parties.${i}.pinUnknown`, pinU) : ''}<small>${pinLock ? 'Filled in from your account and cannot be changed.' : 'Appears on the case record.'}</small></label>
    <label class="f"><span>Date of birth</span><input type="date" data-k="parties.${i}.dob" value="${esc(dobU ? '' : p.dob)}" ${dobLock || dobU ? 'readonly' : ''}>${canU ? unk(`parties.${i}.dobUnknown`, dobU) : ''}<small>${dobLock ? 'Filled in from your account and cannot be changed.' : 'Appears on the case record.'}</small></label></div>`;
}
function partyCard(p, i) {
  const pa = S.ctype === 'Civil Infraction' && p.role === 'Prosecuting Authority'; if (pa) p.kind = 'Government';
  const opp = opposing(p); if (opp) p.mine = false;
  const L = p.self || p.locked, kinds = ['Person', 'Business or organization', 'Government'];
  const rep = S.counsel ? `<label class="opt${p.mine ? ' on' : ''}"><input type="checkbox" data-k="parties.${i}.mine" data-r ${p.mine ? 'checked' : ''} ${p.locked || opp ? 'disabled' : ''}><div><b>I represent this party</b>${opp ? '<small>You cannot be counsel for the opposing party when opening a case.</small>' : ''}</div></label>` : '';
  const who = pa
    ? F('Prosecuting authority', sel(`parties.${i}.name`, p.name, AUTH, 'Select the prosecuting authority'), 'A traffic ticket issued under the Michigan Vehicle Code, or any other fine under a state statute, is brought by the <b>People of the State of Michigan</b>. If it was issued under a local county or municipal ordinance, choose the municipality (<b>City of Flint</b>) or the county (<b>County of Genesee</b>).')
    : `<div class="cols">${F('Party type', sel(`parties.${i}.kind`, p.kind, kinds, '', 1, L))}${F(p.kind === 'Person' ? 'Full name' : 'Name', inp(`parties.${i}.name`, p.name, '', 'text', L))}</div>
    ${p.kind === 'Person' ? idFields(p, i, L) : ''}`;
  return `<div class="sub"><header><span>Party ${i + 1}${i < 2 ? ' · ' + esc(p.role) : ''}</span>${i >= 2 ? `<button class="btn outline sm" type="button" data-a="rmparty:${i}">Remove</button>` : ''}</header>
    ${i >= 2 ? F('Role', sel(`parties.${i}.role`, p.role, [...ROLES[S.ctype], 'Third Party', 'Intervenor', 'Cross-Claimant', 'Cross-Defendant'], '', 1)) : ''}${who}
    ${p.self ? '<small style="margin-bottom:12px">Your name, party type, PIN and date of birth come from your account.</small>' : ''}${p.locked ? '<small style="margin-bottom:12px">Prosecutors open criminal cases for the People of the State of Michigan.</small>' : ''}${rep}</div>`;
}

/* ── Steps ──────────────────────────────────────────────────────────── */
function stepType() {
  const o = (t, a, b) => opt(S.type === t, 'type:' + t, a, b);
  return `<section class="card"><header><h3>What are you filing?</h3></header>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My filings | Online Portal</title>
<link rel="icon" type="image/png" href="/courts/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/courts/online-services/portal/dashboard/assets/css/dashboard.css?v=5">
</head>
<body>
<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="topbar-eyebrow">Online Portal</span><span class="topbar-page-title" id="topbar-title">My filings</span></div>
    </div>
    <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><div class="notif-wrap" id="notif-root"></div></div>
  </header>
  <main class="page-body">
    <div class="page-head"><div><h2 id="page-title">My filings</h2><p id="page-subtitle"></p></div><div id="page-action"></div></div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading…</div></div>
  </main>
</div>
<div class="auth-loading-overlay" id="auth-overlay" role="status"><div class="alo-title">Online Portal</div><div class="spin"></div><div>Verifying your session…</div></div>

<script type="module">
import { boot, db, app, $, esc, has, ATTY, STAFF } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js';
import { collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const { account, role } = await boot({ id: 'filings', title: 'My filings', subtitle: 'File a new case, add to an existing one, and track what you have submitted.' });

/* ── Court data ─────────────────────────────────────────────────────── */
const FW = 'Fee Waiver Request (MC 20)';
const COURTS = {
  'Genesee Co. District Court': ['Small Claims', 'General Civil', 'Civil Infraction', 'Expungement', 'Administrative', 'Special Proceeding', ...(has(STAFF, role) || role === 'Prosecuting Attorney' ? ['Criminal'] : [])],
  'Michigan Supreme Court': ['Appellate', 'Administrative Appeal', 'Original Action', 'Extraordinary Writ']
};
const ROLES = { 'Small Claims': ['Plaintiff', 'Defendant'], 'General Civil': ['Plaintiff', 'Defendant'], 'Civil Infraction': ['Defendant', 'Prosecuting Authority'], Expungement: ['Petitioner', 'Respondent'], Criminal: ['Prosecution', 'Defendant'],
  Administrative: ['Petitioner', 'Respondent'], 'Special Proceeding': ['Petitioner', 'Respondent'], Appellate: ['Appellant', 'Appellee'], 'Administrative Appeal': ['Petitioner', 'Respondent'], 'Original Action': ['Plaintiff', 'Defendant'], 'Extraordinary Writ': ['Petitioner', 'Respondent'] };
const INIT = { 'Small Claims': ['Complaint (DC 84)', FW], 'General Civil': ['Complaint', 'Summons (MC 01)', FW], 'Civil Infraction': ['Appeal of Civil Infraction (DC 102)', FW], Expungement: ['Application to Set Aside a Conviction or Arrest (MC 227)', FW],
  Criminal: ['Criminal Complaint / Information'], Administrative: ['Petition'], 'Special Proceeding': ['Petition', 'Application for Writ of Garnishment', 'Application for Writ of Habeas Corpus', 'Petition for Order of Contempt'],
  Appellate: ['Application for Leave to Appeal', 'Notice of Appeal (as of right)'], 'Administrative Appeal': ['Petition for Review'], 'Original Action': ['Complaint'],
  'Extraordinary Writ': ['Petition for Writ of Mandamus', 'Petition for Writ of Prohibition', 'Petition for Superintending Control', 'Petition for Quo Warranto'] };
const COMMON = ['Motion', 'Emergency Motion', 'Response / Answer', 'Brief', 'Reply Brief', 'Affidavit / Declaration', 'Proposed Order', 'Stipulation', FW, 'Notice of Appeal', 'Proof of Service', 'Notice', 'Other'];
const EXTRA = ['Third Party', 'Intervenor', 'Cross-Claimant', 'Cross-Defendant'];
const fee = (t, court) => /fee waiver/i.test(t) ? 0 : /^Complaint/.test(t) ? (/Original/.test(S.ctype) ? 150 : /DC 84/.test(t) ? 30 : 75) : /Set Aside/.test(t) ? 40 : /Appeal of Civil/.test(t) ? 20 : /Criminal Complaint/.test(t) ? 0
  : /Notice of Appeal \(|Leave to Appeal|Petition for (Writ|Superintending|Quo)/.test(t) ? 100 : /Petition for Review/.test(t) ? 50 : court === 'Michigan Supreme Court' ? 50 : 25;
const money = n => '$' + Number(n || 0).toFixed(2);
const fmt = v => v ? new Date(v).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

/* ── State ──────────────────────────────────────────────────────────── */
const blank = () => ({ step: 0, view: 'new', counsel: false, type: '', court: '', ctype: '', kase: null, parties: [], files: [], links: [], email: account.email || '', notes: '', cert: false, rep: '', q: '', err: '', busy: false, done: null });
let S = blank(), cases = [], mine = [];
const root = $('page-body');
const isCounsel = has(ATTY, role);
const courtOf = () => S.type === 'new' ? S.court : S.kase?.court;
const mkParty = (r, i) => ({ role: r, kind: 'Person', name: i === 0 && !S.counsel ? (account.name || '') : '', pin: i === 0 && !S.counsel ? (account.mipassPin || '') : '', self: i === 0 && !S.counsel, mine: false });

getDocs(collection(db, 'cases')).then(s => { cases = s.docs.map(d => ({ ...d.data(), _id: d.id })); if (S.step === 1) render(); }).catch(() => {});
const loadMine = () => getDocs(query(collection(db, 'pendingFilings'), where('filedByUid', '==', account.uid)))
  .then(s => { mine = s.docs.map(d => ({ ...d.data(), _id: d.id })).sort((a, b) => new Date(b.dateFiled) - new Date(a.dateFiled)); renderAction(); if (S.view === 'history') render(); }).catch(() => {});
loadMine();

const linked = () => {
  const n = String(account.name || '').toLowerCase(), q = S.q.toLowerCase().trim();
  return cases.filter(c => (n && JSON.stringify(c.parties || {}).toLowerCase().includes(n)) || (c.relatedUserIds || []).includes(account.uid))
    .filter(c => !q || (c.caseId + ' ' + JSON.stringify(c.parties || {})).toLowerCase().includes(q));
};
const caption = c => { const p = Array.isArray(c.parties) ? c.parties : []; const a = p[0]?.name, b = p[1]?.name; return a && b ? `${a} v. ${b}` : c.caseId; };

/* ── Views ──────────────────────────────────────────────────────────── */
const F = (label, inner, hint) => `<label class="f"><span>${label}</span>${inner}${hint ? `<small>${hint}</small>` : ''}</label>`;
const inp = (k, v, ph = '', t = 'text') => `<input type="${t}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const sel = (k, v, opts, ph, r) => `<select data-k="${k}" ${r ? 'data-r' : ''}>${ph ? `<option value="">${ph}</option>` : ''}${opts.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
const opt = (on, a, title, sub) => `<div class="opt${on ? ' on' : ''}" role="radio" aria-checked="${on}" tabindex="0" data-a="${a}"><input type="radio" tabindex="-1" ${on ? 'checked' : ''}><div><b>${title}</b><small>${sub}</small></div></div>`;

function stepType() {
  return (isCounsel ? `<section class="card"><header><h3>Attorney filing</h3></header><label class="opt${S.counsel ? ' on' : ''}"><input type="checkbox" data-k="counsel" data-r ${S.counsel ? 'checked' : ''}><div><b>I am filing as counsel of record</b><small>${account.barNumber ? `Bar No. ${esc(account.barNumber)} will be attached to this filing.` : 'Your bar number will be attached to this filing.'}</small></div></label></section>` : '') +
    `<section class="card"><header><h3>What are you filing?</h3></header>
      ${opt(S.type === 'new', 'type:new', 'Start a new case', 'File a complaint, petition, or other document that opens a new matter.')}
      ${opt(S.type === 'existing', 'type:existing', 'File in an existing case', 'Submit a motion, response, brief, or other document in a case already on the docket.')}
      ${S.type === 'new' ? `<div class="cols mt">${F('Court', sel('court', S.court, Object.keys(COURTS), 'Select a court', 1))}${S.court ? F('Case type', sel('ctype', S.ctype, COURTS[S.court], 'Select a case type', 1)) : ''}</div>` : ''}
    </section>`;
}

function partyCard(p, i) {
  const rep = S.counsel ? `<label class="opt${p.mine ? ' on' : ''}"><input type="checkbox" data-k="parties.${i}.mine" data-r ${p.mine ? 'checked' : ''}><div><b>I represent this party</b></div></label>` : '';
  return `<div class="sub"><header><span>Party ${i + 1}${i < 2 ? ' · ' + esc(p.role) : ''}</span>${i >= 2 ? `<button class="btn outline sm" type="button" data-a="rmparty:${i}">Remove</button>` : ''}</header>
    ${i >= 2 ? F('Role', sel(`parties.${i}.role`, p.role, [...ROLES[S.ctype], ...EXTRA])) : ''}
    <div class="cols">${F('Party type', sel(`parties.${i}.kind`, p.kind, ['Person', 'Business or organization', 'Government'], '', 1))}
      ${F(p.kind === 'Person' ? 'Full name' : 'Name', inp(`parties.${i}.name`, p.name))}</div>
    ${p.kind === 'Person' ? F('Michigan PIN', inp(`parties.${i}.pin`, p.pin, 'Michigan PIN'), p.self && p.pin ? 'Filled in from your account.' : 'Appears on the case record.') : ''}${rep}</div>`;
}

function stepCase() {
  if (S.type === 'new') return `<section class="card"><header><h3>Parties</h3></header>${S.parties.map(partyCard).join('')}<button class="btn outline" type="button" data-a="addparty">Add another party</button></section>`;
  const list = linked();
  return `<section class="card"><header><h3>Choose the case</h3></header>${F('Search your cases', inp('q', S.q, 'Case number or party name', 'search'))}
    <div id="cl">${caseList(list)}</div></section>
    ${S.counsel ? `<section class="card"><header><h3>Your representation</h3></header>${F('Party you represent', inp('rep', S.rep, 'Name of your client'), 'Recorded with your bar number.')}</section>` : ''}`;
}
const caseList = list => !cases.length ? '<div class="loading-inline"><span class="spin-sm"></span>Loading your cases…</div>' : list.length ? list.map(c =>
  `<div class="opt${S.kase?._id === c._id ? ' on' : ''}" role="radio" aria-checked="${S.kase?._id === c._id}" tabindex="0" data-a="case:${esc(c._id)}"><input type="radio" tabindex="-1" ${S.kase?._id === c._id ? 'checked' : ''}><div><b>${esc(caption(c))}</b><small>${esc(c.caseId)} · ${esc(c.court)} · ${esc(c.caseType || '')}</small></div><span class="pill live" style="margin-left:auto">${esc(c.status || '')}</span></div>`).join('')
  : '<div class="empty"><strong>No matching cases</strong><p>Only cases linked to your account are listed. To open a new matter, go back and choose “Start a new case”.</p></div>';

const docOpts = () => S.type === 'new' ? INIT[S.ctype] || [] : COMMON;
function stepDocs() {
  const o = docOpts();
  return `<section class="card"><header><h3>Documents</h3></header>
    <p class="mt" style="margin:0 0 14px;color:var(--muted)">Upload PDFs of 5 MB or less (MCR 2.119). Documents with photographs or scanned images go in through Google Drive instead.</p>
    <div class="drop" id="dz"><input class="vh" type="file" id="fi" accept="application/pdf,.pdf" multiple><label for="fi" class="btn">Choose PDF files</label><p class="big">or drag and drop them here</p><p>PDF only · up to 5 MB each</p></div>
    ${S.files.map((f, i) => `<div class="sub"><header><span>${esc(f.file.name)} <small style="display:inline">· ${(f.file.size / 1048576).toFixed(2)} MB</small></span><button class="btn outline sm" type="button" data-a="rmfile:${i}">Remove</button></header>${F('Document type', sel(`files.${i}.type`, f.type, o, 'Select a type', 1))}</div>`).join('')}
    ${S.links.map((l, i) => `<div class="sub"><header><span>Google Drive document ${i + 1}</span><button class="btn outline sm" type="button" data-a="rmlink:${i}">Remove</button></header><div class="cols">${F('Document type', sel(`links.${i}.type`, l.type, o, 'Select a type', 1))}${F('Share link', inp(`links.${i}.url`, l.url, 'https://drive.google.com/…', 'url'), 'Set sharing to “Anyone with the link can view”.')}</div></div>`).join('')}
    <button class="btn outline" type="button" data-a="addlink">Add a Google Drive link</button></section>`;
}

const docs = () => [...S.files.map(f => ({ name: f.file.name, type: f.type })), ...S.links.map(l => ({ name: 'Google Drive document', type: l.type }))];
function stepReview() {
  const d = docs(), total = d.reduce((t, x) => t + fee(x.type, courtOf()), 0);
  const rows = S.type === 'new'
    ? [['Court', S.court], ['Case type', S.ctype], ...S.parties.map((p, i) => [`Party ${i + 1} (${p.role})`, p.name + (p.kind === 'Person' && p.pin ? ' · PIN ' + p.pin : '') + (p.mine ? ' — your client' : '')])]
    : [['Case', caption(S.kase) + ' · ' + S.kase.caseId], ['Court', S.kase.court], ...(S.counsel ? [['You represent', S.rep]] : [])];
  return `<section class="card"><header><h3>Review your filing</h3></header>
    <dl class="details">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}
      ${d.map(x => `<div><dt>${esc(x.type)}</dt><dd>${esc(x.name)} · ${fee(x.type, courtOf()) ? money(fee(x.type, courtOf())) : 'No fee'}</dd></div>`).join('')}
      <div><dt>Estimated fees</dt><dd>${money(total)} — due in person within 14 days, not at filing</dd></div></dl>
    ${F('Confirmation email', inp('email', S.email, 'you@example.com', 'email'), 'We send updates here when the clerk accepts, returns, or rejects your filing.')}
    ${F('Notes to the clerk (optional)', `<textarea data-k="notes">${esc(S.notes)}</textarea>`)}
    <label class="opt${S.cert ? ' on' : ''}"><input type="checkbox" data-k="cert" data-r ${S.cert ? 'checked' : ''}><div><b>This filing is accurate and complete</b><small>I certify the information and documents are true to the best of my knowledge. Once submitted, a filing cannot be edited.</small></div></label></section>`;
}

const pillFor = s => `<span class="pill ${s === 'Accepted' ? 'done' : s === 'Rejected' ? 'bad' : s === 'Returned' ? 'mid' : 'warn'}">${esc(s || 'Pending')}</span>`;
function history() {
  if (!mine.length) return `<section class="card">${'<div class="empty"><strong>No filings yet</strong><p>Filings you submit appear here with their review status.</p></div>'}</section>`;
  return `<section class="card flush"><div class="table-scroll"><table><thead><tr><th>Confirmation</th><th>Filing</th><th>Filed</th><th>Status</th></tr></thead><tbody>${mine.map(f =>
    `<tr><td class="nw"><b>${esc(f.confirmationNumber)}</b></td><td>${esc(f.filingType === 'new' ? `New ${f.caseType}` : f.caseId)}<small>${esc((f.documents || []).map(d => d.documentType).join(', '))}</small>${f.returnReason || f.rejectionReason ? `<small><b>Clerk:</b> ${esc(f.returnReason || f.rejectionReason)}</small>` : ''}${f.linkedCaseId && f.filingType === 'new' ? `<small>Case number ${esc(f.linkedCaseId)}</small>` : ''}</td><td class="nw">${fmt(f.dateFiled)}</td><td>${pillFor(f.status)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function renderAction() {
  $('page-action').innerHTML = `<div class="acts"><button class="btn${S.view === 'new' ? '' : ' outline'}" data-a="view:new">New filing</button><button class="btn${S.view === 'history' ? '' : ' outline'}" data-a="view:history">My submissions (${mine.length})</button></div>`;
}
function render() {
  renderAction();
  if (S.view === 'history') { root.innerHTML = history(); return; }
  if (S.done) {
    root.innerHTML = `<section class="card" style="text-align:center;padding:40px 24px"><h3 style="font-size:24px">Filing submitted</h3><p style="color:var(--muted);margin:8px 0 18px">The clerk’s office will review it. You will be emailed at ${esc(S.done.email)}.</p>
      <p style="margin-bottom:6px;color:var(--muted)">Confirmation number</p><p style="font-family:var(--font-head);font-size:28px;color:var(--navy);margin-bottom:22px">${esc(S.done.conf)}</p>
      <div class="acts" style="justify-content:center"><button class="btn" data-a="again">File another document</button><button class="btn outline" data-a="view:history">View my submissions</button></div></section>`;
    return;
  }
  const names = ['Filing type', 'Case', 'Documents', 'Review'];
  const body = [stepType, stepCase, stepDocs, stepReview][S.step]();
  root.innerHTML = `<div class="steps">${names.map((n, i) => `<div class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}">${i < S.step ? '✓ ' : ''}${n}</div>`).join('')}</div>
    ${S.err ? `<div class="alert" role="alert" style="margin-bottom:16px"><strong>${esc(S.err)}</strong></div>` : ''}${body}
    <div class="nav">${S.step ? '<button class="btn outline" data-a="back">Back</button>' : '<span></span>'}
      <button class="btn" data-a="${S.step === 3 ? 'submit' : 'next'}" ${S.busy ? 'disabled' : ''}>${S.step === 3 ? (S.busy ? 'Submitting…' : 'Submit filing') : 'Continue'}</button></div>`;
}

/* ── Validation + submit ────────────────────────────────────────────── */
function check() {
  if (S.step === 0) { if (!S.type) return 'Choose whether this is a new case or an existing one.'; if (S.type === 'new' && (!S.court || !S.ctype)) return 'Select a court and case type.'; }
  if (S.step === 1) {
    if (S.type === 'existing') { if (!S.kase) return 'Select a case.'; if (S.counsel && !S.rep.trim()) return 'Enter the party you represent.'; }
    else {
      if (S.parties.some(p => !p.name.trim() || (p.kind === 'Person' && !p.pin.trim()))) return 'Complete the name (and PIN for individuals) for every party.';
      if (S.counsel && !S.parties.some(p => p.mine)) return 'Mark the party you represent.';
    }
  }
  if (S.step === 2) {
    if (!S.files.length && !S.links.length) return 'Add at least one PDF or Google Drive link.';
    if (S.files.some(f => !f.type) || S.links.some(l => !l.type)) return 'Choose a document type for every document.';
    if (S.links.some(l => !/^https?:\/\//.test(l.url.trim()))) return 'Every Google Drive entry needs a valid link.';
  }
  if (S.step === 3) { if (!/^\S+@\S+\.\S+$/.test(S.email.trim())) return 'Enter a valid email address.'; if (!S.cert) return 'Certify that the filing is accurate and complete.'; }
  return '';
}

async function submit() {
  S.busy = true; render();
  try {
    const conf = `MCR-${new Date().getFullYear()}-${Math.floor(100000 + Math.random() * 900000)}`, now = new Date().toISOString(), court = courtOf();
    const documents = [];
    let st = null;
    if (S.files.length) st = await import('https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js');
    for (const f of S.files) {
      const d = { type: 'pdf', name: f.file.name, size: f.file.size, documentType: f.type, fee: fee(f.type, court), fileUrl: null };
      const path = `filingUploads/${conf}/${Date.now()}-${f.file.name}`, r = st.ref(st.getStorage(app), path);
      await st.uploadBytes(r, f.file, { contentType: 'application/pdf' }); d.fileUrl = await st.getDownloadURL(r); d.storagePath = path; documents.push(d);
    }
    S.links.forEach(l => documents.push({ type: 'gdrive', name: 'Google Drive Document', link: l.url.trim(), documentType: l.type, fee: fee(l.type, court) }));
    const mineP = S.parties.find(p => p.mine);
    const filerRole = S.counsel ? 'Attorney for ' + (S.type === 'new' ? mineP?.name : S.rep.trim()) : S.type === 'new' ? S.parties[0].role : 'Party of Record';
    const obj = { confirmationNumber: conf, filingType: S.type, court, caseType: S.type === 'new' ? S.ctype : S.kase.caseType || '', documentType: documents[0].documentType,
      parties: S.type === 'new' ? S.parties.map(p => ({ role: p.role, name: p.name.trim(), ...(p.kind === 'Person' && p.pin.trim() ? { pin: p.pin.trim() } : {}), selfRepresented: !p.mine, ...(p.mine ? { attorney: { name: account.name, barNumber: account.barNumber || null } } : {}) })) : [],
      partyIntake: S.type === 'new' ? S.parties.map(p => ({ role: p.role, kind: p.kind, name: p.name.trim(), pin: p.pin || null })) : [],
      documents, totalFee: documents.reduce((t, d) => t + d.fee, 0), notesToClerk: S.notes.trim() || null, confirmationEmail: S.email.trim(), filerRole,
      filedBy: account.name, filedByUid: account.uid, isFilingAsCounsel: S.counsel, counselRepresents: S.counsel ? (S.type === 'new' ? mineP?.name : S.rep.trim()) : null,
      barNumber: S.counsel ? account.barNumber || null : null, dateFiled: now, status: 'Pending', accepted: false, urgent: false };
    if (S.type === 'existing') { obj.caseId = S.kase.caseId; obj.caseFirestoreId = S.kase._id; }
    await addDoc(collection(db, 'pendingFilings'), obj);
    S.done = { conf, email: S.email.trim() }; S.busy = false; S.err = ''; loadMine(); render();
  } catch (e) { console.error(e); S.busy = false; S.err = 'We could not submit your filing. Check your connection and try again.'; render(); }
}

/* ── Events ─────────────────────────────────────────────────────────── */
const set = (p, v) => { const a = p.split('.'); let o = S; a.slice(0, -1).forEach(k => o = o[k]); o[a.at(-1)] = v; };
const initParties = () => { const r = ROLES[S.ctype]; S.parties = [mkParty(r[0], 0), mkParty(r[1], 1)]; };
root.addEventListener('input', e => { const k = e.target.dataset.k; if (!k || e.target.type === 'checkbox') return; set(k, e.target.value); if (k === 'q') $('cl').innerHTML = caseList(linked()); });
root.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fi') { addFiles(t.files); return; }
  const k = t.dataset.k; if (!k) return;
  set(k, t.type === 'checkbox' ? t.checked : t.value);
  if (k === 'court') { S.ctype = ''; S.parties = []; }
  if (k === 'ctype') initParties();
  if (k === 'counsel') S.parties.forEach(p => p.mine = false);
  if (t.dataset.r !== undefined) render();
});
function addFiles(fl) {
  S.err = '';
  [...fl].forEach(f => { if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') S.err = f.name + ' is not a PDF.'; else if (f.size > 5242880) S.err = f.name + ' is over 5 MB.'; else if (!S.files.some(x => x.file.name === f.name)) S.files.push({ file: f, type: '' }); });
  render();
}
root.addEventListener('dragover', e => { const z = e.target.closest('#dz'); if (z) { e.preventDefault(); z.classList.add('over'); } });
root.addEventListener('dragleave', e => e.target.closest('#dz')?.classList.remove('over'));
root.addEventListener('drop', e => { if (e.target.closest('#dz')) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
const act = a => {
  const [n, v] = a.split(':');
  if (n === 'type') { S.type = v; S.kase = null; S.files = []; S.links = []; }
  else if (n === 'case') S.kase = cases.find(c => c._id === v);
  else if (n === 'addparty') S.parties.push(mkParty('Third Party', 2));
  else if (n === 'rmparty') S.parties.splice(+v, 1);
  else if (n === 'rmfile') S.files.splice(+v, 1);
  else if (n === 'rmlink') S.links.splice(+v, 1);
  else if (n === 'addlink') S.links.push({ url: '', type: '' });
  else if (n === 'view') { S.view = v; if (v === 'new' && S.done) S = blank(); }
  else if (n === 'again') { S = blank(); }
  else if (n === 'back') { S.step--; S.err = ''; }
  else if (n === 'next') { S.err = check(); if (!S.err) { S.step++; if (S.step === 1 && S.type === 'new' && !S.parties.length) initParties(); } }
  else if (n === 'submit') { S.err = check(); if (S.err) { render(); return; } submit(); return; }
  render(); if (n === 'next' || n === 'back') window.scrollTo({ top: 0 });
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.opt[data-a]')) { e.preventDefault(); act(e.target.dataset.a); } });
render();
</script>

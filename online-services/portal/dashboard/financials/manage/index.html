<style>

<script type="module">
import { boot, db, $, esc, has, STAFF, OFFICERS, scopeOf, colFor, logAction, DISTRICT_COURT, SUPREME_COURT } from '/courts/online-services/portal/dashboard/assets/js/portal-shell.js?v=6';
import * as F from '/courts/online-services/portal/dashboard/assets/js/finance.js?v=1';
import { collection, getDocs, doc, runTransaction } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const { account, role } = await boot({ id: 'mfinancials', title: 'Manage Financials', subtitle: 'Fines, fees, restitution and judgments: payments, adjustments, plans and garnishments.' });
const root = $('page-body'), BASE = 'https://migovt.org/courts/online-services/portal/dashboard/';
if (!has(STAFF, role)) root.innerHTML = '<section class="card"><div class="empty"><strong>Court staff only</strong><p>Manage Financials is limited to court staff.</p></div></section>';
else await main();

async function main() {
const { money, r2 } = F, NOW = new Date(), scope = scopeOf(role);
const CLERICAL = ['County Clerk', 'Deputy Clerk', 'Clerk of the Supreme Court', 'Deputy Clerk of the Supreme Court', 'Court Administrator', 'State Court Administrator'];
const isJud = has(OFFICERS, role), canAct = isJud || has(CLERICAL, role);   // everything except reductions, court credits, interest changes and garnishments (judicial officers only)
const hv = v => v !== undefined && v !== null && String(v).trim() !== '';
const nameKey = n => { const t = String(n || '').toLowerCase().replace(/^hon\.?\s+/, '').replace(/[.,]/g, '').trim().split(/\s+/); return t.length ? t[0] + ' ' + t[t.length - 1] : ''; };
const fmtD = s => { const d = F.parseDay(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; };
const fmtDT = s => { const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const iso = d => (d || new Date()).toISOString(), plus = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
const sideOf = r => /defendant|respondent|appellee/i.test(r || '') ? 1 : /plaintiff|petitioner|prosecut|appellant|applicant|complainant|claimant/i.test(r || '') ? 0 : null;
function caption(c) {
  if (hv(c.caseTitleOverride)) return c.caseTitleOverride;
  const l = F.caseParties(c), t = String(c.caseType || '').toLowerCase(), a = l.find(x => sideOf(x.role) === 0), b = l.find(x => sideOf(x.role) === 1);
  if (t === 'criminal' || t === 'traffic') return a && b ? `${a.name} v. ${b.name}` : `State of Michigan v. ${b?.name || 'Unknown'}`;
  if (a && b) return `${a.name} v. ${b.name}`; if (a) return `Ex parte ${a.name}`; if (b) return `In re ${b.name}`; return c.administrativeSubtype || c.caseId || 'Case';
}
class UserError extends Error {} const bad = m => { throw new UserError(m); };
const errText = e => e instanceof UserError ? e.message : e?.code === 'permission-denied' ? 'Your account is not allowed to change this record. The Firestore rules must let court staff update cases. (permission-denied)' : `We could not save this change. Check your connection and try again.${e?.code ? ' (' + e.code + ')' : ''}`;

/* ── Data ───────────────────────────────────────────────────────────── */
let cases = [], items = [], tab = 'orders', chip = 'outstanding', note = '', noteKind = 'ok', back = null;
const f = { q: '', type: '', court: '', mine: isJud };
async function load() {
  const safe = p => p.catch(() => ({ docs: [] }));
  const snaps = await Promise.all(scope.map(ct => safe(getDocs(collection(db, colFor(ct)))))); cases = snaps.flatMap(s => s.docs.map(d => ({ ...d.data(), _id: d.id }))); rebuild();
}
function rebuild() { items = []; cases.forEach(c => (c.financialOrders || []).forEach((o, i) => { const raw = F.normalize(o, F.idOf(c, i)), r = F.accrue(raw, NOW); items.push({ key: c._id + '|' + raw.id, c, o: r.order, due: r.posted }); })); }
const byKey = k => items.find(x => x.key === k);
const mineOf = x => x.c.judgeUid === account.uid || nameKey(x.c.judge) === nameKey(account.name);

/* ── Saving ─────────────────────────────────────────────────────────── */
async function cmUpdate(c, field, fn) {
  const r = doc(db, 'caseManagement', c._id);
  await runTransaction(db, async tx => { const s = await tx.get(r), next = fn([...((s.exists() && s.data()[field]) || [])]); if (s.exists()) tx.update(r, { [field]: next }); else tx.set(r, { tasks: [], notifications: [], internalNotes: [], auditLog: [], caseFirestoreId: c._id, [field]: next }); });
}
const addAudit = async (c, action) => { try { await cmUpdate(c, 'auditLog', a => [...a, { action, by: account.name, byUid: account.uid, byRole: role, at: iso() }]); } catch (e) { console.warn('Audit entry not saved', e); } };
const notify = async (c, n) => { try { await cmUpdate(c, 'notifications', a => [...a, { num: a.reduce((m, x) => Math.max(m, x.num || 0), 0) + 1, at: iso(), read: false, type: 'Financial Notice', ...n }]); await addAudit(c, `Auto-issued notice: ${n.title} — ${n.text}`); } catch (e) { console.warn('Notice not saved', e); } };
// One transaction on the case: re-reads it, posts anything that has come due, applies fn, and writes the docket entry with it.
async function mutate(c, fn) {
  const r = doc(db, colFor(c.court), c._id), at = new Date(); let out = {}, posts = [];
  const next = await runTransaction(db, async tx => {
    const s = await tx.get(r); if (!s.exists()) bad('This case no longer exists.'); const d = s.data(); posts = [];
    const arr = (d.financialOrders || []).map((o, i) => { const a = F.accrue(F.normalize(o, F.idOf({ ...d, _id: s.id }, i)), at); if (a.posted.length) posts.push({ order: a.order, posted: a.posted }); return a.order; });
    out = fn(arr, d, at) || {}; const orders = (out.orders || arr).map(o => F.settle(F.normalize(o, o.id))), p = { financialOrders: orders, dates: { ...(d.dates || {}), lastUpdated: iso(at) } };
    if (out.event) p.events = [...(d.events || []), { eventNumber: (d.events || []).reduce((m, x) => Math.max(m, x.eventNumber || 0), 0) + 1, sealed: false, type: 'event', date: iso(at), judge: d.judge || null, ...out.event }];
    tx.update(r, p); return { ...d, ...p };
  });
  Object.assign(c, next); rebuild();
  for (const p of posts) for (const q of p.posted) await notify(c, { title: q.kind === 'late-fee' ? 'Late Fee Added' : q.kind === 'interest' ? 'Interest Added' : 'Payment Plan Defaulted', text: `${p.order.type}: ${q.kind === 'late-fee' ? `a ${F.LATE_RATE * 100}% late fee of ${money(q.amount)} was added because the balance was not paid within ${F.GRACE_DAYS} days after the due date.` : q.kind === 'interest' ? `interest of ${money(q.amount)} was added.` : q.reason}` });
  if (out.audit) await addAudit(c, out.audit); if (out.notice) await notify(c, out.notice);
  if (out.event) { const n = (next.events || []).slice(-1)[0]?.eventNumber; await logAction(account, role, c.court, 'event-entry', { caseId: c.caseId, ref: `${c.caseId}:event:${n}` }); }
  return out;
}
const upd = (arr, id, fn) => { const k = arr.findIndex(o => o.id === id); if (k < 0) bad('That order was not found.'); const n = [...arr]; n[k] = fn(arr[k]); return n; };
const need = (cond, m) => { if (!cond) bad(m); };
// Late fees and interest that have come due are posted whenever staff open this page.
async function postDue() {
  let n = 0; const todo = cases.filter(c => (c.financialOrders || []).some((o, i) => { const a = F.accrue(F.normalize(o, F.idOf(c, i)), NOW); return a.posted.length || a.changed; }));
  for (const c of todo) { try { await mutate(c, () => ({})); n++; } catch (e) { console.warn('Could not post charges for', c.caseId, e); } }
  return n;
}

/* ── Dialogs ────────────────────────────────────────────────────────── */
const dlg = $('dlg'); let dlgOk = null, dlgChange = null;
function modal({ title, sub = '', body, ok = 'Save', okCls = '', wide = false, onOk, onChange, bk }) {
  back = bk || null; dlgChange = onChange || null; $('dlg-t').textContent = title; $('dlg-w').textContent = sub; $('dlg-b').innerHTML = body; $('dlg-e').innerHTML = ''; dlg.classList.toggle('wide', wide); dlgOk = onOk;
  $('dlg-f').innerHTML = `<button class="btn outline" type="button" data-close>${onOk ? 'Cancel' : 'Close'}</button>${onOk ? `<button class="btn ${okCls}" type="button" id="dlg-ok">${ok}</button>` : ''}`;
  if (!dlg.open) dlg.showModal(); if (onOk) dlg.querySelector('#dlg-b input:not([type=hidden]):not([type=radio]):not([readonly]),#dlg-b select')?.focus();
}
const closeDlg = () => { const b = back; back = null; if (b && byKey(b)) showOrder(b); else { dlg.close(); draw(); } };
async function runOk() { const b = $('dlg-ok'), label = b.textContent; b.disabled = true; b.textContent = 'Saving…'; $('dlg-e').innerHTML = '';
  try { await dlgOk(); } catch (e) { if (!(e instanceof UserError)) console.error(e); $('dlg-e').innerHTML = `<div class="alert" role="alert">${esc(errText(e))}</div>`; b.disabled = false; b.textContent = label; } }
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) closeDlg(); else if (e.target.closest('#dlg-ok')) runOk(); else { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); } });
dlg.addEventListener('input', e => dlgChange?.(e)); dlg.addEventListener('change', e => dlgChange?.(e));
const val = id => ($(id)?.value || '').trim();
const fld = (label, id, v = '', o = {}) => `<label class="f"><span>${label}</span><input id="${id}" type="${o.type || 'text'}" value="${esc(v)}"${o.step ? ` step="${o.step}"` : ''}${o.min != null ? ` min="${o.min}"` : ''}${o.list ? ` list="${o.list}"` : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.ro ? ' readonly' : ''}>${o.hint ? `<small class="m">${o.hint}</small>` : ''}</label>`;
const area = (label, id, ph = '') => `<label class="f"><span>${label}</span><textarea id="${id}" placeholder="${esc(ph)}"></textarea></label>`;
const selF = (label, id, opts, v) => `<label class="f"><span>${label}</span><select id="${id}">${opts.map(([ov, ol]) => `<option value="${esc(ov)}"${ov === v ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select></label>`;
const g2 = (...c) => `<div class="cols">${c.join('')}</div>`, dlist = (id, l) => `<datalist id="${id}">${l.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
const opt = (id, label, hint, on) => `<label class="opt"><input type="radio" name="${id}" value="${label.k}" ${on ? 'checked' : ''}><div><b>${esc(label.t)}</b>${hint ? `<small>${esc(hint)}</small>` : ''}</div></label>`;
const amountIn = (id, max, hint) => fld('Amount ($)', id, '', { type: 'number', step: '0.01', min: 0.01, hint: hint || (max != null ? `Up to ${money(max)}.` : '') });
const reasonIn = (id = 'x-why', label = 'Reason or order reference') => area(label + ' (required)', id, 'e.g. Order of 10/4/2026 reducing the fine');
const who = () => ({ by: account.name, byUid: account.uid, byRole: role });
const adj = (kind, amount, reason, extra = {}) => ({ id: F.newId('ADJ'), kind, amount: r2(amount), date: iso(), reason, ...who(), ...extra });

/* ── Operations ─────────────────────────────────────────────────────── */
function receipt(p, c, o, bk) {
  modal({ title: 'Payment receipt', sub: 'Give a copy to the payer.', bk, body: `<div class="rcpt"><div class="tick" aria-hidden="true">✓</div><b>Payment received</b><div class="big">${money(Math.abs(p.amount))}</div></div>
    <dl class="kv"><div><dt>Confirmation number</dt><dd>${esc(p.confirmation)}</dd></div><div><dt>Date and time</dt><dd>${esc(fmtDT(p.date))}</dd></div><div><dt>Paid with</dt><dd>${esc(p.method || '—')}</dd></div><div><dt>Case</dt><dd>${esc(c.caseId)}</dd></div><div><dt>Paid toward</dt><dd>${esc(o.type)}${o.description ? ' — ' + esc(o.description) : ''}</dd></div><div><dt>Remaining balance</dt><dd>${money(Math.max(0, p.balanceAfter ?? 0))}</dd></div><div><dt>Payer</dt><dd>${esc(o.payor || '—')}</dd></div><div><dt>Received by</dt><dd>${esc(p.by || '')}</dd></div></dl>`, onOk: null });
  $('dlg-f').insertAdjacentHTML('afterbegin', '<button class="btn outline" type="button" data-a="print">Print receipt</button>');
}
function paymentModal(x) {
  const bal = F.balanceOf(x.o), ps = F.planState(x.o, NOW);
  modal({ title: 'Take a payment', sub: `${x.o.type} · ${x.c.caseId}`, bk: x.key, ok: 'Record payment', okCls: 'good',
    body: `<div class="quote">Balance ${money(bal)}${ps?.dueNow > 0 ? ` · due now under the plan: ${money(Math.min(bal, ps.dueNow))}` : ''}</div>` + fld('Amount received ($)', 'p-amt', String(bal), { type: 'number', step: '0.01', min: 0.01 }) + g2(selF('Payment method', 'p-meth', F.COUNTER.map(m => [m, m]), 'Cash'), fld('Check or reference number (optional)', 'p-ref')) + fld('Note (optional)', 'p-note'),
    onOk: async () => { const amt = r2(val('p-amt')); need(amt > 0, 'Enter the amount received.'); need(amt <= bal + 0.004, `The balance is ${money(bal)}. To accept more, correct the amount owed first.`); let pay;
      await mutate(x.c, (arr, d, at) => { const cur = arr.find(o => o.id === x.o.id); need(amt <= F.balanceOf(cur) + 0.004, `The balance changed to ${money(F.balanceOf(cur))}. Reopen the order.`);
        pay = F.makePayment(cur, { amount: amt, method: val('p-meth'), note: [val('p-ref') && 'Ref ' + val('p-ref'), val('p-note')].filter(Boolean).join(' · ') || null, ...who(), date: at, balanceAfter: r2(F.balanceOf(cur) - amt) });
        return { orders: upd(arr, x.o.id, o => ({ ...o, payments: [...o.payments, pay] })), audit: `Recorded payment of ${money(amt)} (${val('p-meth')}) on ${x.o.type}` }; });
      receipt(pay, x.c, x.o, x.key); } });
}
function assessModal() {
  const open = cases.filter(c => !/closed/i.test(c.status || '')); let c = null;
  const parties = () => F.caseParties(c || {}).map(p => [p.name, `${p.name} — ${p.role}`]);
  modal({ title: 'Assess a fine, fee or judgment', sub: 'Adds a new financial order to a case.', ok: 'Assess', okCls: 'good', wide: true,
    body: fld('Case', 'a-case', '', { ph: 'Start typing a case number or name', list: 'a-cases', hint: 'Choose the case this is assessed in.' }) + dlist('a-cases', open.map(k => `${k.caseId} — ${caption(k)}`))
      + g2(selF('Type', 'a-type', F.TYPES.map(t => [t, t]), 'Court Fine'), `<label class="f"><span>Who owes it</span><select id="a-payor"><option value="">Choose a case first</option></select></label>`)
      + g2(fld('Amount ($)', 'a-amt', '', { type: 'number', step: '0.01', min: 0.01 }), fld('Due date', 'a-due', plus(30), { type: 'date', hint: 'A 20% late fee applies if a fine or fee is unpaid 5 days after this date.' }))
      + fld('Description', 'a-desc', '', { ph: 'e.g. Speeding, 15 mph over' }) + `<div id="a-int" hidden>${fld('Interest rate (% per year)', 'a-rate', String(F.JUDGMENT_RATE), { type: 'number', step: '0.01', min: 0, hint: 'Simple interest posts each month on the unpaid balance.' })}</div>`,
    onChange: e => { if (e.target.id === 'a-case') { const m = open.find(k => `${k.caseId} — ${caption(k)}` === e.target.value || k.caseId === e.target.value.trim()); if (m) { c = m; $('a-payor').innerHTML = parties().map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); } }
      if (e.target.id === 'a-type') { const k = F.typeKind(e.target.value); $('a-int').hidden = k !== 'judgment'; if (k === 'restitution' || k === 'judgment') $('a-due').value = ''; else if (!$('a-due').value) $('a-due').value = plus(30); } },
    onOk: async () => { need(c, 'Choose a case from the list.'); const type = val('a-type'), amt = r2(val('a-amt')), payor = val('a-payor'); need(amt > 0, 'Enter the amount.'); need(payor, 'Choose who owes it.');

  const lateWarn = open && F.lateEligible(o) && !o.lateFeeAt && dl && !(o.schedule?.status === 'Active') && dl > NOW ? `<div class="alert-line">A ${F.LATE_RATE * 100}% late fee (${money(bal * F.LATE_RATE)}) is added automatically after ${esc(fmtD(new Date(dl.getTime() - 1)))}.</div>` : '';
  const acts = canAct ? [open ? b('pay', 'Take a payment', 'btn sm') : '', open ? b('plan', ps || o.schedule?.status === 'Defaulted' ? 'Change payment plan' : o.planRequest?.status === 'Requested' ? 'Review plan request' : 'Payment plan') : '', open ? b('credit', 'Apply a credit') : '', bal < -0.004 ? b('refund', 'Issue a refund') : '', b('correct', 'Correct an error'),
    isJud && open ? b('modify', 'Reduce or modify') : '', isJud && open ? b('garnish', 'Garnishment') : '', active ? b('collect', 'Record garnished funds') : '', o.planRequest?.status === 'Requested' ? b('decline', 'Decline request') : '', o.schedule && ['Active', 'Defaulted'].includes(o.schedule.status) ? b('endplan', 'End plan') : ''].join('') : '';
  modal({ title: `${o.type}${o.description ? ' — ' + o.description : ''}`, sub: `${caption(x.c)} · ${x.c.caseId} · ${o.payor || 'Payor not recorded'}`, wide: true, onOk: null,
    body: `<div class="pills" style="margin-bottom:14px">${pills(o)}</div>${lateWarn}${ps ? `<div class="note">Payment plan: ${money(ps.installment)} ${o.schedule.frequency === 'monthly' ? 'every month' : o.schedule.frequency === 'weekly' ? 'every week' : 'every two weeks'}${ps.dueNow > 0 ? `. <b>${money(Math.min(bal, ps.dueNow))} is due now.</b>` : ''}${ps.next ? ` Next installment ${esc(fmtD(ps.next))}.` : ''}${o.schedule.status === 'Defaulted' ? ' <b>The plan is in default.</b>' : ''}</div>` : ''}${o.planRequest?.status === 'Requested' ? `<div class="note">Payment plan requested by ${esc(o.planRequest.requestedBy)}: ${money(o.planRequest.installment)} ${esc(o.planRequest.frequency)}, starting ${esc(fmtD(o.planRequest.startDate))}.</div>` : ''}
      <dl class="amts"><div><dt>Original amount</dt><dd>${money(o.originalAmount)}</dd></div><div><dt>Fees, interest and changes</dt><dd>${adjT > 0 ? '+' : ''}${money(adjT)}</dd></div><div><dt>Paid</dt><dd>${money(F.paidOf(o))}</dd></div><div><dt>${bal < 0 ? 'Credit balance' : 'Balance'}</dt><dd class="owe">${money(Math.abs(bal))}</dd></div><div><dt>Due</dt><dd>${esc(fmtD(o.dueDate))}</dd></div>${F.rateOf(o) > 0 ? `<div><dt>Interest</dt><dd>${F.rateOf(o)}% per year</dd></div>` : ''}</dl>
      ${acts ? `<div class="acts">${acts}</div>` : '<p class="m">Your role can view financial records but not change them.</p>'}${!isJud && canAct && open ? '<p class="m">Reductions, waivers, interest changes and garnishments require a judicial officer.</p>' : ''}
      ${gs.length ? `<h4 class="sec">Garnishments</h4>` + gs.map(g => `<div class="${g.status === 'Active' ? 'alert-line red' : 'note'}"><b>${esc(g.type)}</b> to ${esc(g.garnishee)} — ${esc(g.status)}. Issued ${esc(fmtD(g.issuedAt))} by ${esc(g.issuedBy)}. Up to ${money(g.limit)}, ${money(g.collected)} collected${g.perPeriod ? `, ${money(g.perPeriod)} each ${esc(g.frequency)}` : ''}. ${esc(g.authority || '')} ${g.status === 'Active' && isJud ? `<button class="btn outline sm" type="button" data-a="release:${esc(key)}|${esc(g.id)}">Release</button>` : ''}</div>`).join('') : ''}
      <h4 class="sec">Ledger</h4><div class="table-scroll"><table><thead><tr><th>Date</th><th>Entry</th><th class="num">Charges</th><th class="num">Payments and credits</th><th class="num">Balance</th></tr></thead><tbody>${F.ledger(o).map(r => `<tr><td>${esc(fmtD(r.date))}</td><td><b>${esc(r.label)}</b>${r.reversed ? ' <span class="pill plain">Reversed</span>' : ''}${r.auto ? ' <span class="pill plain">Automatic</span>' : ''}<small>${esc(r.desc)}${r.by ? ' · ' + esc(r.by) : ''}</small></td><td class="num">${r.charge ? money(r.charge) : ''}</td><td class="num">${r.credit ? money(r.credit) : ''}</td><td class="num"><b>${money(r.balance)}</b></td></tr>`).join('')}</tbody></table></div>` });
}

/* ── Page ───────────────────────────────────────────────────────────── */
const CHIPS = [['outstanding', 'Outstanding', x => F.isOpen(x.o)], ['pastdue', 'Past due', x => F.isPastDue(x.o, NOW) || x.o.schedule?.status === 'Defaulted'], ['plans', 'Payment plans', x => x.o.schedule && ['Active', 'Defaulted'].includes(x.o.schedule.status)], ['requests', 'Plan requests', x => x.o.planRequest?.status === 'Requested'], ['garnished', 'Garnishments', x => (x.o.garnishments || []).some(g => g.status === 'Active')],
  ['judgments', 'Judgments', x => F.typeKind(x.o.type) === 'judgment'], ['credits', 'Credits to refund', x => F.balanceOf(x.o) < -0.004], ['paid', 'Paid', x => !F.isOpen(x.o) && F.balanceOf(x.o) >= -0.004], ['all', 'All', () => true]];
const scoped = () => items.filter(x => (!f.court || x.c.court === f.court) && (!f.type || x.o.type === f.type) && (!f.mine || mineOf(x)) && (!f.q || [x.c.caseId, caption(x.c), x.o.payor, x.o.type, x.o.description].join(' ').toLowerCase().includes(f.q.toLowerCase().trim())));
const stat = (l, v, al) => `<div class="stat ${al ? 'alert-stat' : ''}"><span>${l}</span><b>${v}</b></div>`;
function draw() {
  $('page-subtitle').textContent = 'Fines, fees, restitution and judgments: payments, adjustments, plans and garnishments.';
  $('page-action').innerHTML = canAct ? '<button class="btn" type="button" data-a="assess">Assess a fine or fee</button>' : '';
  const all = scoped(), open = all.filter(x => F.isOpen(x.o)), mo = `${NOW.getFullYear()}-${String(NOW.getMonth() + 1).padStart(2, '0')}`, pays = all.flatMap(x => (x.o.payments || []).map(p => ({ p, x }))).sort((a, b) => new Date(b.p.date) - new Date(a.p.date));
  const collected = r2(pays.filter(({ p }) => p.amount > 0 && /payment|garnishment/.test(p.kind || 'payment') && String(p.date).slice(0, 7) === mo).reduce((t, { p }) => t + p.amount, 0)), pastDue = r2(all.filter(CHIPS[1][2]).reduce((t, x) => t + Math.max(0, F.balanceOf(x.o)), 0)), credits = r2(all.filter(CHIPS[6][2]).reduce((t, x) => t - F.balanceOf(x.o), 0));
  const types = [...new Set(items.map(x => x.o.type).filter(Boolean))].sort(), chipDef = CHIPS.find(c => c[0] === chip) || CHIPS[0], rows = all.filter(chipDef[2]);
  root.innerHTML = (note ? `<div class="${noteKind === 'ok' ? 'ok-bar' : 'alert'}" role="status" style="margin-bottom:16px">${esc(note)}</div>` : '')
    + `<div class="stats">${stat('Outstanding', money(open.reduce((t, x) => t + F.balanceOf(x.o), 0)))}${stat('Past due', money(pastDue), pastDue > 0)}${stat('Collected this month', money(collected))}${stat('Plan requests', all.filter(CHIPS[3][2]).length, all.some(CHIPS[3][2]))}${stat('Credits to refund', money(credits))}</div>
    <div class="tools"><input class="in" id="f-q" type="search" placeholder="Search by case number, name, or type" aria-label="Search" value="${esc(f.q)}"><select class="in" id="f-type" aria-label="Type"><option value="">All types</option>${types.map(t => `<option${t === f.type ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${scope.length > 1 ? `<select class="in" id="f-court" aria-label="Court"><option value="">Both courts</option>${scope.map(c => `<option${c === f.court ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>` : ''}${isJud ? `<label class="chk"><input type="checkbox" id="f-mine" ${f.mine ? 'checked' : ''}>My docket</label>` : ''}</div>
    <div class="tabs" role="tablist">${[['orders', 'Orders', all.length], ['payments', 'Payments', pays.length]].map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-a="tab:${k}">${l}<i>${n}</i></button>`).join('')}</div>
    ${tab === 'orders' ? `<div class="chips">${CHIPS.map(([k, l, fn]) => `<button type="button" class="${chip === k ? 'on' : ''}" data-a="chip:${k}">${l}<i>${all.filter(fn).length}</i></button>`).join('')}</div>${rows.length ? `<section class="card flush"><div class="table-scroll"><table><thead><tr><th>Case</th><th>Order</th><th>Due</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>${rows.map(x => `<tr data-a="open:${esc(x.key)}"><td><b>${esc(x.c.caseId)}</b><small>${esc(caption(x.c))}</small></td><td>${esc(x.o.type)}<small>${esc(x.o.payor || '—')}${x.o.description ? ' · ' + esc(x.o.description) : ''}</small></td><td>${esc(fmtD(x.o.dueDate))}</td><td class="num">${money(x.o.amount)}</td><td class="num">${money(F.paidOf(x.o))}</td><td class="num"><b>${money(F.balanceOf(x.o))}</b></td><td><div class="pills">${pills(x.o)}</div></td></tr>`).join('')}</tbody></table></div></section>` : `<section class="card"><div class="empty"><strong>Nothing here</strong><p>${f.q || f.type ? 'Try a different search or clear a filter.' : 'No orders match this view.'}</p></div></section>`}`
      : `${pays.length ? `<section class="card flush"><div class="table-scroll"><table><thead><tr><th>Date</th><th>Case</th><th>Order</th><th>Entry</th><th>Method</th><th class="num">Amount</th><th>By</th></tr></thead><tbody>${pays.slice(0, 200).map(({ p, x }) => `<tr data-a="open:${esc(x.key)}"><td>${esc(fmtDT(p.date))}</td><td><b>${esc(x.c.caseId)}</b></td><td>${esc(x.o.type)}<small>${esc(x.o.payor || '')}</small></td><td>${esc(F.kindLabel(p))}${p.reversed ? ' <span class="pill plain">Reversed</span>' : ''}<small>${esc(p.confirmation || '')}</small></td><td>${esc(p.method || '—')}</td><td class="num"><b>${money(p.amount)}</b></td><td>${esc(p.by || '—')}</td></tr>`).join('')}</tbody></table></div></section>` : '<section class="card"><div class="empty"><strong>No payments recorded</strong></div></section>'}`}`;
}
function act(a) { const [n, ...r] = a.split(':'), v = r.join(':'); try {
  if (n === 'tab') { tab = v; note = ''; draw(); } else if (n === 'chip') { chip = v; draw(); } else if (n === 'open') { note = ''; showOrder(v); } else if (n === 'print') window.print(); else if (n === 'assess') assessModal();
  else if (n === 'release') releaseModal(byKey(v.slice(0, v.lastIndexOf('|'))), v.slice(v.lastIndexOf('|') + 1));
  else { const x = byKey(v); if (!x) return; ({ pay: paymentModal, plan: planModal, credit: creditModal, refund: refundModal, correct: correctModal, modify: modifyModal, garnish: garnishModal, collect: collectModal, decline: declineModal, endplan: cancelPlan })[n]?.(x); }
} catch (e) { console.error(e); note = errText(e); noteKind = 'bad'; draw(); } }
document.addEventListener('click', e => { if (dlg.contains(e.target)) return; const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); });
document.addEventListener('input', e => { if (e.target.id === 'f-q') { f.q = e.target.value; draw(); const i = $('f-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
document.addEventListener('change', e => { if (e.target.id === 'f-type') { f.type = e.target.value; draw(); } else if (e.target.id === 'f-court') { f.court = e.target.value; draw(); } else if (e.target.id === 'f-mine') { f.mine = e.target.checked; draw(); } });

try { await load(); } catch (e) { console.error(e); root.innerHTML = '<div class="alert" role="alert"><strong>We could not load financial records.</strong><p>Refresh the page to try again.</p></div>'; return; }
draw();
if (canAct) { try { const n = await postDue(); if (n) { note = `Late fees, interest or plan defaults were posted on ${n} case${n === 1 ? '' : 's'}.`; noteKind = 'ok'; draw(); } } catch (e) { console.warn(e); } }
}
</script>
</body>
</html>

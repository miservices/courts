  const d = new Date(first); d.setDate(1 - first.getDay()); let rows = '';

    const k = dayKey(d), it = by[k] || [], cls = [d.getMonth() !== ym.m ? 'out' : '', d.getDay() % 6 === 0 ? 'wk' : '', k === t ? 'today' : ''].join(' ').trim();
    const inner = `<span class="num">${d.getDate()}</span>` + (it.length ? it.slice(0, 3).map(x => { const st = stateOf(x); return `<span class="ev ${conflicts.has(x.key) ? 'clash' : st === 'needs' ? 'need' : st === 'cancelled' ? 'cx' : st === 'held' ? 'past' : ''}">${esc(fmtTime(x.when).replace(':00', ''))} ${esc(caption(x.c))}</span>`; }).join('') + (it.length > 3 ? `<span class="more-ev">+${it.length - 3} more</span>` : '') + `<span class="cnt">${it.length}</span>` : '');
    r += `<td class="${cls}">${it.length ? `<button type="button" class="cell${k === sel ? ' sel' : ''}" data-a="day:${k}" aria-label="${esc(fmtDay(k))}, ${it.length} hearing${it.length === 1 ? '' : 's'}">${inner}</button>` : `<div class="cell">${inner}</div>`}</td>`; d.setDate(d.getDate() + 1); }
    rows += `<tr>${r}</tr>`; }
  return `<div class="cal-bar"><h3>${esc(first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }))}</h3><div class="chips"><button type="button" data-a="shift:-1">‹ Previous</button><button type="button" data-a="today">Today</button><button type="button" data-a="shift:1">Next ›</button></div></div>
    <table class="cal"><thead><tr>${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${sel && by[sel] ? dayCard(sel, by[sel]) : '<section class="card"><div class="empty"><strong>No hearings this month</strong></div></section>'}`;
}
function draw() {
  setHead(isMsc({ court: scope[0] }) && scope.length === 1 ? 'Schedule oral arguments, record the outcome, and keep parties notified.' : 'Schedule, reschedule, and record the outcome of hearings.', btn('new', 'Schedule a hearing', ''));
  const t = dayKey(new Date()), live = all.filter(x => stateOf(x) === 'upcoming'), wk = live.filter(x => x.when - new Date() <= 7 * 864e5), needs = all.filter(x => stateOf(x) === 'needs');
  const stat = (l, v, al) => `<div class="stat ${al ? 'alert-stat' : ''}"><span>${l}</span><b>${v}</b></div>`;
  const officers = [...new Set(all.map(x => x.h.officer).filter(Boolean))].sort(), types = [...new Set(all.map(x => x.h.type).filter(Boolean))].sort();
  const opt = (v, cur, l) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l ?? v)}</option>`;
  root.innerHTML = `<div id="msg">${note ? `<div class="${noteKind === 'ok' ? 'ok-bar' : 'alert'}" role="status" style="margin-bottom:16px">${esc(note)}</div>` : ''}</div>
    <div class="stats">${stat('Today', live.filter(x => dayKey(x.when) === t).length)}${stat('Next 7 days', wk.length)}${stat('Need a result', needs.length, needs.length > 0)}${stat('Conflicts', new Set([...conflicts.keys()]).size, conflicts.size > 0)}</div>
    <div class="tools"><input class="in" id="f-q" type="search" placeholder="Search by case, party, judge, or courtroom" aria-label="Search hearings" value="${esc(F.q)}">
      <select class="in" id="f-status" aria-label="Status">${[['upcoming', 'Upcoming'], ['needs', 'Needs a result'], ['past', 'Past'], ['cancelled', 'Cancelled'], ['all', 'All']].map(([v, l]) => opt(v, F.status, l)).join('')}</select>
      <select class="in" id="f-when" aria-label="When"><option value="">Any date</option>${[['today', 'Today'], ['7', 'Next 7 days'], ['30', 'Next 30 days']].map(([v, l]) => opt(v, F.when, l)).join('')}</select></div>
    <div class="tools"><select class="in" id="f-officer" aria-label="Judicial officer"><option value="">Every judicial officer</option>${officers.map(o => opt(o, F.officer)).join('')}</select>
      <select class="in" id="f-type" aria-label="Hearing type"><option value="">All types</option>${types.map(o => opt(o, F.type)).join('')}</select>
      <select class="in" id="f-attend" aria-label="Attendance"><option value="">Any attendance</option>${ATTEND.map(([v, l]) => opt(v, F.attend, l)).join('')}</select>
      ${scope.length > 1 ? `<select class="in" id="f-court" aria-label="Court"><option value="">Both courts</option>${scope.map(o => opt(o, F.court)).join('')}</select>` : ''}
      ${isJudicial ? `<label class="chk"><input type="checkbox" id="f-mine" ${F.mine ? 'checked' : ''}>My docket</label>` : ''}</div>
    <div class="bar"><span class="m" id="count"></span><div class="seg"><button type="button" class="${view === 'list' ? 'on' : ''}" data-a="view:list">List</button><button type="button" class="${view === 'cal' ? 'on' : ''}" data-a="view:cal">Calendar</button></div></div>
    <div id="hv"></div>`;
  drawBody();
}
function drawBody() { const l = all.filter(matches); $('count').textContent = `${l.length} hearing${l.length === 1 ? '' : 's'}`; $('hv').innerHTML = view === 'list' ? listHtml(l) : calHtml(l); }
const flash = (t, kind = 'ok') => { note = t; noteKind = kind; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

/* ── Dialogs ────────────────────────────────────────────────────────── */
const dlg = $('dlg'); let dlgOk = null, dlgChange = null;
function modal({ title, sub = '', body, ok = 'Save', okCls = '', wide = false, onOk, onChange, extra = '' }) {
  dlgChange = onChange || null; $('dlg-t').textContent = title; $('dlg-w').textContent = sub; $('dlg-b').innerHTML = body; $('dlg-e').innerHTML = ''; dlg.classList.toggle('wide', wide); dlgOk = onOk;
  $('dlg-f').innerHTML = `${extra}<button class="btn outline" type="button" data-close>${onOk ? 'Cancel' : 'Close'}</button>${onOk ? `<button class="btn ${okCls}" type="button" id="dlg-ok">${ok}</button>` : ''}`;
  if (!dlg.open) dlg.showModal(); if (onOk) dlg.querySelector('#dlg-b input:not([type=hidden]):not([readonly]),#dlg-b select')?.focus();
}
async function runOk() {
  const b = $('dlg-ok'), label = b.textContent; b.disabled = true; b.textContent = 'Saving…'; $('dlg-e').innerHTML = '';
  try { await dlgOk(); dlg.close(); draw(); } catch (e) { if (!(e instanceof UserError)) console.error(e); $('dlg-e').innerHTML = `<div class="alert" role="alert">${esc(errText(e))}</div>`; b.disabled = false; b.textContent = label; }
}
const ask = (title, text, ok, cls = '') => new Promise(res => { let yes = false; modal({ title, body: `<p>${text}</p>`, ok, okCls: cls, onOk: async () => { yes = true; res(true); } }); dlg.addEventListener('close', () => { if (!yes) res(false); }, { once: true }); });
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); else if (e.target.closest('#dlg-ok')) runOk(); else { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); } });
dlg.addEventListener('change', e => dlgChange?.(e));
const val = id => ($(id)?.value || '').trim();
const fld = (label, id, v = '', o = {}) => `<label class="f"><span>${label}</span><input id="${id}" type="${o.type || 'text'}" value="${esc(v)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.list ? ` list="${o.list}"` : ''}>${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
const area = (label, id, v = '', ph = '') => `<label class="f"><span>${label}</span><textarea id="${id}" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
const selF = (label, id, opts, v) => `<label class="f"><span>${label}</span><select id="${id}">${opts.map(x => { const [ov, ol] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(ov)}"${ov === v ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
const dlist = (id, l) => `<datalist id="${id}">${l.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
const g2 = (...c) => `<div class="cols">${c.join('')}</div>`;
const caseLabel = c => `${c.caseId} — ${caption(c)}`;

/* Hearing form: used to schedule, reschedule and edit */
function officerOpts(c) {
  const p = judges.filter(j => has(isMsc(c) ? ['Justice', 'Chief Justice'] : ['Magistrate', 'Judge', 'Chief Judge'], j.role));
  return [['', `Judge of record (${c.judge || 'unassigned'})`], ...(isMsc(c) ? [['Full Court', 'Full Court']] : []), ...p.map(j => [j.name, `${j.name} — ${j.role}`])];
}
const roomFor = (c, off) => isMsc(c) ? MSC_PLACE : (() => { const j = judges.find(x => x.name === (off || c.judge)); return ROOM[j?.role] ? 'Courtroom ' + ROOM[j.role] : roomLabel(c.courtroomNumber); })();
function hearingModal(c0, x) {
  let c = c0; const h = x ? x.h : {}, isNew = !x, att0 = h.attendance || (c && isMsc(c) ? 'hybrid' : 'in-person');
  const draw_ = () => {   // fields that depend on the chosen case are refreshed when the case changes
    const msc = isMsc(c);
    $('hm-off').innerHTML = officerOpts(c).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); $('hm-off').value = h.officer && officerOpts(c).some(o => o[0] === h.officer) ? h.officer : '';
    $('hm-room').value = $('hm-att').value === 'video' ? 'Videoconference' : h.courtroom || roomFor(c, val('hm-off')); $('hm-attw').hidden = msc; $('hm-vid').hidden = !msc && val('hm-att') === 'in-person';
    $('hm-urll').textContent = msc ? 'Livestream link' : 'Video link'; $('hm-minl').textContent = msc ? 'Minutes per side' : 'Length (minutes)'; $('hm-types').innerHTML = (msc ? MTYPES : DTYPES).map(t => `<option value="${esc(t)}">`).join('');
  };
  modal({ title: isNew ? 'Schedule a hearing' : 'Reschedule hearing', sub: x ? `${caption(c)} · ${c.caseId}` : '', wide: true, ok: isNew ? 'Schedule hearing' : 'Save changes',
    onChange: e => { const id = e.target.id;
      if (id === 'hm-case') { const m = cases.find(k => caseLabel(k) === e.target.value || k.caseId === e.target.value.trim()); if (m) { c = m; draw_(); } }
      if (id === 'hm-att') { const v = e.target.value; $('hm-vid').hidden = v === 'in-person'; if (v === 'video') $('hm-room').value = 'Videoconference'; else if ($('hm-room').value === 'Videoconference') $('hm-room').value = roomFor(c, val('hm-off')); }
      if (id === 'hm-off' && val('hm-att') !== 'video') $('hm-room').value = roomFor(c, e.target.value); },
    body: (isNew ? fld('Case', 'hm-case', '', { ph: 'Start typing a case number or name', list: 'hm-cases', hint: 'Choose the case this hearing is for.' }) + dlist('hm-cases', cases.filter(k => !/closed|disposed/i.test(k.status || '')).map(caseLabel)) : '')
      + g2(`<label class="f"><span>Hearing type</span><input id="hm-type" value="${esc(h.type || '')}" list="hm-types" placeholder="e.g. Motion Hearing"></label><datalist id="hm-types"></datalist>`, fld('Date and time', 'hm-date', inDT(parse(h.date)), { type: 'datetime-local' }))
      + g2(`<label class="f"><span>Presiding officer</span><select id="hm-off"></select></label>`, fld('Location', 'hm-room', '', { hint: 'Follows the judge\'s courtroom: Chief Judge 1, Judge 2, Magistrate 3.' }))
      + g2(`<div id="hm-attw">${selF('How parties attend', 'hm-att', ATTEND, att0)}</div>`, `<label class="f"><span id="hm-minl">Length (minutes)</span><input id="hm-min" type="number" value="${esc(h.minutes || '')}" placeholder="${MINS[h.type] || 30}"></label>`)
      + `<div id="hm-vid"><label class="f"><span id="hm-urll">Video link</span><input id="hm-url" value="${esc(h.videoUrl || '')}" placeholder="https://…"><small>Parties see this on their hearing. Leave blank to tell them to contact the clerk.</small></label></div>`
      + fld('Requested by', 'hm-req', h.requestedBy || '', { ph: 'e.g. Defense Counsel, Court, Plaintiff' }) + area('Notes', 'hm-notes', h.notes || '')
      + `<label class="opt"><input type="checkbox" id="hm-over"><div><b>Schedule even if it conflicts</b><small>Only needed when the judicial officer or courtroom is already booked at this time.</small></div></label>`,
    onOk: async () => {
      if (isNew) { const m = cases.find(k => caseLabel(k) === val('hm-case') || k.caseId === val('hm-case')); if (!m) bad('Choose a case from the list.'); c = m; }
      const type = val('hm-type'), d = parse(val('hm-date')); if (!type || !d) bad('Enter a hearing type and a date and time.');
      const msc = isMsc(c), officer = val('hm-off') || c.judge || null, attendance = msc ? 'hybrid' : val('hm-att') || 'in-person', courtroom = !msc && attendance === 'video' ? 'Videoconference' : val('hm-room') || null;
      const o = { type, date: d.toISOString(), officer, courtroom, attendance, videoUrl: attendance === 'in-person' ? null : val('hm-url') || null, minutes: parseInt(val('hm-min'), 10) || null, requestedBy: val('hm-req') || null, notes: val('hm-notes') || null, result: null };
      const clash = hearingConflicts(o, c, x?.key); if (clash.length && !$('hm-over').checked) bad('Scheduling conflict: ' + clash.join('; ') + '. Check “Schedule even if it conflicts” to continue.');
      await hearingMutate(c, x ? x.h : null, old => ({ ...(old || {}), ...o }), isNew ? `Scheduled hearing: ${type} on ${fmtDate(d)}` : `Rescheduled hearing: ${type} to ${fmtDate(d)}`,
        () => ({ type: 'event', date: now(), description: isNew ? `Hearing scheduled: ${type} on ${fmtDT(d)}` : `Hearing rescheduled: ${type} — now ${fmtDT(d)}`, judge: officer }));
      await notify(c, { type: 'Notice of Hearing', title: 'Notice of Hearing', text: `${type} scheduled for ${fmtDT(d)} before ${officer || 'the assigned judicial officer'}. ${how(o, c)}` });
      note = `Hearing ${isNew ? 'scheduled' : 'updated'} for ${fmtDT(d)}. The parties were notified automatically.`; noteKind = 'ok';
    } });
  if (c) draw_(); else { $('hm-off').innerHTML = '<option value="">Choose a case first</option>'; $('hm-types').innerHTML = DTYPES.map(t => `<option value="${esc(t)}">`).join(''); $('hm-room').value = ''; $('hm-vid').hidden = att0 === 'in-person'; }
}
function resultModal(x) {
  const msc = isMsc(x.c);
  modal({ title: 'Record hearing result', sub: `${caption(x.c)} · ${x.h.type}`, ok: 'Save result', okCls: 'good',
    body: `<div class="quote">${esc(x.h.type)} — ${esc(fmtDT(x.when))}</div>` + fld('Result', 'rs-res', '', { ph: msc ? 'Argued, or Submitted without argument' : 'e.g. Motion granted, Adjourned', list: 'rs-list' }) + dlist('rs-list', msc ? ['Argued', 'Submitted without argument'] : ['Motion granted', 'Motion denied', 'Adjourned', 'Held — order to follow', 'Defendant failed to appear'])
      + (msc ? fld('Recording link (optional)', 'rs-rec', '', { ph: 'https://…', hint: 'Shown on the public oral arguments page.' }) : '') + area('Additional notes for the docket', 'rs-notes') + `<p class="m">Recorded by ${esc(account.name)} (${esc(role)}).</p>`,
    onOk: async () => { const result = val('rs-res'); if (!result) bad('Enter a result.'); const n = val('rs-notes');
      await hearingMutate(x.c, x.h, h => ({ ...h, result, ...(msc && val('rs-rec') ? { recordingUrl: val('rs-rec') } : {}) }), `Recorded hearing result: ${x.h.type} — ${result}`, () => ({ type: 'event', date: now(), description: `Hearing held: ${x.h.type} — Result: ${result}${n ? `. ${n}` : ''}`, judge: x.h.officer || x.c.judge || null }));
      note = 'Result recorded and added to the docket.'; noteKind = 'ok'; } });
}
function continueModal(x) {
  modal({ title: 'Continue hearing', sub: `${caption(x.c)} · ${x.h.type}`, ok: 'Continue hearing', body: `<div class="quote">Currently ${esc(fmtDT(x.when))}</div>` + fld('New date and time', 'ct-date', inDT(x.when), { type: 'datetime-local' }),
    onOk: async () => { const d = parse(val('ct-date')); if (!d) bad('Choose the new date and time.');
      await hearingMutate(x.c, x.h, h => ({ ...h, date: d.toISOString(), result: null, notes: (h.notes ? h.notes + ' — ' : '') + 'Continued from ' + fmtDate(x.when) }), `Continued hearing: ${x.h.type} to ${fmtDate(d)}`, () => ({ type: 'event', date: now(), description: `Hearing continued: ${x.h.type} — new date ${fmtDT(d)}`, judge: x.h.officer || x.c.judge || null }));
      await notify(x.c, { type: 'Notice of Hearing', title: 'Notice of Hearing (Continued)', text: `${x.h.type} originally set for ${fmtDT(x.when)} has been continued to ${fmtDT(d)}.` }); note = 'Hearing continued. The parties were notified automatically.'; noteKind = 'ok'; } });
}
function detail(x) {
  const h = x.h, st = stateOf(x), cf = conflicts.get(x.key), msc = isMsc(x.c), where = x.mode === 'video' ? 'Videoconference' : roomLabel(h.courtroom || x.c.courtroomNumber) || 'To be announced', live = st === 'upcoming' || st === 'needs';
  modal({ title: caption(x.c), sub: `${fmtLong(x.when)} at ${fmtTime(x.when)}`,
    body: `${cf ? `<div class="al"><b>Scheduling conflict.</b> ${cf.map(esc).join('; ')}.</div>` : ''}<dl class="kv"><div><dt>Case number</dt><dd>${esc(x.c.caseId)}</dd></div><div><dt>Hearing type</dt><dd>${esc(h.type || 'Hearing')}</dd></div><div><dt>Status</dt><dd>${PILL[st][1]}</dd></div>
      <div><dt>Judicial officer</dt><dd>${esc(h.officer || x.c.judge || 'Not assigned')}</dd></div><div><dt>Location</dt><dd>${esc(where)}</dd></div><div><dt>${msc ? 'Viewing' : 'Attendance'}</dt><dd>${esc(msc ? 'In person and livestream' : ATT[x.mode])}</dd></div>
      <div><dt>${msc ? 'Minutes per side' : 'Expected length'}</dt><dd>${x.mins >= 60 && !msc ? x.mins / 60 + ' hr' : x.mins + ' min'}</dd></div><div><dt>Requested by</dt><dd>${esc(h.requestedBy || '—')}</dd></div><div><dt>Court</dt><dd>${esc(x.c.court)}</dd></div></dl>
      ${h.videoUrl ? `<p><a href="${esc(h.videoUrl)}" target="_blank" rel="noopener">${msc ? 'Livestream' : 'Video'} link ↗</a></p>` : x.mode !== 'in-person' && live ? '<p class="m">No video link is set yet. Reschedule or edit the hearing to add one.</p>' : ''}
      ${h.recordingUrl ? `<p><a href="${esc(h.recordingUrl)}" target="_blank" rel="noopener">Recording ↗</a></p>` : ''}${hv(h.result) ? `<p><b>Result:</b> ${esc(h.result)}</p>` : ''}${hv(h.notes) ? `<p class="m">${esc(h.notes)}</p>` : ''}`,
    extra: `<a class="btn outline" href="${BASE}cases/manage/#${encodeURIComponent(x.c._id)}">Open case</a>${live ? '' : ''}${st !== 'cancelled' && !hv(h.result) ? `<button class="btn outline" type="button" data-a="ics:${esc(x.key)}">Add to calendar</button>` : ''}`
      + (st !== 'cancelled' ? `<button class="btn outline" type="button" data-a="edit:${esc(x.key)}">Reschedule or edit</button>` : '') + (live ? `<button class="btn outline" type="button" data-a="cont:${esc(x.key)}">Continue</button><button class="btn danger" type="button" data-a="cx:${esc(x.key)}">Cancel hearing</button>` : '')
      + (!hv(h.result) ? `<button class="btn good" type="button" data-a="res:${esc(x.key)}">✓ Record result</button>` : '') });
}
function ics(x) {
  const f = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`, t = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n'), e = new Date(x.when.getTime() + (isMsc(x.c) ? x.mins * 2 + 10 : x.mins) * 6e4);
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Michigan Courts//Online Portal//EN', 'BEGIN:VEVENT', `UID:${x.key}@migovt.org`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, `DTSTART:${f(x.when)}`, `DTEND:${f(e)}`,
    `SUMMARY:${t(`${x.h.type}: ${caption(x.c)}`)}`, `LOCATION:${t(x.mode === 'video' ? 'Videoconference' : [roomLabel(x.h.courtroom || x.c.courtroomNumber), x.c.court].filter(Boolean).join(', '))}`, `DESCRIPTION:${t(`Case ${x.c.caseId}. ${x.h.officer || ''}`)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = `hearing-${x.c.caseId.replace(/\W+/g, '-')}.ics`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ── Actions ────────────────────────────────────────────────────────── */
const byKey = k => all.find(x => x.key === k);
async function act(a) {
  const [n, ...r] = a.split(':'), v = r.join(':');
  try {
    if (n === 'view') { view = v; draw(); } else if (n === 'day') { sel = v; drawBody(); } else if (n === 'today') { const d = new Date(); ym = { y: d.getFullYear(), m: d.getMonth() }; sel = null; drawBody(); }
    else if (n === 'shift') { const d = new Date(ym.y, ym.m + Number(v), 1); ym = { y: d.getFullYear(), m: d.getMonth() }; sel = null; drawBody(); }
    else if (n === 'new') hearingModal(null, null); else if (n === 'open') detail(byKey(v)); else if (n === 'edit') hearingModal(byKey(v).c, byKey(v));
    else if (n === 'res') resultModal(byKey(v)); else if (n === 'cont') continueModal(byKey(v)); else if (n === 'ics') ics(byKey(v));
    else if (n === 'cx') { const x = byKey(v); if (await ask('Cancel hearing', `Cancel the ${esc(x.h.type)} on ${esc(fmtDT(x.when))}? The parties will be notified automatically.`, 'Cancel hearing', 'danger')) {
      await hearingMutate(x.c, x.h, h => ({ ...h, result: 'Cancelled' }), `Cancelled hearing: ${x.h.type} on ${fmtDate(x.when)}`, () => ({ type: 'event', date: now(), description: `Hearing cancelled: ${x.h.type} (was set for ${fmtDT(x.when)})` }));
      await notify(x.c, { type: 'Notice of Hearing', title: 'Notice of Hearing Cancelled', text: `The ${x.h.type} set for ${fmtDT(x.when)} has been cancelled.` }); flash('Hearing cancelled. The parties were notified automatically.'); } }
  } catch (e) { console.error(e); flash(errText(e), 'bad'); }
}
document.addEventListener('click', e => { if (dlg.contains(e.target)) return; const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a); });
const setF = (k, v) => { F[k] = v; drawBody(); };
document.addEventListener('input', e => { if (e.target.id === 'f-q') setF('q', e.target.value); });
document.addEventListener('change', e => { const m = { 'f-status': 'status', 'f-when': 'when', 'f-officer': 'officer', 'f-type': 'type', 'f-attend': 'attend', 'f-court': 'court' }[e.target.id]; if (m) setF(m, e.target.value); else if (e.target.id === 'f-mine') setF('mine', e.target.checked); });

try { await loadAll(); } catch (e) { console.error(e); }
draw();
}
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview | Online Portal</title>
<link rel="icon" type="image/png" href="/courts/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">

<body>

<aside class="sidebar" id="sidebar-root" aria-label="Portal navigation"><!-- injected by assets/js/sidebar.js --></aside>
<div class="scrim" id="scrim" hidden></div>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-root">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

      <div>
        <span class="topbar-eyebrow">Online Portal</span>
        <span class="topbar-page-title" id="topbar-title">Overview</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-date" id="topbar-date"></span>
      <div class="notif-wrap" id="notif-root"><!-- injected by assets/js/notifications.js --></div>
    </div>
  </header>

  <main class="page-body">
    <div class="page-head">
      <div><h2 id="page-title">Overview</h2><p id="page-subtitle">Your cases, hearings, and balances at a glance.</p></div>

    </div>
    <div id="page-body"><div class="loading-inline"><span class="spin-sm"></span>Loading…</div></div>
  </main>
</div>

<div class="auth-loading-overlay" id="auth-overlay" role="status">
  <div class="alo-title">Online Portal</div>
  <div class="spin"></div>
  <div>Verifying your session…</div>
</div>

<script type="module" src="/courts/online-services/portal/dashboard/assets/js/dashboard.js?v=3"></script>

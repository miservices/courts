<body>
<div class="sg-top"><b>Michigan Courts</b><span>Signature request</span></div>
<div class="sg-wrap" id="root"><div class="sg-card">Loading…</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { byId } from '/courts/online-services/portal/dashboard/assets/forms/registry.js?v=7';
import { mountForm } from '/courts/online-services/portal/dashboard/assets/forms/engine.js?v=22';
import { firebaseBackend } from '/courts/online-services/portal/dashboard/assets/forms/backend.js?v=10';
const app = initializeApp({ apiKey: "AIzaSyA8sUFIq81cs6uQvqduardpGJ4R2DxO8NQ", authDomain: "micourt-dada6.firebaseapp.com", projectId: "micourt-dada6", storageBucket: "micourt-dada6.firebasestorage.app", messagingSenderId: "1013564619997", appId: "1:1013564619997:web:8f259dab457915758f6f34" });
const be = firebaseBackend({ db: getFirestore(app), app }), root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const token = decodeURIComponent(location.hash.replace(/^#\/?/, '')).trim();
const fail = (t, m) => { root.innerHTML = `<div class="sg-card"><h1>${esc(t)}</h1><p>${esc(m)}</p></div>`; };
(async () => {
  if (!/^[a-z0-9]{20,40}$/.test(token)) return fail('This link is not valid', 'Check that you copied the whole link, or ask the court for a new one.');
  let l; try { l = await be.getSignLink(token); } catch (e) { console.error(e); return fail('We could not open this link', 'Check your connection and try again.'); }
  if (!l || l.status === 'revoked') return fail('This link is no longer active', 'The court cancelled it or it does not exist. Contact the court for a new one.');
  if (l.status === 'signed' || l.status === 'applied') return root.innerHTML = '<div class="sg-card sg-ok"><div class="tick" aria-hidden="true">✓</div><h1>Already signed</h1><p>Your signature was received. You do not need to do anything else.</p></div>';
  if (l.expiresAt < Date.now()) return fail('This link has expired', 'Signing links last 14 days. Contact the court for a new one.');
  const form = byId(l.formId); if (!form) return fail('This document type is not available', 'Contact the court.');
  const def = (await import(`/courts/online-services/portal/dashboard/assets/forms/${form.id}.js?v=20`)).default;
  let name = String(l.name || '').trim();
  root.innerHTML = `<div class="sg-card"><h1>${esc(l.title)}</h1><p>The court has asked <b>${esc(name)}</b> to sign this document. You do not need an account. Read it, then click each signature line you are asked to sign.</p>
    <div class="sg-chips" id="chips"></div><p class="sg-note">This link is private to you. Do not share it. It expires ${esc(new Date(l.expiresAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }))}.</p></div>
    <div id="fd-host"></div>
    <div class="sg-bar"><p id="st"></p><button class="btn" type="button" id="go" disabled>Submit my signature</button></div>`;
  const eng = await mountForm(def, document.getElementById('fd-host'), { account: { name, uid: 'link:' + token }, role: 'Guest', uid: 'link:' + token, readOnly: true, signKeys: l.keys, md: l.md, actions: [], signature: '', sigPref: 'slash', onSaveSig: async () => { }, onRemoveSig: async () => { }, onSavePref: async () => { }, fileLabel: 'File', favs: [], onFavs: () => { } });
  const paint = () => { const ls = eng.sigLines().filter(x => l.keys.includes(x.key)), done = ls.every(x => x.signed);
    document.getElementById('chips').innerHTML = ls.map(x => `<em class="${x.signed ? 'ok' : ''}">${esc(x.label)} · ${x.signed ? 'signed' : 'to sign'}</em>`).join('');
    document.getElementById('st').textContent = done ? 'All your lines are signed. Submit to send them to the court.' : `Sign ${ls.filter(x => !x.signed).length} more line${ls.filter(x => !x.signed).length === 1 ? '' : 's'} to continue.`;
    const b = document.getElementById('go'); if (!b.dataset.busy) b.disabled = !done; };
  paint(); const t = setInterval(paint, 600);
  document.getElementById('go').onclick = async e => { const b = e.currentTarget; b.dataset.busy = '1'; b.disabled = true; b.textContent = 'Sending…';
    try { clearInterval(t); await be.submitSignLink(token, eng.getMd(), name); eng.destroy(); root.innerHTML = '<div class="sg-card sg-ok"><div class="tick" aria-hidden="true">✓</div><h1>Thank you</h1><p>Your signature was sent to the court. You can close this page.</p></div>'; }
    catch (er) { console.error(er); delete b.dataset.busy; b.textContent = 'Submit my signature'; document.getElementById('st').textContent = 'We could not send your signature. Check your connection and try again.'; setInterval(paint, 600); paint(); } };
})().catch(e => { console.error(e); fail('Something went wrong', 'Reload the page. If it keeps happening, contact the court.'); });
</script>

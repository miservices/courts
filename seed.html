<!DOCTYPE html>
<html>

      projectId: "micourt-dada6",

          filingParty: "officer_banks08",
          opposingParty: "CripplingR4T",

        // Events
        await addDoc(collection(case1Ref, "events"), {
          date: "2026-01-01",
          actor: "Plaintiff",
          description: "Civil complaint filed alleging negligence and property damage."
        });

        await addDoc(collection(case1Ref, "events"), {
          date: "2026-03-22",
          actor: "Court",

        await setDoc(case3Ref, {

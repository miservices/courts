<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore Data Seeder</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --text: #0f172a;
            --success: #16a34a;
            --error: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: #475569;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #logArea {
            margin-top: 1.5rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #f1f5f9;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
        }

        .log-entry { margin-bottom: 0.5rem; }
        .log-success { color: var(--success); }
        .log-error { color: var(--error); }
        .log-info { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seed Database</h1>
        <p>Click the button below to inject sample data into the <strong>"cases"</strong> collection.</p>
        
        <button id="seedBtn">Seed Data</button>

        <div id="logArea">
            <div class="log-entry">Waiting to start...</div>
        </div>
    </div>

    <!-- Firebase SDKs (v10+ Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA8sUFIq81cs6uQvqduardpGJ4R2DxO8NQ",
            authDomain: "micourt-dada6.firebaseapp.com",
            projectId: "micourt-dada6",
            storageBucket: "micourt-dada6.firebasestorage.app",
            messagingSenderId: "1013564619997",
            appId: "1:1013564619997:web:8f259dab457915758f6f34",
            measurementId: "G-HBJ0KGV2SE"
        };

        // Initialize Firebase and Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const seedBtn = document.getElementById('seedBtn');
        const logArea = document.getElementById('logArea');

        // Helper function to log messages to the UI
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // Sample Data for "cases"
   const sampleCases = [
  {
    caseId: "26-48289",
    court: "Genesee Co. District Court",
    caseType: "Criminal",
    status: "Open",

    dates: {
      filed: "2026-04-10",
      closed: null,
      lastUpdated: new Date().toISOString()
    },

    judge: "Hon. Sarah Jenkins",

    // 👥 Parties
    parties: {
      primaryPlaintiff: {
        name: "State of Michigan",
        role: "Plaintiff"
      },
      primaryDefendant: {
        name: "John Doe",
        role: "Defendant"
      },
      additionalParties: [
        {
          name: "Jane Witness",
          role: "Witness"
        }
      ]
    },

    // ⚖️ Charges / Claims / Torts
    charges: [
      {
        title: "Assault",
        statute: "MCL 750.81",
        count: 1,
        level: "Misdemeanor",
        status: "Pending",
        arraignmentDate: "2026-04-12",
        notes: "Defendant pleaded not guilty"
      }
    ],

    // 💰 Financial Orders (fines/fees)
    financialOrders: [
      {
        orderId: "FO-001",
        type: "Fine",
        description: "Court Fine",
        amount: 500,
        owedBy: "Defendant",
        status: "Unpaid",
        issuedDate: "2026-04-15",

        payments: [
          {
            paymentId: "PMT-001",
            amount: 100,
            paidBy: "Defendant",
            method: "Card",
            waived: false,
            date: "2026-04-20",
            notes: "Partial payment"
          }
        ]
      }
    ],

    // 🪙 Bonds
    bonds: {
      amount: 1000,
      posted: true,
      postedBy: "Defendant",
      postedDate: "2026-04-10",
      bondType: "Cash",
      conditions: ["No contact with victim"],
      judge: "Hon. Sarah Jenkins"
    },

    // 🏛️ Hearings
    hearings: [
      {
        type: "Arraignment",
        date: "2026-04-12T09:00:00",
        officer: "Hon. Sarah Jenkins",
        result: "Not Guilty Plea Entered",
        notes: "Bond set at $1,000"
      }
    ],

    // ⚖️ Sentencing (only if criminal)
    sentencing: {
      applicable: false,
      sentenceDate: null,
      jailTimeDays: null,
      probationMonths: null,
      finesTotal: null,
      restitution: null,
      notes: null
    },

    // 📄 Filings
    filings: [
      {
        title: "Complaint",
        filedBy: "State of Michigan",
        role: "Plaintiff",
        dateFiled: "2026-04-10T08:30:00",
        documentLink: "https://drive.google.com/example1",
        notes: "Initial charging document"
      }
    ]
  }
];
        // Seeding Logic
        async function seedDatabase() {
            seedBtn.disabled = true;
            seedBtn.textContent = "Seeding...";
            logArea.innerHTML = ''; // Clear logs
            log("Starting data seed...", "info");

            const casesRef = collection(db, "cases");
            let successCount = 0;

            for (const caseData of sampleCases) {
                try {
                    const docRef = await addDoc(casesRef, caseData);
                    log(`Added document with ID: ${docRef.id}`, "success");
                    successCount++;
                } catch (error) {
                    console.error("Error adding document: ", error);
                    log(`Error adding ${caseData.caseNumber}: ${error.message}`, "error");
                }
            }

            log(`Finished! Successfully added ${successCount}/${sampleCases.length} records.`, "info");
            seedBtn.disabled = false;
            seedBtn.textContent = "Seed Data Again";
        }

        // Event Listener
        seedBtn.addEventListener('click', seedDatabase);
    </script>
</body>
</html>

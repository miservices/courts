        // Seeding Logic
       async function seedDatabase() {
    seedBtn.disabled = true;
    seedBtn.textContent = "Seeding...";
    logArea.innerHTML = '';
    log("Starting data seed...", "info");

    let successCount = 0;

    for (const caseData of sampleCases) {
        try {
            // 🔑 Use caseId as the document ID
            const caseRef = doc(db, "cases", caseData.caseId);

            await setDoc(caseRef, caseData);

            log(`Added case: ${caseData.caseId}`, "success");
            successCount++;
        } catch (error) {
            console.error("Error adding document: ", error);
            log(`Error adding ${caseData.caseId}: ${error.message}`, "error");
        }
    }

    log(`Finished! Successfully added ${successCount}/${sampleCases.length} records.`, "info");
    seedBtn.disabled = false;
    seedBtn.textContent = "Seed Data Again";
}
        // Event Listener
        seedBtn.addEventListener('click', seedDatabase);
    </script>
